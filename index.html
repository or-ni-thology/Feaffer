<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Feaffer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    /* The universal ground — the whole website's Northumberland-sky grey. */
    --ground: #e6eaec;
    /* The control sheet. Flip to #f2f0ea for a warm-paper panel; leave as
       var(--ground) to keep everything on the one grey. One word to change. */
    --sheet:  var(--ground);

    --ink:   #2b2a24;   /* flat ink */
    --sepia: #6f5f43;   /* the mono labels */
    --moor:  #4a5340;   /* the single accent, used sparingly */
    --rust:  #8c5a3c;   /* the Particular — readouts only */
    --line:  #c3c7c3;   /* the field-plate rule, sat on grey */
    --faint: #7c7a70;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    min-height: 100%;
    background: var(--ground);
    color: var(--ink);
    font-family: 'EB Garamond', Georgia, serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;   /* the page never scrolls sideways; the drawers do */
  }

  /* The whole instrument is one fixed viewport laid out top to bottom: a slim
     provenance header, the feather standing in the middle, and the faffing
     drawers gathered at the foot where the thumb rests. Nothing scrolls up
     and down — the two drawers slide sideways instead. */
  /* A neat closed panel sized to its own content, so an embedding iframe can
     be told exactly how tall to be (see the height-whisper at the foot of the
     script) — no guessed heights, no letterboxing, no double scrollbars. */
  .frame {
    max-width: 560px; margin: 0 auto;
    display: flex; flex-direction: column;
    border: 1px solid var(--line);
    overflow: hidden;
  }

  /* ——— the provenance header: seed a feather, or take the one you have ——— */
  .head {
    background: var(--sheet);
    padding: .8rem clamp(.9rem, 4vw, 1.4rem) .75rem;
    border-bottom: 1px solid var(--line);
    display: flex; flex-direction: column; gap: .55rem;
  }
  .head input[type=text]{
    width: 100%; background: transparent; border: 1px solid var(--line);
    padding: .55rem .7rem; font-family: 'IBM Plex Mono', monospace;
    font-size: .82rem; letter-spacing: .06em; color: var(--ink);
  }
  .head input:focus { outline: 1px solid var(--moor); }
  .btns { display: flex; gap: .5rem; }
  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .64rem; letter-spacing: .1em; text-transform: uppercase;
    padding: .55rem .6rem; cursor: pointer; flex: 1;
    background: var(--moor); color: var(--ground);
    border: 1px solid var(--moor); transition: background .15s;
    white-space: nowrap;
  }
  button:hover { background: #3a4232; }
  button.ghost { background: transparent; color: var(--moor); }
  button.ghost:hover { background: #4a534014; }
  button:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }

  /* ——— the stage: the feather stands here and fills whatever is left ——— */
  .stage {
    height: clamp(300px, 88vw, 460px);   /* the feather's room — scales with width, not viewport height */
    background: var(--ground);
    display: flex; align-items: center; justify-content: center;
    padding: 1rem;
  }
  #feather { display: block; height: 100%; width: auto; max-width: 100%; }

  /* ——— a faffing drawer: a bordered row of fixed cells you swipe sideways.
     A control that wants more room goes LONG — another cell — never TALL, so
     every cell keeps the same height and the drawer stays a clean band. ——— */
  .drawer {
    display: flex;
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    border-top: 1px solid var(--line);
    background: var(--sheet);
    scrollbar-width: none;
  }
  .drawer::-webkit-scrollbar { height: 0; }

  /* the drawer's name, held to the left edge so you always know which band
     you are faffing even after you have swiped a way along it */
  .rail {
    flex: 0 0 auto;
    position: sticky; left: 0; z-index: 2;
    background: var(--sheet);
    width: 58px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .58rem; letter-spacing: .18em; text-transform: uppercase;
    color: var(--sepia);
    writing-mode: vertical-rl; transform: rotate(180deg);
  }

  /* one cell of the bench */
  .card {
    flex: 0 0 auto;
    width: 150px; height: 84px;
    border-right: 1px solid var(--line);
    padding: .6rem .7rem;
    display: flex; flex-direction: column; justify-content: center; gap: .3rem;
  }
  .card:last-child { border-right: none; }
  .card .cap { display: flex; justify-content: space-between; align-items: baseline; gap: .3rem; }
  .card label, .card .cap > span:first-child {
    font-size: .9rem; line-height: 1.15;
  }
  .card .val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .62rem; color: var(--rust); white-space: nowrap;
  }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 1px; background: var(--line);
    outline: none; cursor: pointer; margin: .2rem 0 .1rem;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--ground); border: 1.5px solid var(--moor);
  }
  input[type=range]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--ground); border: 1.5px solid var(--moor);
  }
  input[type=range]:disabled { opacity: .3; cursor: not-allowed; }

  /* a cell that holds two pigment wells side by side */
  .swatchcard .swatches { display: flex; gap: .4rem; align-items: center; }
  input[type=color] {
    -webkit-appearance: none; appearance: none; border: 1px solid var(--line);
    width: 40px; height: 28px; padding: 0; background: none; cursor: pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border: none; }
  input[type=color]:disabled { opacity: .3; cursor: not-allowed; }

  /* the iridescence switch — a cell you tap to light the sheen controls */
  .actcard { cursor: pointer; user-select: none; }
  .actcard .actrow { display: flex; align-items: center; gap: .45rem; }
  .actcard input { accent-color: var(--moor); width: 17px; height: 17px; cursor: pointer; }
  .actcard .actstate {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .58rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint);
  }

</style>
</head>
<body>
<main class="frame">

  <header class="head">
    <input type="text" id="coord" value="SD 9421 7638" spellcheck="false" aria-label="Grid reference — a coordinate seeds a specific feather">
    <div class="btns">
      <button id="conjure">Conjure from grid</button>
      <button id="random" class="ghost">Wander</button>
      <button id="save" class="ghost">Take specimen &darr;</button>
    </div>
  </header>

  <section class="stage">
    <svg id="feather" viewBox="0 0 400 640" preserveAspectRatio="xMidYMid meet" aria-label="A generated feather specimen"></svg>
  </section>

  <!-- ——— FORM: the shape of the thing you swipe through ——— -->
  <div class="drawer" role="group" aria-label="Form">
    <div class="rail">Form</div>

    <div class="card" title="how far the shaft reaches from calamus to tip">
      <div class="cap"><label for="len">Rachis length</label><span class="val" id="len-v"></span></div>
      <input type="range" id="len" min="380" max="600" value="520">
    </div>
    <div class="card" title="the wind it grew against">
      <div class="cap"><label for="curve">Shaft curvature</label><span class="val" id="curve-v"></span></div>
      <input type="range" id="curve" min="-90" max="90" value="24">
    </div>
    <div class="card" title="how broad the vane blooms">
      <div class="cap"><label for="width">Vane breadth</label><span class="val" id="width-v"></span></div>
      <input type="range" id="width" min="30" max="130" value="78">
    </div>
    <div class="card actcard" id="apexcard" role="button" tabindex="0"
         title="the apex family — every feather closes one of three ways: rounded (a dome), acuminate (a point), truncate (a square cut)">
      <div class="cap"><span>Apex</span><span class="val" id="apextype-v"></span></div>
      <div class="actrow"><span class="actstate">tap to turn the family</span></div>
    </div>
    <div class="card" title="the degree within the family — fullness of the dome, fineness of the point, or the corner of the cut">
      <div class="cap"><label for="apex" id="apex-label">Fullness</label><span class="val" id="apex-v"></span></div>
      <input type="range" id="apex" min="0" max="100" value="35">
    </div>
    <div class="card" title="leading edge narrows — the mark of a flight feather">
      <div class="cap"><label for="asym">Vane asymmetry</label><span class="val" id="asym-v"></span></div>
      <input type="range" id="asym" min="0" max="100" value="0">
    </div>
    <div class="card" title="the angle the barbs comb off the shaft">
      <div class="cap"><label for="angle">Barb angle</label><span class="val" id="angle-v"></span></div>
      <input type="range" id="angle" min="20" max="72" value="46">
    </div>
    <div class="card" title="how many barbs comb the vane">
      <div class="cap"><label for="density">Barb density</label><span class="val" id="density-v"></span></div>
      <input type="range" id="density" min="30" max="170" value="100">
    </div>
    <div class="card" title="soft, disordered barbs at the base">
      <div class="cap"><label for="down">Plumaceous down</label><span class="val" id="down-v"></span></div>
      <input type="range" id="down" min="0" max="45" value="18">
    </div>
    <div class="card" title="the fraying and gaps of a feather that has flown">
      <div class="cap"><label for="wear">Age &amp; wear</label><span class="val" id="wear-v"></span></div>
      <input type="range" id="wear" min="0" max="100" value="22">
    </div>
  </div>

  <!-- ——— COLOUR: pigment, pattern and the structural sheen ——— -->
  <div class="drawer" role="group" aria-label="Colour">
    <div class="rail">Colour</div>

    <div class="card swatchcard" title="base &amp; shadow of the barbs">
      <div class="cap"><span>Ground &amp; shade</span></div>
      <div class="swatches">
        <input type="color" id="pig1" value="#6a5333" aria-label="Ground tone">
        <input type="color" id="pig2" value="#3a2c18" aria-label="Shade tone">
      </div>
    </div>
    <div class="card" title="dark bands across the vane">
      <div class="cap"><label for="bars">Barring</label><span class="val" id="bars-v"></span></div>
      <input type="range" id="bars" min="0" max="12" value="0">
    </div>
    <div class="card" title="draw the bars onto one web of the vane only">
      <div class="cap"><label for="barside">Bar side</label><span class="val" id="barside-v"></span></div>
      <input type="range" id="barside" min="0" max="100" value="0">
    </div>
    <div class="card" title="ragged, mottled bar edges instead of clean bands">
      <div class="cap"><label for="baredge">Bar edge</label><span class="val" id="baredge-v"></span></div>
      <input type="range" id="baredge" min="0" max="100" value="0">
    </div>
    <div class="card" title="a dark tip, as on a grouse or pheasant">
      <div class="cap"><label for="tipband">Terminal band</label><span class="val" id="tipband-v"></span></div>
      <input type="range" id="tipband" min="0" max="40" value="0">
    </div>
    <div class="card" title="flecks &amp; splodges grown into the barbs themselves">
      <div class="cap"><label for="speck">Spots &amp; splodges</label><span class="val" id="speck-v"></span></div>
      <input type="range" id="speck" min="0" max="100" value="0">
    </div>
    <div class="card" title="the ocellus — a peacock's eye, grown into the barbs; past 100 it goes GIANT, taking its scale from the feather's whole length, until the rings are country the feather merely crosses">
      <div class="cap"><label for="eye">Eyespot</label><span class="val" id="eye-v"></span></div>
      <input type="range" id="eye" min="0" max="300" value="0">
    </div>
    <div class="card swatchcard" title="the heart of the eye &amp; the halo around it — a heart matched to the ground pigment sinks into the vane, leaving bare halo">
      <div class="cap"><span>Eye colours</span></div>
      <div class="swatches">
        <input type="color" id="eyecol" value="#1d3f8f" aria-label="Eye heart colour">
        <input type="color" id="eyecol2" value="#8a6a2f" aria-label="Eye halo colour">
      </div>
    </div>
    <div class="card" title="where along the shaft the eye sits — past 100 it slips off the tip until only its lower rim clings on; below 0 it stands off the quill, and a giant's ring arcs cross the vane as bands">
      <div class="cap"><label for="eyepos">Eye position</label><span class="val" id="eyepos-v"></span></div>
      <input type="range" id="eyepos" min="-40" max="108" value="70">
    </div>
    <div class="card" title="cast the eye toward one web — at full cast only its rings still lap the vane's edge; the jay's trick">
      <div class="cap"><label for="eyeside">Eye cast</label><span class="val" id="eyeside-v"></span></div>
      <input type="range" id="eyeside" min="-100" max="100" value="0">
    </div>

    <label class="card actcard" title="a structural sheen">
      <div class="cap"><span>Iridescence</span></div>
      <div class="actrow"><input type="checkbox" id="irid"><span class="actstate">a structural sheen</span></div>
    </label>
    <div class="card swatchcard" title="two hues it shifts between">
      <div class="cap"><span>Sheen colours</span></div>
      <div class="swatches">
        <input type="color" id="iridcol" value="#1f6f8c" aria-label="Sheen colour" disabled>
        <input type="color" id="iridcol2" value="#5e2f7a" aria-label="Second sheen colour" disabled>
      </div>
    </div>
    <div class="card" title="where along the vane it pools">
      <div class="cap"><label for="iridpos">Sheen position</label><span class="val" id="iridpos-v"></span></div>
      <input type="range" id="iridpos" min="0" max="100" value="65" disabled>
    </div>
    <div class="card" title="how far the sheen spreads">
      <div class="cap"><label for="iridspread">Sheen spread</label><span class="val" id="iridspread-v"></span></div>
      <input type="range" id="iridspread" min="10" max="100" value="45" disabled>
    </div>
    <div class="card" title="how strong the sheen burns">
      <div class="cap"><label for="iridstr">Sheen strength</label><span class="val" id="iridstr-v"></span></div>
      <input type="range" id="iridstr" min="10" max="100" value="60" disabled>
    </div>
  </div>

</main>

<script>
/* ---- seeded randomness ---- */
function hashStr(s){ let h=1779033703^s.length;
  for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return (h^=h>>>16)>>>0; };
}
function mulberry(seed){ let a=seed; return ()=>{ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// a dedicated, replayable rng for the *drawing* so tweaks don't flicker.
let drawSeed = 12345;

// the apex family — feather tips are categorical, not a slide: field guides
// say ROUNDED, ACUMINATE, TRUNCATE, and each closes by its own mechanism
// (a dome wraps, a point tapers, a square cut shears). 0 · 1 · 2.
let apexType = 0;
function freshDraw(){ return mulberry(drawSeed); }

const $ = id => document.getElementById(id);
const P = {
  len:$('len'), curve:$('curve'), width:$('width'), apex:$('apex'), asym:$('asym'), angle:$('angle'),
  density:$('density'), down:$('down'), wear:$('wear'),
  bars:$('bars'), barside:$('barside'), baredge:$('baredge'), tipband:$('tipband'), speck:$('speck'),
  eye:$('eye'), eyepos:$('eyepos'), eyeside:$('eyeside'),
  iridpos:$('iridpos'), iridspread:$('iridspread'), iridstr:$('iridstr')
};

/* colour helpers */
function hexToRgb(h){ const n=parseInt(h.slice(1),16); return {r:n>>16&255,g:n>>8&255,b:n&255}; }
function mix(a,b,t){ return {r:a.r+(b.r-a.r)*t, g:a.g+(b.g-a.g)*t, b:a.b+(b.b-a.b)*t}; }
function rgbStr(c){ return `rgb(${c.r|0} ${c.g|0} ${c.b|0})`; }
function darken(c,f){ return {r:c.r*f,g:c.g*f,b:c.b*f}; }

/* ---- the growing of a feather ---- */
function drawFeather(){
  const svg = $('feather');
  const W = 400, H = 640;
  const cx = W/2;
  const baseY = H - 40, tipReach = +P.len.value;
  const tipY = baseY - tipReach;
  const TIP_ZONE = 0.76;   // where the barbs begin sweeping forward over the tip
  const RACHIS_END = 0.9;  // the visible quill stops here; barbs close the tip

  const curvature = +P.curve.value;
  const vaneW = +P.width.value;
  const apexDeg = +P.apex.value/100;              // the degree within the apex family
  const asym = +P.asym.value/100;                 // 0 symmetric .. 1 strong flight feather
  const barbAngle = +P.angle.value * Math.PI/180;
  const nBarbs = +P.density.value;
  const downFrac = +P.down.value/100;
  const wear = +P.wear.value/100;
  const nBars = +P.bars.value;
  const tipBand = +P.tipband.value/100;
  const barBias = +P.barside.value/100;   // 0 bars on both webs .. 1 one web only
  const barEdge = +P.baredge.value/100;   // 0 crisp bands .. 1 ragged, mottled
  const speck = +P.speck.value/100;
  const eyeSize = +P.eye.value/100;       // 0 no ocellus .. 1 the vane's breadth .. 3 truly giant
  const eyeT = +P.eyepos.value/100;       // where along the shaft the eye sits
  const eyeSide = +P.eyeside.value/100;   // the cast: 0 a true eye .. ±1 sent off a web

  const pig1 = hexToRgb($('pig1').value);
  const pig2 = hexToRgb($('pig2').value);

  const iridOn = $('irid').checked;
  const iridPos = +P.iridpos.value/100;
  const iridSpread = +P.iridspread.value/100;
  const iridStr = +P.iridstr.value/100;

  const rng = freshDraw();  // replayable each render
  // a second, independent stream for the fluff: the main stream's draw order
  // is a specimen's identity (its wear gaps, its barb jitter), so the down
  // wanders on its own replayable stream and faffing it never re-rolls the vane.
  const drng = mulberry((drawSeed ^ 0x9E3779B9) >>> 0);

  // barbules pool here — one shared path for the whole feather, so a cloud
  // of micro-wisps costs the SVG almost nothing.
  let fluffD = '';

  // a wandering strand: chained gentle turns around a per-strand curl, with a
  // whisper of droop — the shape of down. Draws only from the fluff stream.
  function strand(x0, y0, dx0, dy0, len, wildness){
    const segs = 4;
    let px=x0, py=y0, dx=dx0, dy=dy0;
    const curl = (drng()-0.5)*2.6*wildness;   // the strand's own persuasion
    const pts = [[px,py]];
    for(let k=0;k<segs;k++){
      const turn = curl/segs + (drng()-0.5)*0.45*wildness;
      const ct=Math.cos(turn), st=Math.sin(turn);
      const ndx=dx*ct-dy*st, ndy=dx*st+dy*ct+0.08;   // +0.08 is gravity's word
      const dm=Math.hypot(ndx,ndy)||1; dx=ndx/dm; dy=ndy/dm;
      const sl=(len/segs)*(0.8+drng()*0.4);
      px+=dx*sl; py+=dy*sl; pts.push([px,py]);
    }
    let d=`M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for(let k=1;k<segs;k++){
      const hx=(pts[k][0]+pts[k+1][0])/2, hy=(pts[k][1]+pts[k+1][1])/2;
      d+=` Q ${pts[k][0].toFixed(1)} ${pts[k][1].toFixed(1)} ${hx.toFixed(1)} ${hy.toFixed(1)}`;
    }
    d+=` L ${pts[segs][0].toFixed(1)} ${pts[segs][1].toFixed(1)}`;

    // barbules — the micro-wisps that make down down. Interior points of the
    // strand sprout a curl or two, curving away harder than they leave.
    for(let k=1;k<pts.length;k++){
      const pdx=pts[k][0]-pts[k-1][0], pdy=pts[k][1]-pts[k-1][1];
      const pm=Math.hypot(pdx,pdy)||1;
      for(const j of [1,-1]){
        if(drng() > 0.85) continue;
        const rot=j*(0.35+drng()*0.45), blen=len*(0.07+drng()*0.13);
        const cr=Math.cos(rot), sr=Math.sin(rot);
        const bdx=(pdx*cr-pdy*sr)/pm, bdy=(pdx*sr+pdy*cr)/pm;
        const er=Math.cos(rot*1.7), es=Math.sin(rot*1.7);
        const edx=(pdx*er-pdy*es)/pm, edy=(pdx*es+pdy*er)/pm;
        const bx=pts[k][0], by=pts[k][1];
        fluffD += `M ${bx.toFixed(1)} ${by.toFixed(1)} Q ${(bx+bdx*blen*0.6).toFixed(1)} ${(by+bdy*blen*0.6).toFixed(1)} ${(bx+edx*blen).toFixed(1)} ${(by+edy*blen).toFixed(1)}`;
      }
    }
    return d;
  }

  // rachis quadratic
  const ctrlX = cx + curvature, ctrlY = (baseY + tipY)/2;
  const rachis = t => { const mt=1-t; return {
    x: mt*mt*cx + 2*mt*t*ctrlX + t*t*cx,
    y: mt*mt*baseY + 2*mt*t*ctrlY + t*t*tipY }; };
  const rachisTangent = t => {
    const dx=2*(1-t)*(ctrlX-cx)+2*t*(cx-ctrlX), dy=2*(1-t)*(ctrlY-baseY)+2*t*(tipY-ctrlY);
    const m=Math.hypot(dx,dy)||1; return {x:dx/m,y:dy/m}; };

  // THE APEX FAMILIES — a feather's tip is categorical, not a slide. The
  // continuous pointy-to-roundy blend was retired after a long season of
  // lumps: its midrange always ran two closing mechanisms at once, and the
  // failures lived in the mixture. Field guides know three families, each
  // with its own mathematics and its own way of closing:
  //   ROUNDED   — a superellipse crown, u^p + w² = 1, convex for every
  //               p ≥ 1, nowhere to hollow. The degree sweeps p: a slender
  //               parabolic dome, through the egg-shaped crown of a little
  //               downy feather, to breadth held late over a blunt paddle.
  //               The base exponent is sized in PIXELS so the dome turns
  //               over as deep along the shaft as the vane is wide across —
  //               a magpie's tail stays round at any length. Closes by
  //               WRAP (the fan, below).
  //   ACUMINATE — a taper, (1-u)^k. The degree is fineness: it draws the
  //               widest point down the shaft and steepens k from a soft
  //               convex point to the sweeping, gently-CONCAVE needle of a
  //               pheasant's tail — concavity is honest here; it is what
  //               acuminate means. Closes by TAPER alone: no fan, the
  //               barbs simply shorten to nothing.
  //   TRUNCATE  — the rounded body, but the vane simply ENDS: barbs shear
  //               off along a growth contour (the terminal band's chevron,
  //               reused as scissors). The degree is the corner — a smooth
  //               minimum against the outline cut rounds where the cut
  //               meets the side, crisp square to soft-shouldered. Vane
  //               asymmetry skews the cut toward a parallelogram unaided.
  const peak = apexType===1 ? 0.63 - apexDeg*0.24 : 0.63;
  const latK = Math.cos(barbAngle);   // the across-vane share of a barb's length
  const pBase = (1-peak)*tipReach/(vaneW*latK);
  const pApex = apexType===2 ? Math.max(2.5, pBase*1.15)
              : Math.max(1.4 + apexDeg*0.6, pBase*(0.6 + apexDeg*1.2));
  const kFine = 0.9 + apexDeg*1.3;
  function widthAt(t){
    if(t >= 1) return 0;
    let w;
    if(t < peak){
      const u = t/peak;
      w = Math.sin(u*Math.PI/2);          // ease up to full — rounded, not angular
      w = Math.pow(w, 0.85);
    } else {
      const u = (t-peak)/(1-peak);
      w = apexType===1 ? Math.pow(1-u, kFine)
                       : Math.sqrt(Math.max(0, 1 - Math.pow(u, pApex)));
    }
    return Math.max(0, w) * vaneW;
  }
  // the truncate scissors: the cut sits on a growth contour, and the degree
  // is the corner's radius — the smoothing of min(outline, shear) where the
  // side of the vane meets the cut edge
  const gCut = 0.96;
  const cornerR = (0.02 + apexDeg*0.22)*tipReach;
  function smin(a,b,k){ const h=Math.max(0, 1-Math.abs(a-b)/k); return Math.min(a,b) - h*h*k*0.25; }
  // per-side breadth: asymmetry steals width from the leading (right) side, gives to trailing
  function sideWidth(t, side){
    const base = widthAt(t);
    if(side>0) return base * (1 - asym*0.62);   // leading edge narrower
    return base * (1 + asym*0.42);              // trailing edge broader
  }

  // a point on the vane's outline — the fan lands its barbs here, and wants
  // the outline's own direction so their arcs can arrive along it
  function outlineAt(tt, side){
    const p = rachisPt(tt); const w = sideWidth(tt, side)*latK;
    return { x: p.x + p.norm.x*side*w, y: p.y + p.norm.y*side*w };
  }

  // wear beyond missing barbs: a flown feather UNZIPS — neighbouring barbs
  // let go of one another and the vane edge bites in a V-shaped notch. The
  // notches live on their own stream (like the fluff) so a specimen's vane
  // identity — its wear gaps, its jitter — stays exactly put.
  const nrng = mulberry((drawSeed ^ 0x51633E2D) >>> 0);
  const notches = [];
  for(let i=0, n=Math.floor(wear*7); i<n; i++){
    notches.push({ tc: 0.15+nrng()*0.8, side: nrng()<0.5?1:-1,
                   ht: 0.015+nrng()*0.05, dp: 0.3+nrng()*0.55 });
  }
  function notchFactor(t, side){
    let f = 1;
    for(const nt of notches){
      if(nt.side!==side) continue;
      const dd = Math.abs(t-nt.tc);
      if(dd < nt.ht) f = Math.min(f, 1 - nt.dp*(1-dd/nt.ht));
    }
    return f;
  }

  // rachis drifts toward the leading edge under asymmetry
  const rachisShift = asym * vaneW * 0.22;
  function rachisPt(t){ const p=rachis(t); const tan=rachisTangent(t); const norm={x:-tan.y,y:tan.x};
    return { x:p.x + norm.x*rachisShift, y:p.y + norm.y*rachisShift, tan, norm }; }

  // the VISIBLE quill stops at RACHIS_END so the tip is closed by barbs.
  let shaftD = '';
  { const p0=rachisPt(0); shaftD=`M ${p0.x.toFixed(1)} ${p0.y.toFixed(1)}`;
    for(let i=1;i<=40;i++){ const u=i/40, p=rachisPt(u);
      if(u<=RACHIS_END) shaftD+=` L ${p.x.toFixed(1)} ${p.y.toFixed(1)}`; } }

  // barbs — the rows they comb from. Over a ROUNDED crown the closing fan
  // spreads each row across more outline than the shaft-spacing supplies
  // (the same strokes, swept over the whole dome), so the tip of a rounded
  // feather used to thin out just where it turned over. The crown drinks
  // interleaved half-step rows to keep the weave even up and across it.
  const rows = [];
  for(let i=0;i<nBarbs;i++){
    const t = i/(nBarbs-1);
    rows.push(t);
    if(apexType===0 && t>TIP_ZONE && i<nBarbs-1) rows.push(t + 0.5/(nBarbs-1));
  }
  const barbLines = [];
  const leftPts=[], rightPts=[];   // vane outline for iridescence clip
  for(const t of rows){
    if(t < 0.04) continue;
    const rp = rachisPt(t);
    const downy = t < downFrac;
    const ang = downy ? barbAngle*1.5 : barbAngle;
    const up = rp.tan, norm = rp.norm;

    // as a barb nears the tip its TIP is drawn toward the end of the rachis,
    // so the two sides fan over and close the tip with barbs rather than
    // with the rachis (Streit & Heidrich's fanned tip). The pull is on the
    // endpoint, not the length — a lengthened barb at an unturned angle was
    // what used to poke sideways past the envelope and bulge under the apex.
    const tf = t <= TIP_ZONE ? 0 : (t - TIP_ZONE) / (1 - TIP_ZONE);
    const sw = tf*tf*(3 - 2*tf);   // smoothstepped, so the pull arrives seamlessly

    // barring: is this barb-row within a dark band? barEdge wobbles the band
    // boundary and mottles the fill using a deterministic per-row hash (kept off
    // the main rng so the bars stay stable and don't disturb wear/jitter).
    let bandDark = 0;
    const hsh = Math.sin(t*311.7 + nBars*57.3)*43758.5;
    const rowN = hsh - Math.floor(hsh);   // 0..1 stable per barb-row
    if(nBars>0){
      const wob = barEdge*(rowN-0.5)*0.6;                 // ragged band boundary
      const phase = Math.sin(t*Math.PI*nBars);
      bandDark = Math.max(0, (Math.abs(phase)-(0.45+wob))/0.55);
      if(bandDark>0 && barEdge>0) bandDark *= 1 - barEdge*rowN*0.8;   // mottle: some rows fade
    }

    for(const side of [1,-1]){
      const wearChance = wear * (0.4 + 0.6*t);
      if(rng() < wearChance*0.5){ continue; }

      const halfW = sideWidth(t, side);
      const dirx = norm.x*side*Math.cos(ang) + up.x*Math.sin(ang);
      const diry = norm.y*side*Math.cos(ang) + up.y*Math.sin(ang);
      const m = Math.hypot(dirx,diry)||1;
      let bl = halfW;
      if(downy){
        bl *= 1.1+rng()*0.5;
      } else {
        // a barb is cut where it MEETS the outline, not to the envelope at
        // its root: a barb climbs as it reaches out, and the silhouette is
        // drawn by tips, not roots. Reading the envelope at the root let a
        // shoulder-rooted barb on a short broad feather climb clean past
        // the crown at full breadth — the square-shouldered fat head — so
        // the length that lands the tip on the envelope is solved instead
        // (damped fixed point; the envelope's tip-end steepness would make
        // the bare iteration ring).
        const climb = Math.sin(ang)/tipReach;
        for(let it=0;it<4;it++){
          const h = Math.min(1, t + bl*climb);
          bl = 0.5*bl + 0.5*sideWidth(h, side);
        }
        if(apexType===2){
          // the truncate shear: a barb grows only until the scissors'
          // contour — level with the cut at the rachis, drooping gently
          // toward the base out along each web, the terminal band's own
          // chevron. The smooth minimum rounds the corner where the cut
          // edge meets the side of the vane.
          const shear = (gCut - t)*tipReach;
          if(shear < 1) continue;
          bl = smin(bl, shear, cornerR);
          if(bl < 1) continue;
        }
        bl *= notchFactor(t, side);   // the unzipped vane bites in
        // a barb too short to read as a stroke renders as a floating dot —
        // the acuminate needle's last reaches are carried by the sprig of
        // bare shaft instead (drawn with the quill), so let the dots go.
        if(bl < 1.4) continue;
      }

      // jitter, held to a constant width of wobble: a steep barb runs nearly
      // along the shaft, so the same angular shake used to swing its tip far
      // wider of the vane edge — that was the scruff. Scale the shake back by
      // the slope so the edge stays equally calm at every barb angle.
      const jAmp = downy ? ang*0.9 : 0.12*Math.min(1, 1.035/Math.tan(ang));   // 1.035 = tan 46°
      const jitter = (rng()-0.5)*jAmp;
      const ca=Math.cos(jitter), sa=Math.sin(jitter);
      const rx=(dirx*ca-diry*sa)/m, ry=(dirx*sa+diry*ca)/m;
      let ex=rp.x+rx*bl, ey=rp.y+ry*bl;

      // the closing fan — the ROUNDED family only. A dome is the one apex
      // that closes by WRAP; a point closes by taper and a cut by shear,
      // and neither wants its barbs bent toward the crown at all. Serving
      // one master, the fan can serve it properly.
      let fanPull = 0, ftx = 0, fty = 0;
      if(apexType===0 && sw>0 && !downy){
        // each barb tip reaches for a landing ON THE OUTLINE a stretch
        // ahead — the deeper into the zone, the further ahead, the last
        // rows at the apex itself — so the fan closes the crown while
        // tracing the dome instead of collapsing every strand onto the
        // axis and re-sharpening the tip.
        const tEnd = t + (1-t)*(0.55 + 0.45*tf);
        const ap = rachisPt(tEnd);
        // the last rows tuck in toward the axis so the two webs meet over the
        // crown instead of leaving a parted V above the rachis end.
        const hw = sideWidth(tEnd, side)*latK*(1 - tf*tf*0.7);
        fanPull = sw;
        ex += (ap.x + ap.norm.x*side*hw - ex)*fanPull;
        ey += (ap.y + ap.norm.y*side*hw - ey)*fanPull;
        // the outline's own direction at the landing, so the arc can ARRIVE
        // along the crown rather than merely touch down on it
        const dd = 0.015;
        const o1 = outlineAt(Math.max(peak, tEnd-dd), side);
        const o2 = outlineAt(Math.min(1, tEnd+dd), side);
        ftx = o2.x-o1.x; fty = o2.y-o1.y;
        const fm = Math.hypot(ftx,fty)||1; ftx/=fm; fty/=fm;
      }

      const vx=ex-rp.x, vy=ey-rp.y, vl=Math.hypot(vx,vy);
      let midx=rp.x+vx*0.5+up.x*vl*0.18, midy=rp.y+vy*0.5+up.y*vl*0.18;
      if(fanPull>0){
        // a fanned barb LEAVES the shaft like its unfanned neighbours and
        // ARRIVES skimming the outline: the arc's control point is where
        // those two directions cross. It fades in with the pull so the
        // zone's edge stays seamless, and a wild intersection (near-
        // parallel directions) keeps the plain arc — this coherence is
        // what dissolves the fan's old habit of forming its own central
        // plume with a cleft against each web.
        const den = ry*ftx - rx*fty;
        if(Math.abs(den) > 0.02){
          const a = (vy*ftx - vx*fty)/den;
          if(a > 0.15*vl && a < 1.6*vl){
            midx += (rp.x + rx*a - midx)*fanPull;
            midy += (rp.y + ry*a - midy)*fanPull;
          }
        }
      }

      // one-sided barring: fade the bars out on the leading (right) web as the
      // bias climbs, so at full bias the bars sit on one web of the vane only.
      let bd = bandDark;
      if(barBias>0 && side>0) bd *= (1-barBias);

      // pigment: ground tone -> darker toward base & within bands
      let shade = 0.15 + (1-t)*0.35 + bd*0.7;
      shade = Math.min(1, shade);
      let col = mix(pig1, pig2, shade);
      if(downy) col = mix(col, {r:200,g:190,b:170}, 0.25);

      if(downy){
        // down is not a stroke but a wander — wildest deep in the plumage,
        // calming as it climbs toward the vane so the join doesn't snap.
        const fluff = 0.35 + 0.65*Math.max(0, 1 - t/downFrac);
        barbLines.push({
          d: strand(rp.x, rp.y, rx, ry, bl, fluff),
          downy, t, col: rgbStr(col),
          dw: 0.5+drng()*0.3, dop: 0.36+drng()*0.22
        });
      } else {
        if(downFrac>0){
          // the afterfeather: for a short way above the down each vane barb
          // keeps a downy base, so a faint strand under the web's shoulder
          // eases fluff into clean vane instead of a hard waterline.
          const fringe = 1 - (t - downFrac)/0.08;
          if(fringe > 0){
            const wl = halfW*(0.35+drng()*0.45)*(0.4+0.6*fringe);
            barbLines.push({
              d: strand(rp.x, rp.y, rx, ry, wl, 0.9),
              downy: true, t, col: rgbStr(mix(col,{r:200,g:190,b:170},0.35)),
              dw: 0.5+drng()*0.2, dop: 0.12+0.26*fringe
            });
          }
        }
        barbLines.push({
          d:`M ${rp.x.toFixed(1)} ${rp.y.toFixed(1)} Q ${midx.toFixed(1)} ${midy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`,
          downy, t, rowN, col: rgbStr(col),
          rpx:rp.x, rpy:rp.y, mx:midx, my:midy, ex, ey    // geometry for in-barb markings
        });
        // outline point for the soft wash mask — pulled IN from the barb tip so
        // the shading/sheen sit inside the vane and never touch the ragged edge.
        const io=0.84;
        (side>0?rightPts:leftPts).push({x:rp.x+(ex-rp.x)*io, y:rp.y+(ey-rp.y)*io, t});
      }
    }
  }

  // assemble
  let defs = '', out = '';

  // the vane wash region — an inset, SMOOTHED blade the wash sits inside. Both
  // the self-shadow and the iridescent sheen are masked (not hard-clipped) to
  // it, so their edges feather away inside the vane instead of catching on the
  // ragged sawtooth of the barb tips or ending in a hard line near the down.
  const haveVane = leftPts.length>2 && rightPts.length>2;
  if(haveVane){
    rightPts.sort((a,b)=>a.t-b.t); leftPts.sort((a,b)=>a.t-b.t);
    // one closed ring: up the right edge, down the left
    const ring = rightPts.concat(leftPts.slice().reverse());
    // smooth it with midpoint quadratics — the barb tips become control points,
    // so the outline curves through them instead of zig-zagging between them.
    const n = ring.length;
    const mid = (a,b)=>[( a.x+b.x)/2, (a.y+b.y)/2];
    let d = `M ${mid(ring[n-1],ring[0]).map(v=>v.toFixed(1)).join(' ')}`;
    for(let i=0;i<n;i++){
      const cur=ring[i], nx=ring[(i+1)%n], m2=mid(cur,nx);
      d += ` Q ${cur.x.toFixed(1)} ${cur.y.toFixed(1)} ${m2[0].toFixed(1)} ${m2[1].toFixed(1)}`;
    }
    d += ' Z';
    // a soft-edged mask: the smoothed blade, blurred, so the wash fades out
    const mb = Math.max(3, vaneW*0.11);
    defs += `<filter id="maskblur" filterUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><feGaussianBlur stdDeviation="${mb.toFixed(1)}"/></filter>`;
    defs += `<mask id="vanemask" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><path d="${d}" fill="#fff" filter="url(#maskblur)"/></mask>`;
  }

  // barbs — a steeply-combed vane crowds them nearly parallel and a couple of
  // pixels apart, so the strokes slim down a touch as the angle climbs,
  // keeping the weave silky instead of clotted.
  const crowd = Math.min(1, Math.cos(barbAngle)/0.695);   // 0.695 = cos 46°, the default comb
  const vaneStroke = 0.95*(0.78 + 0.22*crowd);
  for(const b of barbLines){
    const w = b.downy ? b.dw : vaneStroke;
    const op = b.downy ? b.dop : 0.85;
    out += `<path d="${b.d}" fill="none" stroke="${b.col}" stroke-width="${w}" stroke-linecap="round" opacity="${op}"/>`;
  }
  // the barbule cloud — every strand's micro-wisps in a single faint pass
  if(fluffD){
    const fc = mix(mix(pig1,pig2,0.35), {r:200,g:190,b:170}, 0.3);
    out += `<path d="${fluffD}" fill="none" stroke="${rgbStr(fc)}" stroke-width="0.36" stroke-linecap="round" opacity="0.35"/>`;
  }

  // in-barb spots — flecks & splodges grown INTO the vane. Instead of ellipses
  // laid on top, we darken the stretch of each barb that passes through a
  // scattered spot, so the mark is made of the barbs themselves and moves with
  // them. Each barb is sampled along its own curve and only the covered
  // segments are redrawn darker.
  if(speck>0){
    const spots=[];
    const nSpots=Math.floor(speck*28);
    for(let i=0;i<nSpots;i++){
      const st=0.14+rng()*0.78, sside=rng()<0.5?1:-1, f=0.15+rng()*0.8;
      const hw=sideWidth(st,sside); if(hw<3) continue;
      const rp=rachisPt(st);
      spots.push({x:rp.x+rp.norm.x*sside*hw*f, y:rp.y+rp.norm.y*sside*hw*f, r2:Math.pow((1.8+speck*5)*(0.6+rng()*0.9),2)});
    }
    const spotCol=rgbStr(mix(pig1,pig2,0.92));
    const qp=(a,b,c,s)=>{const mt=1-s;return mt*mt*a+2*mt*s*b+s*s*c;};
    let marks='';
    for(const b of barbLines){
      if(b.downy) continue;
      const SEG=7; let px=b.rpx, py=b.rpy;
      for(let k=1;k<=SEG;k++){
        const s=k/SEG, x=qp(b.rpx,b.mx,b.ex,s), y=qp(b.rpy,b.my,b.ey,s);
        const cxp=(px+x)/2, cyp=(py+y)/2;
        for(const sp of spots){ const dx=cxp-sp.x, dy=cyp-sp.y;
          if(dx*dx+dy*dy<sp.r2){ marks+=`<path d="M ${px.toFixed(1)} ${py.toFixed(1)} L ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${spotCol}" stroke-width="1.5" stroke-linecap="round"/>`; break; } }
        px=x; py=y;
      }
    }
    out+=marks;
  }

  // the terminal band — one spell of pigment as the feather grew, so its
  // inner edge follows a growth contour: level with the tip at the rachis and
  // drooping toward the base out along each web (the chevron on a hawk's
  // tail), never a per-row waterline. Like the specks it darkens stretches of
  // the barbs themselves, fading in over a soft inner edge; the Bar edge
  // slider lends the band the same raggedness it gives the barring.
  if(tipBand>0){
    const gB = 1 - tipBand;              // the growth contour where the band begins
    const soft = 0.02 + tipBand*0.12;    // breadth of the fade at the inner edge
    const bandCol = rgbStr(mix(pig1,pig2,0.95));
    const bw = (vaneStroke+0.5).toFixed(2);
    const qb=(a,b,c,s)=>{const mt=1-s;return mt*mt*a+2*mt*s*b+s*s*c;};
    let band='';
    for(const b of barbLines){
      if(b.downy) continue;
      const chordT = Math.hypot(b.ex-b.rpx, b.ey-b.rpy)/tipReach;   // barb reach in rachis units
      if(b.t + chordT + 0.09 < gB) continue;    // wholly below the band, wobble included
      const wob = (b.rowN-0.5)*(0.02 + barEdge*0.12);   // ragged boundary
      const fade = 1 - barEdge*b.rowN*0.7;              // mottle: some rows thin out
      if(fade < 0.08) continue;
      const SEG=8; let px=b.rpx, py=b.rpy;
      for(let k=1;k<=SEG;k++){
        const s=k/SEG, x=qb(b.rpx,b.mx,b.ex,s), y=qb(b.rpy,b.my,b.ey,s);
        const f = Math.min(1, (b.t + ((k-0.5)/SEG)*chordT + wob - gB)/soft);
        if(f > 0.05){
          band += `<path d="M ${px.toFixed(1)} ${py.toFixed(1)} L ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${bandCol}" stroke-width="${bw}" stroke-linecap="round" opacity="${(f*fade*0.9).toFixed(2)}"/>`;
        }
        px=x; py=y;
      }
    }
    out += band;
  }

  // THE PHI EYE — the peacock's ocellus, and the reason the Maybe-peacock
  // branch was ever named. Like the specks and the terminal band it is not
  // laid on top but grown into the vane: each barb is sampled along its own
  // curve and the stretches that pass through the eye are redrawn in its
  // rings — a dark heart at the centre, the heart colour blazing round it,
  // the halo beyond, and a rim mixed toward the ground pigment so the eye
  // settles into the feather instead of sitting on it. The eye rides the
  // rachis frame (along-shaft × across-vane), and its proportions are
  // GOLDEN, because the real spot's are: the ring boundaries sit at 1/φ²
  // and 1/φ of the radius (the first cut here fumbled toward 0.36 and 0.66
  // before the googling showed the spot knew better), and the ellipse
  // holds its axes in the ratio φ. Ring boundaries get a whisper of
  // per-row wobble — an eye grown barb by barb, not stamped. Past the end
  // of the shaft the frame simply extrapolates, so an eye can slip off the
  // tip until only its lower rim clings on — the snipe's trick, and the
  // partridge's.
  //
  // And then the daft idea, which was the right idea: the eye is THE ONE
  // MARK. Grown to GIANT and CAST toward a web it stops being a spot and
  // becomes a field — its rings turn to bands lapping an edge (the jay),
  // its halo to a wash, its rim to a crescent. Not a slider for every
  // pattern a feather can wear; one primitive, sent to stand in the right
  // place wearing the right colours. Not perfect — better than that.
  if(eyeSize>0){
    const ec = rachisPt(eyeT);
    // to 100 the eye is the vane's creature, sized by BREADTH — the spot, the
    // halo, the partridge's semicircle. Past 100 it changes allegiance and
    // takes its scale from the feather's whole LENGTH, growing quadratically
    // until it is truly giant: the rings become country the feather merely
    // crosses, and a cast tips just the touch of one ring's arc onto the
    // vane — a pheasant's band from an eye too big to see.
    const giant = Math.max(0, eyeSize-1);
    const eRb = vaneW*latK*(0.30 + Math.min(eyeSize,1)*0.58) + giant*giant*tipReach*0.6;
    const PHI = 1.6180339887;
    const eRa = eRb*PHI;                            // the golden ellipse, long axis up the shaft
    const IPHI = 1/PHI, IPHI2 = 1/(PHI*PHI);        // the golden rings: 0.618, 0.382
    const BL = 0.06;                                // half-breadth of each ring's blend
    // the cast — the eye sent toward one web. Full cast carries the centre a
    // whole eye-radius past the vane's edge, so the last thing to leave is
    // the rim's ring lapping the margin.
    const ecx = ec.x + ec.norm.x*eyeSide*(vaneW*latK + eRb);
    const ecy = ec.y + ec.norm.y*eyeSide*(vaneW*latK + eRb);
    const heart = hexToRgb($('eyecol').value), halo = hexToRgb($('eyecol2').value);
    // the pupil darkens toward the SHADE pigment rather than toward black: a
    // jewel heart still earns its dark core, but a heart matched to the
    // ground sinks clean into the vane and the eye becomes bare halo — which
    // is how a russet ring, a pale crescent and a jay's edge all turn out to
    // be one large eye wearing different colours.
    const eCore = mix(heart, pig2, 0.55), eRim = mix(halo, pig2, 0.55);
    const paint = re =>
        re<IPHI2-BL ? eCore
      : re<IPHI2+BL ? mix(eCore, heart, (re-IPHI2+BL)/(2*BL))
      : re<IPHI-BL  ? heart
      : re<IPHI+BL  ? mix(heart, halo, (re-IPHI+BL)/(2*BL))
      : re<0.88     ? halo
      :               mix(halo, eRim, (re-0.88)/0.12);
    const qe=(a,b,c,s)=>{const mt=1-s;return mt*mt*a+2*mt*s*b+s*s*c;};
    let eyeMarks='';
    for(const b of barbLines){
      if(b.downy) continue;
      const wob = 1 + (b.rowN-0.5)*0.08;
      const SEG=9; let px=b.rpx, py=b.rpy;
      for(let k=1;k<=SEG;k++){
        const s=k/SEG, x=qe(b.rpx,b.mx,b.ex,s), y=qe(b.rpy,b.my,b.ey,s);
        const cxp=(px+x)/2, cyp=(py+y)/2;
        const dxp=cxp-ecx, dyp=cyp-ecy;
        const re = Math.hypot((dxp*ec.tan.x+dyp*ec.tan.y)/eRa,
                              (dxp*ec.norm.x+dyp*ec.norm.y)/eRb) * wob;
        if(re<1){
          const o = re>0.86 ? 0.95*(1-(re-0.86)/0.14) : 0.95;   // the rim melts into the vane
          const ew = re<IPHI ? 1.9 : 1.6;                       // inside the golden ring the weave goes solider
          eyeMarks += `<path d="M ${px.toFixed(1)} ${py.toFixed(1)} L ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${rgbStr(paint(re))}" stroke-width="${ew}" stroke-linecap="round" opacity="${o.toFixed(2)}"/>`;
        }
        px=x; py=y;
      }
    }
    out += eyeMarks;
  }

  // (The self-shadow that once darkened the inner vane has been retired: with
  // markings now growing into the barbs — and shiftable side to side — a fixed
  // central darkening only got in their way. The soft iridescent wash below can
  // stand in as a shadow when one is wanted, e.g. a dark shade on a pale down.)

  // iridescent wash — a translucent lens over the vane, clipped to the feather's outline
  if(iridOn && haveVane){
    const c1 = $('iridcol').value, c2 = $('iridcol2').value;
    const centreT = iridPos;
    const cp = rachisPt(centreT);
    const spreadPx = (0.12 + iridSpread*0.5) * tipReach;
    const gid = 'iridgrad';
    defs += `<radialGradient id="${gid}" gradientUnits="userSpaceOnUse"
        cx="${cp.x.toFixed(1)}" cy="${cp.y.toFixed(1)}" r="${spreadPx.toFixed(1)}">
        <stop offset="0%" stop-color="${c1}" stop-opacity="${(iridStr*0.85).toFixed(2)}"/>
        <stop offset="55%" stop-color="${c2}" stop-opacity="${(iridStr*0.55).toFixed(2)}"/>
        <stop offset="100%" stop-color="${c2}" stop-opacity="0"/>
      </radialGradient>`;
    out += `<g mask="url(#vanemask)" style="mix-blend-mode:screen">
        <rect x="0" y="0" width="${W}" height="${H}" fill="url(#${gid})"/>
      </g>`;
    const cp2 = rachisPt(Math.min(0.95, centreT+0.12));
    defs += `<radialGradient id="${gid}2" gradientUnits="userSpaceOnUse"
        cx="${cp2.x.toFixed(1)}" cy="${cp2.y.toFixed(1)}" r="${(spreadPx*0.55).toFixed(1)}">
        <stop offset="0%" stop-color="${c1}" stop-opacity="${(iridStr*0.5).toFixed(2)}"/>
        <stop offset="100%" stop-color="${c1}" stop-opacity="0"/>
      </radialGradient>`;
    out += `<g mask="url(#vanemask)" style="mix-blend-mode:screen">
        <rect x="0" y="0" width="${W}" height="${H}" fill="url(#${gid}2)"/>
      </g>`;
  }

  // rachis on top
  const hueQuill = `rgb(${(pig1.r*0.6+150)|0} ${(pig1.g*0.6+140)|0} ${(pig1.b*0.6+120)|0})`;
  out += `<path d="${shaftD}" fill="none" stroke="${hueQuill}" stroke-width="3.4" stroke-linecap="round"/>`;
  out += `<path d="${shaftD}" fill="none" stroke="${rgbStr(darken(pig2,0.9))}" stroke-width="1" stroke-linecap="round"/>`;
  if(apexType===1){
    // the sprig: on an acuminate feather the shaft itself runs to the very
    // tip, the vane hugging it in whiskers — so a fine tapering reach of
    // quill carries the point past where drawable barbs give out.
    let sprigD='';
    for(let i=0;i<=8;i++){ const u=RACHIS_END + (i/8)*(1-RACHIS_END)*0.99;
      const p=rachisPt(u); sprigD += (i?' L':'M')+` ${p.x.toFixed(1)} ${p.y.toFixed(1)}`; }
    out += `<path d="${sprigD}" fill="none" stroke="${hueQuill}" stroke-width="1.7" stroke-linecap="round"/>`;
    out += `<path d="${sprigD}" fill="none" stroke="${rgbStr(darken(pig2,0.9))}" stroke-width="0.7" stroke-linecap="round"/>`;
  }
  const b0=rachisPt(0), b1=rachisPt(0.05);
  out += `<line x1="${b0.x}" y1="${b0.y+10}" x2="${b1.x}" y2="${b1.y}" stroke="${hueQuill}" stroke-width="5" stroke-linecap="round" opacity="0.8"/>`;

  svg.innerHTML = (defs?`<defs>${defs}</defs>`:'') + out;
}

/* ---- readouts ---- */
function updateReadouts(){
  $('len-v').textContent = P.len.value+' u';
  $('curve-v').textContent = (P.curve.value>0?'+':'')+P.curve.value+'°';
  $('width-v').textContent = P.width.value+' u';
  $('apextype-v').textContent = ['rounded','acuminate','truncate'][apexType];
  $('apex-label').textContent = ['Fullness','Fineness','Corner'][apexType];
  $('apex-v').textContent = P.apex.value+'%';
  $('asym-v').textContent = P.asym.value+'%';
  $('angle-v').textContent = P.angle.value+'°';
  $('density-v').textContent = P.density.value;
  $('down-v').textContent = P.down.value+'%';
  $('wear-v').textContent = P.wear.value+'%';
  $('bars-v').textContent = P.bars.value>0? P.bars.value : 'none';
  $('barside-v').textContent = P.barside.value>0? P.barside.value+'%' : 'both';
  $('baredge-v').textContent = P.baredge.value>0? P.baredge.value+'%' : 'crisp';
  $('tipband-v').textContent = P.tipband.value>0? P.tipband.value+'%' : 'none';
  $('speck-v').textContent = P.speck.value>0? P.speck.value+'%' : 'none';
  $('eye-v').textContent = P.eye.value>0? P.eye.value+'%' : 'none';
  $('eyepos-v').textContent = P.eyepos.value+'%';
  const cast = +P.eyeside.value;
  $('eyeside-v').textContent = cast===0 ? 'true' : (cast>0?'→ ':'← ')+Math.abs(cast)+'%';
  $('iridpos-v').textContent = P.iridpos.value+'%';
  $('iridspread-v').textContent = P.iridspread.value+'%';
  $('iridstr-v').textContent = P.iridstr.value+'%';
}

function render(){ updateReadouts(); drawFeather(); }

function conjureFrom(str){
  const seedFn = hashStr(str);
  const rng = mulberry(seedFn());
  drawSeed = seedFn();  // lock the drawing rng to this coordinate
  P.len.value     = 400 + Math.floor(rng()*200);
  P.curve.value   = Math.floor((rng()-0.5)*150);
  P.width.value   = 45 + Math.floor(rng()*75);
  // the apex family: rounded is the moor's common coin, the acuminate
  // regular enough, the truncate an occasional treat
  const fam = rng();
  apexType = fam<0.55 ? 0 : fam<0.85 ? 1 : 2;
  P.apex.value    = 10 + Math.floor(rng()*80);
  P.asym.value    = rng()<0.45 ? Math.floor(rng()*90) : 0;  // some birds fly, some don't
  P.angle.value   = 28 + Math.floor(rng()*38);
  P.density.value = 60 + Math.floor(rng()*85);
  P.down.value    = Math.floor(rng()*40);
  // the moor mostly offers pristine little finds; now and then a properly
  // bedraggled one to leave behind — disappointment mild, and occasional
  P.wear.value    = rng()<0.3 ? 12+Math.floor(rng()*53) : Math.floor(rng()*10);
  P.bars.value    = rng()<0.4 ? Math.floor(rng()*8) : 0;
  P.barside.value = P.bars.value>0 && rng()<0.4 ? 40+Math.floor(rng()*60) : 0;
  P.baredge.value = P.bars.value>0 ? Math.floor(rng()*rng()*100) : 0;
  P.tipband.value = rng()<0.3 ? 10+Math.floor(rng()*25) : 0;
  P.speck.value   = rng()<0.35 ? Math.floor(rng()*70) : 0;

  // pigment: earthy by default, seeded
  const h1 = 26 + rng()*24, s1 = 25 + rng()*30, l1 = 28 + rng()*20;
  $('pig1').value = hslToHex(h1, s1, l1);
  $('pig2').value = hslToHex(h1-4+rng()*8, s1*0.8, l1*0.45);

  // iridescence: rare
  const dazzling = rng() < 0.28;
  $('irid').checked = dazzling;
  toggleIrid();
  if(dazzling){
    const jh = rng();
    const jewels = [['#1f6f8c','#5e2f7a'],['#2f7a4a','#7a5a1f'],['#3a2f8c','#8c2f6a'],['#0e6b6b','#6b2f8c'],['#7a2f2f','#2f4a8c']];
    const pair = jewels[Math.floor(jh*jewels.length)];
    $('iridcol').value = pair[0]; $('iridcol2').value = pair[1];
    P.iridpos.value = 45+Math.floor(rng()*45);
    P.iridspread.value = 30+Math.floor(rng()*55);
    P.iridstr.value = 45+Math.floor(rng()*45);
  }

  // the peacock possibility. Eight years ago one landed on Dad's roof, so
  // the odds are real — but roof-rare. It arrives LAST in the draw order on
  // purpose: every coordinate conjured before this feature keeps the exact
  // feather it always had, and a lucky few simply gain the eye.
  const roofBird = rng() < 0.09;
  if(roofBird){
    P.eye.value = 40 + Math.floor(rng()*55);
    P.eyepos.value = 55 + Math.floor(rng()*28);
    const eyes = [['#1d3f8f','#8a6a2f'],['#232a6e','#7c8a2f'],['#12406e','#8a5a3c'],['#0f5a52','#8a6a2f']];
    const pe = eyes[Math.floor(rng()*eyes.length)];
    $('eyecol').value = pe[0]; $('eyecol2').value = pe[1];
    if(!$('irid').checked){
      // an eye almost never travels without its sheen
      $('irid').checked = true; toggleIrid();
      $('iridcol').value = '#1f6f8c'; $('iridcol2').value = '#2f7a4a';
      P.iridpos.value = P.eyepos.value;
      P.iridspread.value = 35 + Math.floor(rng()*30);
      P.iridstr.value = 40 + Math.floor(rng()*30);
    }
  } else {
    P.eye.value = 0;
  }
  // the cast arrives after everything, so every find before it keeps its
  // feather; among the roof-birds, a few now wear the eye sent off a web
  P.eyeside.value = 0;
  if(roofBird && rng() < 0.25){
    P.eyeside.value = (rng()<0.5?-1:1)*(30+Math.floor(rng()*55));
  }
  render();
}

function hslToHex(h,s,l){ s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const to=x=>Math.round(255*x).toString(16).padStart(2,'0');
  return `#${to(f(0))}${to(f(8))}${to(f(4))}`;
}

/* iridescence enable/disable */
function toggleIrid(){
  const on = $('irid').checked;
  ['iridcol','iridcol2'].forEach(id=>$(id).disabled=!on);
  [P.iridpos,P.iridspread,P.iridstr].forEach(el=>el.disabled=!on);
}

/* ---- wiring: manual tweaks keep drawSeed stable so nothing flickers ---- */
Object.values(P).forEach(el => el.addEventListener('input', render));
['pig1','pig2','eyecol','eyecol2','iridcol','iridcol2'].forEach(id=>$(id).addEventListener('input', render));
$('irid').addEventListener('change', ()=>{ toggleIrid(); render(); });

/* the apex family card cycles rounded -> acuminate -> truncate */
function turnApex(){ apexType = (apexType+1)%3; render(); }
$('apexcard').addEventListener('click', turnApex);
$('apexcard').addEventListener('keydown', e=>{
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); turnApex(); }
});

$('conjure').addEventListener('click', ()=> conjureFrom($('coord').value.trim() || 'origin'));
$('random').addEventListener('click', ()=>{
  const letters='ABCDEFGHJKLMNPRSTUVWXYZ';
  const g=letters[Math.floor(Math.random()*letters.length)]+letters[Math.floor(Math.random()*letters.length)];
  const e=Math.floor(Math.random()*9999).toString().padStart(4,'0');
  const n=Math.floor(Math.random()*9999).toString().padStart(4,'0');
  $('coord').value=`${g} ${e} ${n}`; conjureFrom($('coord').value);
});
$('coord').addEventListener('keydown', e=>{ if(e.key==='Enter') conjureFrom($('coord').value.trim()||'origin'); });

$('save').addEventListener('click', ()=>{
  const clone=$('feather').cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  // no background rect — the specimen leaves on a transparent ground
  const blob=new Blob([clone.outerHTML],{type:'image/svg+xml'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='feaffer_'+($('coord').value.replace(/\s+/g,'-')||'specimen')+'.svg';
  a.click();
});

conjureFrom($('coord').value);

/* ---- whisper our height to an embedding page, so the iframe can size itself
   exactly to the tool — no guessed height, no inner scrollbar. The parent
   listens for { feaffer:'height' } and sets the iframe height to match. ---- */
(function(){
  const frame = document.querySelector('.frame');
  let last = 0;
  function whisper(){
    if(window.parent === window) return;           // standalone: nobody to tell
    const h = Math.ceil(frame.getBoundingClientRect().height);
    if(h && h !== last){ last = h; window.parent.postMessage({ feaffer:'height', height:h }, '*'); }
  }
  window.addEventListener('load', whisper);
  window.addEventListener('resize', whisper);
  if(window.ResizeObserver) new ResizeObserver(whisper).observe(frame);
  whisper();
})();
</script>
