  // SHADING — the strength of the light-and-shade that models the feather's
  // form: the camber's lit and shaded webs times the per-barb melange tilt. It
  // is a MULTIPLY on each stroke's own colour, so it can only ever darken a
  // white feather — no colour is brighter than white, and the highlight half
  // clamps away while the shadow half bites in full, which greys a pale vane to
  // pewter. This dial scales the whole deviation from flat: 100 as grown, 0
  // dead flat (the colour as dyed, no relief), up for deeper modelling. A
  // diagnostic as much as a control — flatten it to see how much murk is shadow.
  const shadeStr = (+P.shading.value)/100;
  const camAt = (b,x,y) => {
    const raw = (camR ? camLit((x-b.rpx)*(-b.uy) + (y-b.rpy)*b.ux) : 1) * (b.lum || 1);
    return 1 + (raw - 1)*shadeStr;
  };
  const dim = (c,k) => k===1 ? c : {r:c.r*k, g:c.g*k, b:c.b*k};


  // HOW FAR A BARBULE HAS TO REACH — the span from a barb to the one beside it
  // in its own web, which is the one measurement the knit below is made of.
  // Taken per barb rather than from an average, because the average is a poor
  // account of it: across a vane the gap runs anywhere from half a pixel to
  // five, as the comb steepens up the shaft and the tip jitter shakes the rows
  // apart. A single width against that lands half the ribbons overlapping and
  // half of them short, and the vane moirés in stripes.
  //
  // The reach is the perpendicular distance from a barb's midpoint to its
  // neighbour's chord, taking the NEARER of the two neighbours — so where wear
  // has carried one neighbour off, the barb keeps the reach its other side
  // tells it, and the gap the missing barb left stays a gap. An unzipped vane
  // should show daylight; that is what unzipped means.
  // Measured LIKE FOR LIKE, which took one wrong turn to learn: a barb is a
  // bowed quadratic and its chord is not, and the two part company by nearly a
  // tenth of the barb's length at the middle. Reading a point on one barb's
  // CURVE against the next barb's CHORD folds that whole bow into the answer —
  // too far on one side, too near on the other, and taking the nearer of the
  // two then keeps the wrong one every time. So both readings are taken on the
  // curves: midpoint to midpoint's tangent. (A quadratic's tangent at the
  // halfway mark is parallel to its chord, which makes the honest version the
  // cheap one as well.)
  {
    const byRow = new Map();
    for(const b of barbLines){
      if(b.downy) continue;
      b.cx = qAt(b.rpx,b.mx,b.ex,0.5); b.cy = qAt(b.rpy,b.my,b.ey,0.5);
      byRow.set(b.side*100000 + b.ri, b);
    }
    // A barb carries barbules on BOTH flanks, so its ribbon has to reach half
    // way to the barb above and half way to the barb below — the MEAN of the
    // two gaps, not the lesser of them. Where wear has carried one neighbour
    // off there is only the one reading, and the ribbon keeps the width that
    // side gives it: the gap the missing barb left stays a gap, and an unzipped
    // vane shows daylight, which is what unzipped means.
    //
    // And read at THREE places up the barb, keeping the widest. Two barbs that
    // sit three pixels apart at their roots need not be three apart at their
    // tips: they bow by their own lengths and the tip jitter shakes them, so the
    // gap can run from nothing to twice that over one barb's reach. A ribbon
    // sized at the middle alone is fat near the shaft and leaves the outer half
    // of the vane in open wedges — which is exactly what it did, and the web
    // stalled at half the ground covered however far the slider went. Overlap
    // near the shaft costs nothing: the whole knit is laid as one flat layer.
    const qpt  = (b,u)=>({x:qAt(b.rpx,b.mx,b.ex,u), y:qAt(b.rpy,b.my,b.ey,u)});
    const qtan = (b,u)=>{ const x=2*(1-u)*(b.mx-b.rpx)+2*u*(b.ex-b.mx),
                          y=2*(1-u)*(b.my-b.rpy)+2*u*(b.ey-b.my),
                          m=Math.hypot(x,y)||1; return {x:x/m, y:y/m}; };
    const fallback = (tipReach/Math.max(1,nBarbs-1))*latK;
    for(const b of barbLines){
      if(b.downy) continue;
      let reach = 0;
      for(const u of [0.30, 0.60, 0.85]){
        const P = qpt(b,u);
        let sum = 0, seen = 0;
        for(const step of [-1, 1]){
          const n = byRow.get(b.side*100000 + b.ri + step);
          if(!n) continue;
          const Q = qpt(n,u), D = qtan(n,u);
          sum += Math.abs((P.x-Q.x)*D.y - (P.y-Q.y)*D.x); seen++;
        }
        if(seen) reach = Math.max(reach, sum/seen);
      }
      // and never longer than the barb it branches from: at an acuminate tip
      // the rows still stand a full pitch apart while the barbs themselves are
      // down to a few pixels, and an unbounded ribbon there swells into a
      // chain of lobes where there should be a needle
      const vl = Math.hypot(b.ex-b.rpx, b.ey-b.rpy);
      b.reach = Math.min(reach ? Math.min(reach, fallback*2.6) : fallback, vl*0.6);

      // THE BARBULE RANKS — DRAWN, not averaged to a tone.
      //
      // The first pass at this laid each barb's barbules as the flat grey they
      // average to, on the argument that a barbule is a fifth of a pixel here
      // and a thing below the sample rate is honestly drawn as its own mean.
      // The argument is sound and the picture was wrong: it read flat, and it
      // homogenised exactly the soft feathers it was meant to help. A feather
      // is not a tone with lines on it. It is a HIERARCHY OF LINE DENSITIES —
      // barbs at one pitch, barbules at a finer — and the eye reads the second
      // order as grain, not as grey. Averaging it away is the one thing you
      // must not do to it.
      //
      // So they are drawn, and the under-sampling is honest in the other
      // direction: one barbule in six or so, at the finest pitch this canvas
      // can still resolve as separate lines. Two ranks, leaning opposite ways,
      // each reaching a little past half the gap so it meets its neighbour's
      // coming the other way — which is what interlocking IS.
      const BETA = 42*Math.PI/180, SB = Math.sin(BETA), CB = Math.cos(BETA);
      // never finer than the page can hold — and the floor rises with the comb,
      // because a vane already carrying twice the barbs is carrying twice the
      // hairlines, and past a point another rank of them is ink spent on a grey
      // nobody can see. Nothing moves it: this is the one spacing in the weave
      // and it stays where the page put it, which is what keeps it from ever
      // beating against the spacing of the barbs.
      const pitch = Math.max(1.25*Math.max(1, nBarbs/130), b.reach*0.34);
      const len = b.reach*0.50/SB;                   // a shade past half the gap
      const SPAN = 0.80;                                  // the rank's run along the barb
      // a barbule reaches FOR ITS NEIGHBOUR, so where there is no neighbour to
      // reach for there is nothing to draw: that is what kept a halo of stray
      // whiskers standing off the apex, where the topmost barb was fringing
      // out into open sky.
      const up1 = byRow.has(b.side*100000 + b.ri + 1);
      const dn1 = byRow.has(b.side*100000 + b.ri - 1);
      // ...AND THE RANK TIGHTENS AS THE VANE CLOSES.
      //
      // A barb's firm stretch already ends at the contour — it was cut there —
      // so the rank simply runs the length of what is left, and the fluff
      // beyond it is drawn as fluff. What the contour still has to say is how
      // TIGHT the weave is: a vane does not open fully knit. A young pennaceous
      // web is loose and shows the light through it, and it shuts as it climbs.
      // So the PITCH is read off the growth coordinate, which thins the weave
      // where the vane is still opening, along each barb and up the whole
      // feather at once, because those are the same coordinate. Open at the
      // foot, shut at the tip, and no second mechanism anywhere to say so.
      const CLOSE_SPAN = 0.34;                  // how much growth it takes to shut
      const openFrom = Math.max(downFrac*0.5, 0.04);
      // ...and the contour says its piece the same way, for the same reason.
      // It used to open the PITCH where the vane was still young — which was
      // the second place a spacing moved in this weave, and it left the foot of
      // every vane sitting at a pitch three quarters of the barb gap, which is
      // inside the beat. Looseness is an EXTENT. A young pennaceous web shows
      // the light through it because the zip has not got far out along the barb
      // yet, not because its barbules are further apart, and now there is no
      // spacing anywhere in the knit that anything can move.
      const shut = Math.min(1, Math.max(0, (b.t - openFrom)/CLOSE_SPAN));
      // HOW FAR THE ZIP HAS HELD. The rank leaves the rachis and runs out along
      // the barb as far as the knit and the contour between them take it, with
      // a whisper of per-row wobble on the end so that where it gives out is a
      // ragged frontier and not a line ruled up the vane parallel to the margin.
      const u0 = 0.05;
      const uEnd = u0 + SPAN*knitSpan*(0.25 + 0.75*shut)*(0.88 + 0.24*b.rowN);
      const uRun = Math.max(1e-4, uEnd - u0);
      const bules = [];
      const step = pitch/vl;                    // the one spacing, and it never moves
      for(let u = u0; u < uEnd && bules.length < 90 && (up1||dn1); ){
        const P = qpt(b,u), T = qtan(b,u);
        // the perpendicular pointing at the next barb up the shaft
        const dp = b.ux*T.x + b.uy*T.y;
        let px = b.ux - T.x*dp, py = b.uy - T.y*dp;
        const pm = Math.hypot(px,py)||1; px/=pm; py/=pm;
        // and shortening hard over the last third of the RANK, because barbules
        // do — the bare end of every barb is what keeps a vane's margin a crisp
        // sawtooth of tips instead of a fuzz. Read against the rank's own run
        // rather than against the barb's, so a half-zipped vane fades out where
        // its zip gives up instead of running full length and then stopping
        // dead at a frontier of its own.
        const ur = (u - u0)/uRun;
        const f = (ur > 0.6 ? Math.max(0, 1 - Math.pow((ur-0.6)/0.4, 1.4)) : 1) * len;
        const ax = (T.x*CB + px*SB)*f, ay = (T.y*CB + py*SB)*f;   // distal rank
        const bx = (T.x*CB - px*SB)*f, by = (T.y*CB - py*SB)*f;   // proximal rank
        // A barbule keeps its start point and the LEGS from it, spelled as
        // deltas of a pixel or two. Whether it opens a path with an absolute M
        // or continues one with a relative m isn't known until the ranks are
        // laid — consecutive barbules of one colour go out as a single path —
        // so that one command is built then, and only the legs here.
        const pts = up1 && dn1 ? [[P.x+ax,P.y+ay],[P.x,P.y],[P.x+bx,P.y+by]]
                  : up1        ? [[P.x,P.y],[P.x+ax,P.y+ay]]
                  :              [[P.x,P.y],[P.x+bx,P.y+by]];
        let legs = '';
        for(let j=1;j<pts.length;j++)
          legs += 'l'+pair(pts[j][0]-pts[j-1][0], pts[j][1]-pts[j-1][1]);
        const last = pts[pts.length-1];
        bules.push({ u, legs, sx:pts[0][0], sy:pts[0][1], ex:last[0], ey:last[1], x:P.x, y:P.y });
        u += step;
      }
      b.bules = bules;
    }
  }

  // assemble
  let defs = '', out = '';

  // THE SHEEN — a LENS, as it always was, but a lens the BARBS are seen
  // through rather than one laid over the feather.
  //
  // It used to be a radial gradient on a rectangle, masked through a blurred
  // silhouette and screened over everything beneath. Screen lightens what is
  // under it — and what is under a feather is mostly the SKY BETWEEN THE
  // BARBS. So the sheen lit the gaps harder than it lit the strokes, and the
  // blur carried it out past the tips: a coloured fog with a feather standing
  // in it, exactly the wrong way round. Wound up, it bleached the whole vane.
  //
  // Structural colour has no business floating anywhere. It comes off the
  // barbules — flattened, twisted to face the light, stacked with melanosomes
  // in an ordered array — so it lives ON the barb, and an iridescent feather
  // is near-black from the wrong angle and blazes from the right one. So the
  // sheen joins the specks and the bars and the eye and grows into the
  // strokes: nothing in this tool is painted on top any more.
  //
  // The lens pools in the rachis frame — an ellipse long up the shaft, because
  // that is how a sheen bands a vane — and it SCREENS each stroke's own
  // pigment, which is the honest arithmetic for light added rather than
  // pigment replaced: a dark barb lifts toward the hue like a beetle's back,
  // a pale one hardly stirs. The hue rolls with the angle across the webs and
  // up the shaft, so the two sides never wear quite the same colour, and a
  // per-row glint breaks it up barb to barb, because no two barbules agree.
  let sheen = null, sheenTouches = null;
  if(iridOn){
    const hot = rachisPt(iridPos);
    const sc1 = hexToRgb($('iridcol').value), sc2 = hexToRgb($('iridcol2').value);
    const spreadPx = (0.12 + iridSpread*0.5)*tipReach;
    const rAlong  = spreadPx;                             // pools up the shaft
    const rAcross = spreadPx*0.45 + vaneW*latK*0.55;      // and reaches across the web
    // does the lens reach here at all? A barb it never touches keeps its one
    // plain quadratic — only a lit barb pays for being cut into runs.
    sheenTouches = (x, y) => {
      const dx = x-hot.x, dy = y-hot.y;
      const al = (dx*hot.tan.x  + dy*hot.tan.y )/rAlong;
      const ac = (dx*hot.norm.x + dy*hot.norm.y)/rAcross;
      return al*al + ac*ac < 1;
    };
    sheen = (x, y, col, glint) => {
      const dx = x-hot.x, dy = y-hot.y;
      const al = (dx*hot.tan.x  + dy*hot.tan.y )/rAlong;
      const ac = (dx*hot.norm.x + dy*hot.norm.y)/rAcross;
      const d2 = al*al + ac*ac;
      if(d2 >= 1) return col;                             // compact support: no tail to spill
      const fall = (1-d2)*(1-d2);                         // smooth to nothing at the rim
      const k = iridStr*0.95*fall*glint;
      const hue = mix(sc1, sc2, Math.max(0, Math.min(1, 0.5 + ac*0.62 + al*0.34)));
      return { r: 255-(255-col.r)*(255-hue.r*k)/255,
               g: 255-(255-col.g)*(255-hue.g*k)/255,
               b: 255-(255-col.b)*(255-hue.b*k)/255 };
    };
  }


  // ================= THE MARKING FRAME =================
  //
  // A pattern is a FIELD IN THE RACHIS FRAME, sampled along the barbs. It is
  // not a property of the barb it lands on, and that distinction is the whole
  // of this section.
  //
  // Until now a bar was decided by where a barb's ROOT sat and then painted
  // along the whole barb. But a barb climbs as it reaches out, so the set of
  // barbs rooted inside a band of t sweeps out a PARALLELOGRAM leaning tipward
  // by exactly the comb angle. Feaffer's bars were not slightly wrong, they
  // were wrong BY THE BARB ANGLE — lean the comb to 40° and the bars leant 40°
  // with it, and no bird does that. A pheasant combed at forty degrees wears
  // level bars.
  //
  // So the field is read at the point on the page each stretch of barb
  // actually occupies, in the two coordinates the vane is built on:
  //
  //   along — the growth coordinate, t at the barb's root climbing to hLand at
  //           its tip, which is simply how far up the shaft this stretch sits
  //   acr   — how far across the web, 0 at the rachis and 1 at the margin,
  //           and that is just the barb's own parameter u, because a barb is
  //           solved to LAND on the outline
  //
  // Which is how the ocellus has always worked — a field in the rachis frame,
  // sampled per stretch of barb. The eye was right and everything else was the
  // odd one out. Now nothing is.
  //
  // THE LEAN comes off the vane's asymmetry, which is where looking says it
  // comes from: a symmetric feather's bars run level, and a flight feather's
  // slant. So it is derived, not dialled — one fewer slider, and one more
  // thing the feather works out for itself.
  // Smooth value noise on a unit lattice, for the marbling to wander on. A
  // warp built of plain sines does not work here and it is worth saying why:
  // ALONG changes by a whole 1 up the feather but only by a barb's climb —
  // about a tenth of that — across one barb. So any frequency fine enough to
  // give detail up the shaft lays ten times as much of it along every barb,
  // and the bands break into a blotch that follows the comb instead of
  // crossing it. Noise has a LENGTH instead of a frequency: set the cell to
  // about one bar's spacing and the warp wanders by the same amount whichever
  // way you travel, which is what a wandering line actually does.
  const vnoise = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x-xi, yf = y-yi;
    const h = (a,b) => { const n = Math.sin(a*127.1 + b*311.7)*43758.5453; return n - Math.floor(n); };
    const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
    return (h(xi,yi)*(1-u) + h(xi+1,yi)*u)*(1-v) + (h(xi,yi+1)*(1-u) + h(xi+1,yi+1)*u)*v;
  };
  // the web's breadth in the shaft's own units, so the noise is the same size
  // in both directions and a wander is a wander whichever way it runs
  const awide = vaneW*latK/tipReach;

  const leanK = asym*0.62/Math.tan(barbAngle);
  const gBand = 1 - tipBand;                 // the terminal band's contour
  const bandSoft = 0.02 + tipBand*0.12;      // the fade at its inner edge
  const marginW = Math.abs(margin)*0.34;     // the edge's share of the web
  const marginSign = margin >= 0 ? 1 : -1;   // dark, or pale

  // how strongly the pigment is pulled at (along, acr): positive toward the
  // shade, negative toward the ground. Bars and the terminal band are fields
  // of ALONG; the margin is a field of ACROSS, and being an edge it overrides
  // rather than adds — a pale rim on a dark bar reads pale.
  // WHERE THE BRIGHT LANDS, and it makes no mark of its own.
  //
  // A bright does not decide where it goes; the feather has already decided.
  // The goldfinch's gold is its wing bar, the wagtail's yellow is its terminal
  // band, the jay's blue is its barring. So the bright rides the marks that are
  // there and claims each one FROM ITS OUTER EDGE INWARD — which is what gives
  // the two-band finish that half the moor wears: something sensible at the
  // root of the mark and something loud at the end of it.
  //
  // Every mark family has its own outward coordinate, and each of them is a
  // number the field was computing anyway. The band's is how far past its inner
  // edge you are; a bar's is the phase within that bar, so a warped bar carries
  // its bright along the wander with it; the margin's is how far over the web.
  // (A spot's is its own radius, and that is read in the speck walk.)
  //
  // Set on the way past rather than returned, because markAt is called ten
  // times a barb on every barb of the feather and an object a call is a great
  // many objects. The caller reads it on the very next line.
  let mkBright = 0;
  const markAt = (along, acr, rowN, side) => {
    let d = 0, bri = 0;
    const claim = (present, outward) => {
      if(!present || brightCover<=0) return;
      // a short ramp at the bright's own frontier, quantised with everything
      // else so the walk can still fold what it folds
      const e = (outward - (1 - brightCover))/0.08;
      if(e > 0) bri = Math.max(bri, Math.min(1, e));
    };
    if(nBars>0){
      const wob = barEdge*(rowN-0.5)*0.6;
      let ph = along*Math.PI*nBars, thr = 0.45 + wob;
      // MARBLING — the bars stop marching and start wandering.
      //
      // Which is the field's gift, and the reason it is worth having built
      // one. A bar was a property of the barb and there was nothing you could
      // do to it but move it; a bar is a FUNCTION now, and a function can have
      // its argument bent. So the phase is warped — three sines of the across
      // and along coordinates, coarse, middling and fine — and the bands buckle,
      // break and wander off, which is a woodcock, a snipe, a grouse, and about
      // half the gamebirds on the moor. The warp is read on the SIGNED across
      // coordinate, so the two webs wander differently instead of mirroring
      // each other about the shaft, which would fool nobody.
      //
      // And vermiculation is fine LINES, not bands, so the threshold rises
      // with it and the bars thin as they break. Wind the barring up alongside
      // and the weather gets finer still.
      if(marble>0){
        const nx = acr*side*awide, cell = 2*nBars;
        ph += marble*( (vnoise(nx*cell*0.75 +  3.1, along*cell*0.75)-0.5)*3.6
                     + (vnoise(nx*cell*2.30 + 11.7, along*cell*2.30)-0.5)*1.5
                     + (rowN-0.5)*0.35 );
        thr += marble*0.17;
      }
      let v = Math.min(1, Math.max(0, (Math.abs(Math.sin(ph))-thr)/0.22));
      if(v>0 && barEdge>0) v *= 1 - barEdge*rowN*0.8;
      if(barBias>0 && side>0) v *= (1-barBias);     // the bars onto one web
      d = Math.max(d, v);
      // within one bar the phase runs 0 at its rootward edge to 1 at its
      // tipward one — warp and all, so a marbled bar's bright wanders with it
      const q = ph/Math.PI;
      claim(v > 0.25, q - Math.floor(q));
    }
    if(tipBand>0){
      const fade = 1 - barEdge*rowN*0.7;
      const f = Math.min(1, (along + (rowN-0.5)*(0.02+barEdge*0.12) - gBand)/bandSoft);
      if(f>0.05 && fade>0.08) d = Math.max(d, f*fade);
      claim(f > 0.25 && fade > 0.08, (along - gBand)/Math.max(0.02, 1 - gBand));
    }
    if(marginW>0 && acr > 1-marginW){
      let f = Math.min(1, (acr-(1-marginW))/Math.max(0.02, marginW*0.5));
      if(barBias>0 && side>0) f *= (1-barBias);     // ...and the rim with them
      d = d*(1-f) + marginSign*f;
      claim(f > 0.25, (acr - (1-marginW))/marginW);
    }
    // quantised, because the walk folds stretches that come out the same
    // colour and a value that never repeats can never be folded. Eight steps
    // is finer than the eye reads on a hairline and it is what keeps a barred
    // feather to a few paths a barb instead of a dozen.
    mkBright = Math.round(bri*4)/4;
    return Math.round(d*5)/5;
  };

  // AND HOW IT WEARS, which is where the food and the light part company.
  //
  // A FOOD bright is paint. It replaces the pigment and then takes the
  // ordinary light like everything else on the vane: the same colour at every
  // angle, because that is what absorption is.
  //
  // A LIGHT bright is a lens. It is only there at all where the barb is turned
  // right, so it is driven hard by the very tilt the camber and the melange
  // already compute — blazing where the web turns to the lamp, falling to a
  // near-black over its own dark backing where it turns away. Nothing new is
  // measured for it; it is the tilt this tool has had all afternoon, read with
  // a much steeper curve. Which is why a blue mark glitters barb to barb on a
  // flat feather (the melange's own term is a tilt) and bands across a cambered
  // one, and a yellow mark on the same feather lies perfectly still.
  const brightAt = (c, bri, k) => {
    if(bri <= 0) return c;
    let paint = brightRgb;
    if(brightStruct > 0){
      const g = Math.max(0, Math.min(1, (k - 0.80)/0.40));
      const blaze = g*g*(3-2*g);
      const lens = mix(darken(mix(c, brightRgb, 0.25), 0.34), brightRgb, blaze);
      paint = brightStruct >= 0.999 ? lens : mix(brightRgb, lens, brightStruct);
    }
    return mix(c, paint, bri);
  };
  // and the colour that pull lands on: the ground darkens toward the base of
  // the feather as it always did, only now read at the stretch's own height
  // rather than at the root of the barb carrying it
  // The ground stays a property of the BARB — where it sits on the feather —
  // and not of the stretch, deliberately. It is a slow darkening toward the
  // base, not a mark; read per stretch it would creep a level or two along
  // every barb in the feather and split runs that ought to fold, which is a
  // lot of paths bought for a gradient nobody can see turn.
  const pigAt = (ground, d) => {
    const c = mix(pig1, pig2, Math.min(1, ground + Math.max(0,d)*0.7));
    return d < 0 ? mix(c, pig1, Math.min(1,-d)*0.88) : c;
  };

  // barbs — a steeply-combed vane crowds them nearly parallel and a couple of
  // pixels apart, so the strokes slim down a touch as the angle climbs,
  // keeping the weave silky instead of clotted.
  const crowd = Math.min(1, Math.cos(barbAngle)/0.695);   // 0.695 = cos 46°, the default comb
  const vaneStroke = 0.95*(0.78 + 0.22*crowd);

  // THE KNIT — the pennaceous barbules, and the reason a vane is a WEB and not
  // a comb. Every barb carries two ranks of them: the distal rank hooked, the
  // proximal rank plain, and one barb's hooks catch the next barb's plain rank,
  // zipping the whole vane into a single sheet you can hold up to the light.
  // It is the one piece of a feather's structure the tool had no account of at
  // all, and its absence is most of why a Feaffer vane read as a row of loose
  // hairs with the sky showing between them.
  //
  // They are not drawn, and should not be. Barbs sit three or four pixels apart
  // on this canvas and a real barb carries eight or ten barbules within that
  // span — so a barbule is a fifth of a pixel, well under the sample rate,
  // where the honest picture of a thing too fine to draw is the tone it
  // averages to. So a barb is laid twice: a soft ribbon a barb-spacing wide,
  // which is the barbules, and the crisp hairline over it, which is the barb.
  // The spacing sets the width, so the ribbons always just meet whatever the
  // density — a crowded vane is nearly closed already and the knit barely shows
  // on it, which is also true of the bird. The ribbon stops short of the barb's
  // tip, because barbules do: that bare last tenth is what keeps a worn edge
  // ragged and a vane's margin fine.
  //
  // (The DOWN keeps its literal barbules. Plumaceous barbules really are sparse
  // and wandering at this scale, so there the strokes ARE the honest picture.)
  // each barb's ribbon is its own reach, so the ribbons meet everywhere and
  // overlap nowhere; a barb whose neighbours crowd it wears a narrow one
  const buleW = Math.max(0.26, vaneStroke*0.30);   // finer than a barb, always

  // every barbule starts out wearing its barb's own pigment, seen through the
  // lens where the lens reaches it
  // the lens is read once per barb here, not once per barbule: a barbule is a
  // third of a pixel wide at a fifth of the barbs' alpha, and the sheen turns
  // over a hundred pixels, so the difference is invisible — while reading it
  // per barbule gave every one of them its own colour and so its own path.
  if(knit>0) for(const b of barbLines){
    if(b.downy || !b.bules) continue;
    const glint = 0.82 + 0.36*b.rowN;
    const base = dim(sheen ? sheen(b.cx, b.cy, b.rgb, glint) : b.rgb, camAt(b, b.cx, b.cy));
    b.buleRgb = b.bules.map(() => base);
    b.buleMk = new Array(b.bules.length).fill(0);   // how strongly a mark claims it
  }
  // ...and a marking REPAINTS them, because a mark on a vane is a recolouring
  // of the structure that is already there, down to its finest order. The marks
  // used to lay a heavier stroke over the barbs instead, and a heavier stroke
  // is a flatter one: the fine grain that makes a feather read as a feather got
  // buried under the very colour that was supposed to be growing out of it.
  // a FIELD tints the structure; a SPOT claims it. The bars, the band and the
  // margin are fields — they set a barbule's colour and leave it in the vane's
  // own faint layer, so the knit reads at one weight all over. The specks and
  // the eye are spots: they claim the barbules they cover and those carry the
  // mark at the weight the barbs do, or an ocellus pales out where its own
  // grain shows through. (Which is why a barred vane does not suddenly grow a
  // visible weave inside its bars and none outside them.)
  const tintBules = (b, u0, u1, rgb) => {
    if(!b.buleRgb) return;
    for(let i=0;i<b.bules.length;i++)
      if(b.bules[i].u >= u0 && b.bules[i].u < u1) b.buleRgb[i] = rgb;
  };
  const paintBules = (b, u0, u1, rgb, alpha) => {
    if(!b.buleRgb) return;
    const bu = b.bules;
    for(let i=0;i<bu.length;i++){
      if(bu[i].u < u0 || bu[i].u >= u1) continue;
      b.buleRgb[i] = alpha >= 0.999 ? rgb : mix(b.buleRgb[i], rgb, alpha);
      if(alpha > b.buleMk[i]) b.buleMk[i] = alpha;
    }
  };

  // THE BARB WALK — one pass, and the only place a vane barb's colour is
  // decided. It reads the marking frame and the sheen at each stretch of the
  // barb, then MERGES the stretches that come out the same colour and draws
  // each run as one path.
  //
  // The merge is what makes the field affordable. A plain barb comes out one
  // colour from end to end and is drawn as the single bowed quadratic it
  // always was — so an unmarked feather costs exactly what it did, and keeps
  // its curve. A barb crossing the edge of a bar costs two paths, or three.
  // Only where the pattern actually changes does anything get spent, which is
  // a better bargain than the terminal band's old flat eight segments a barb —
  // that pass has gone, its work done here.
  //
  // The DOWN stays out of it: plumaceous barbules carry no ordered melanosome
  // array, so a downy base is matt however the vane burns, and it grew before
  // any of these marks were laid.
  // AND THE WALK IS SAMPLED FINE ENOUGH TO RESOLVE WHAT IT IS LOOKING FOR, AND
  // NO FINER — which the SPOTS learned some time ago and the marking frame
  // never did. Ten stations were spent on every barb whatever its length, so a
  // three-pixel barb at the point of an acuminate came out as an eleven-point
  // polyline stepping a fifth of a pixel at a time: a hundred and fifty bytes
  // to draw a line that two points would have drawn in twenty-five. That was
  // invisible while there were only a handful of such barbs. Gauge the rows to
  // the barbs and suddenly the tip is full of them, and the worst specimen on
  // the moor went up by three fifths — not from the barbs it had gained, but
  // from what each of the short ones cost.
  //
  // A station is only worth having where the FIELD might change between it and
  // the next one, and the field's finest features — a bar's edge, a marbled
  // wobble, a step of the camber's light — run several pixels across. So the
  // count follows the barb's own length, and a barb too short to hold a
  // feature is drawn with the two ends it has.
  const qkey = c => ((cl255(c.r)&248)<<16) | ((cl255(c.g)&248)<<8) | (cl255(c.b)&248);
  for(const b of barbLines){
    if(b.downy){
      out += `<path d="${b.d}" fill="none" stroke="${b.col}" stroke-width="${b.dw}" stroke-linecap="round" opacity="${b.dop}"/>`;
      continue;
    }
    const climb = b.hLand - b.t, glint = 0.82 + 0.36*b.rowN;
    const ground = b.ground;   // its own tone in the melange, settled when it grew
    const SEG = Math.max(2, Math.min(10,
      Math.ceil(Math.hypot(b.ex-b.rpx, b.ey-b.rpy)/7)));
    const lit = sheen && (sheenTouches(b.rpx,b.rpy) || sheenTouches(b.tex,b.tey)
                          || sheenTouches((b.rpx+b.tex)/2, (b.rpy+b.tey)/2));
    const pts = [], tpts = [], cols = [], keys = [];
    for(let k=0;k<=SEG;k++){
      const u=k/SEG;
      pts.push([qAt(b.rpx,b.mx,b.ex,u), qAt(b.rpy,b.my,b.ey,u)]);
      tpts.push(camR ? tAt(b,u) : pts[k]);
    }
    for(let k=0;k<SEG;k++){
      const u=(k+0.5)/SEG;
      const along = b.t + u*climb*(1 + leanK*b.side);
      const mx=(tpts[k][0]+tpts[k+1][0])/2, my=(tpts[k][1]+tpts[k+1][1])/2;
      let c = pigAt(ground, markAt(along, u, b.rowN, b.side));
      const bri = mkBright;                       // set on the way past, read here
      const tilt = camAt(b, mx, my);
      if(bri > 0) c = brightAt(c, bri, tilt);
      if(lit) c = sheen(mx, my, c, glint);
      c = dim(c, tilt);
      cols.push(c); keys.push(qkey(c));
    }
    let a = 0;
    for(let k=1;k<=SEG;k++){
      if(k<SEG && keys[k]===keys[a]) continue;
      const col = rgbStr(cols[a]);
      if(a===0 && k===SEG){
        // one colour the whole way: the barb as it was drawn, bow and all
        out += `<path d="${b.d}" fill="none" stroke="${col}" stroke-width="${vaneStroke}" stroke-linecap="round" opacity="0.85"/>`;
      } else {
        // a run: its stations sit ON the curve, so the polyline keeps the bow.
        // Interior joins are butt-capped — round caps would double their alpha
        // and bead the barb — and only the barb's true ends round off.
        let d = `M ${pts[a][0].toFixed(1)} ${pts[a][1].toFixed(1)}`;
        for(let j=a+1;j<=k;j++) d += ` L ${pts[j][0].toFixed(1)} ${pts[j][1].toFixed(1)}`;
        const cap = (a===0 || k===SEG) ? 'round' : 'butt';
        out += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${vaneStroke}" stroke-linecap="${cap}" opacity="0.85"/>`;
      }
      tintBules(b, a/SEG, k/SEG, cols[a]);
      a = k;
    }
  }
  // the barbule cloud — every strand's micro-wisps in a single faint pass
  if(fluffPool.length){
    const fc = mix(mix(pig1,pig2,0.35), {r:200,g:190,b:170}, 0.3);
    out += `<path d="${fluffPool.join('')}" fill="none" stroke="${rgbStr(fc)}" stroke-width="0.36" stroke-linecap="round" opacity="0.35"/>`;
  }

  // IN-BARB SPOTS — flecks & splodges grown INTO the vane. Instead of ellipses
  // laid on top, we darken the stretch of each barb that passes through a
  // scattered spot, so the mark is made of the barbs themselves and moves with
  // them.
  //
  // The one slider used to set the SIZE and the COUNT together, and so could
  // only ever walk one diagonal of the two things spotting actually is. It
  // could reach a scatter of middling flecks and a scatter of larger ones, and
  // it could not reach the corner that most of the moor lives in: SMALL, AND A
  // GREAT MANY. Twenty-eight spots on a whole feather is not a freckled bird,
  // it is a bird that has been rained on.
  //
  // So the two are separated, and separated the honest way round: the amount
  // slider is COVERAGE — how much of the vane the spotting takes — and the size
  // slider is GRAIN. The count then falls out of the two rather than being
  // asked for, because a coverage and a grain already imply it. Wind the grain
  // down at a fixed amount and the spots shrink and multiply together, which is
  // what a thrush's breast does as you walk away from it.
  if(speck>0){
    const spots=[];
    // the spot's radius is the feather's, not a constant — a wren's freckle
    // and a magpie's splodge are the same fraction of their own vane
    const sR = (0.04 + speckSize*0.22) * vaneW*latK;
    const cover = speck*0.5;
    const vaneArea = 1.25 * vaneW*latK * tipReach;
    const nSpots = Math.max(0, Math.min(450, Math.round(cover*vaneArea/(Math.PI*sR*sR*1.1))));
    for(let i=0;i<nSpots;i++){
      const st=0.14+rng()*0.78, sside=rng()<0.5?1:-1, f=0.15+rng()*0.8;
      const hw=sideWidth(st,sside); if(hw<3) continue;
      const rp=rachisPt(st), r=sR*(0.6+rng()*0.9);
      spots.push({x:rp.x+rp.norm.x*sside*hw*f*latK, y:rp.y+rp.norm.y*sside*hw*f*latK, r, r2:r*r});
    }
    const spotRgb=mix(pig1,pig2,0.92);
    // a spot's outward coordinate is its own radius, so the bright claims it
    // from the rim inward: a dark fleck inside a bright ring at a little cover,
    // the whole speck bright at the full. The radius is squared on both sides
    // of the comparison so no square root is taken four hundred times a barb.
    const briEdge2 = (1-brightCover)*(1-brightCover);
    let marks='';
    for(const b of barbLines){
      if(b.downy) continue;
      // a barb only ever meets the handful of spots near it, so sift them once
      // against its own box rather than four hundred times a segment
      const bx0=Math.min(b.rpx,b.tmx,b.tex), bx1=Math.max(b.rpx,b.tmx,b.tex);
      const by0=Math.min(b.rpy,b.tmy,b.tey), by1=Math.max(b.rpy,b.tmy,b.tey);
      const near=[];
      for(const sp of spots)
        if(sp.x>bx0-sp.r && sp.x<bx1+sp.r && sp.y>by0-sp.r && sp.y<by1+sp.r) near.push(sp);
      if(!near.length) continue;
      const glint = 0.82 + 0.36*b.rowN;
      // and sampled fine enough to RESOLVE the grain it is looking for: a
      // freckle three pixels across cannot be found by a walk that steps
      // thirteen, and drawn by one it comes out a dash rather than a speck
      const vl = Math.hypot(b.tex-b.rpx, b.tey-b.rpy);
      const SEG = Math.max(7, Math.min(36, Math.ceil(vl/Math.max(1.6, sR*0.7))));
      let px=b.rpx, py=b.rpy, tx=b.rpx, ty=b.rpy;
      // consecutive covered stretches go out as ONE path — a big splodge is a
      // run of twenty segments and has no business being twenty paths
      let run='', runCol=null, runA=0;
      let runRgb = spotRgb;
      const flush = (kEnd) => {
        if(run){
          marks += `<path d="${run}" fill="none" stroke="${runCol}" stroke-width="${(vaneStroke*1.25).toFixed(2)}" stroke-linecap="round"/>`;
          paintBules(b, runA/SEG, kEnd/SEG, runRgb, 1);
        }
        run='';
      };
      for(let k=1;k<=SEG;k++){
        const sU=k/SEG, x=qAt(b.rpx,b.mx,b.ex,sU), y=qAt(b.rpy,b.my,b.ey,sU);
        const [nx2,ny2] = camR ? tAt(b,sU) : [x,y];
        const cxp=(tx+nx2)/2, cyp=(ty+ny2)/2;    // where it GREW: the spot's business
        let hit=false, bri=0;
        for(const sp of near){ const dx=cxp-sp.x, dy=cyp-sp.y, q=(dx*dx+dy*dy)/sp.r2;
          if(q<1){ hit=true;
            if(brightCover>0 && q>briEdge2)
              bri = Math.max(bri, Math.round(Math.min(1,(q-briEdge2)/0.18)*4)/4);
            break; } }
        if(hit){
          // a mark on an iridescent vane still catches the sheen — the
          // pigment under the barbules changes, the barbules do not
          const kc = camAt(b,cxp,cyp);
          const sc = bri>0 ? brightAt(spotRgb, bri, kc) : spotRgb;
          const cr = rgbStr(dim(sheen ? sheen(cxp,cyp,sc,glint) : sc, kc));
          if(!run){ run = `M ${px.toFixed(1)} ${py.toFixed(1)}`; runCol = cr; runRgb = sc; runA = k-1; }
          else if(cr !== runCol){ flush(k-1); run = `M ${px.toFixed(1)} ${py.toFixed(1)}`; runCol = cr; runRgb = sc; runA = k-1; }
          run += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
        } else flush(k-1);
        px=x; py=y; tx=nx2; ty=ny2;
      }
      flush(SEG);
    }
    out+=marks;
  }

  // (The terminal band's own pass has gone. It walked every barb in eight flat
  // segments and redrew the covered ones; it is a field of the growth
  // coordinate like the bars are, so it is read in the marking frame now and
  // drawn by the barb walk, in as few runs as the pattern actually needs.)

  // THE PHI EYE — the peacock's ocellus, and the reason the Maybe-peacock
  // branch was ever named. Like the specks and the terminal band it is not
  // laid on top but grown into the vane: each barb is sampled along its own
  // curve and the stretches that pass through the eye are redrawn in its
  // rings — a dark heart at the centre, the heart colour blazing round it,
  // the halo beyond, and a rim mixed toward the ground pigment so the eye
  // settles into the feather instead of sitting on it. The eye rides the
  // rachis frame (along-shaft × across-vane), and its proportions are
  // GOLDEN, because the real spot's are: the ring boundaries sit at 1/φ²
  // and 1/φ of the radius (the first cut here fumbled toward 0.36 and 0.66
  // before the googling showed the spot knew better), and the ellipse
  // holds its axes in the ratio φ. Ring boundaries get a whisper of
  // per-row wobble — an eye grown barb by barb, not stamped. Past the end
  // of the shaft the frame simply extrapolates, so an eye can slip off the
  // tip until only its lower rim clings on — the snipe's trick, and the
  // partridge's.
  //
  // And then the daft idea, which was the right idea: the eye is THE ONE
  // MARK. Grown to GIANT and CAST toward a web it stops being a spot and
  // becomes a field — its rings turn to bands lapping an edge (the jay),
  // its halo to a wash, its rim to a crescent. Not a slider for every
  // pattern a feather can wear; one primitive, sent to stand in the right
  // place wearing the right colours. Not perfect — better than that.
  if(eyeSize>0){
    const ec = rachisPt(eyeT);
    // to 100 the eye is the vane's creature, sized by BREADTH — the spot, the
    // halo, the partridge's semicircle. Past 100 it changes allegiance and
    // takes its scale from the feather's whole LENGTH, growing quadratically
    // until it is truly giant: the rings become country the feather merely
    // crosses, and a cast tips just the touch of one ring's arc onto the
    // vane — a pheasant's band from an eye too big to see.
    const giant = Math.max(0, eyeSize-1);
    const eRb = vaneW*latK*(0.30 + Math.min(eyeSize,1)*0.58) + giant*giant*tipReach*0.6;
    const PHI = 1.6180339887;
    const eRa = eRb*PHI;                            // the golden ellipse, long axis up the shaft
    const IPHI = 1/PHI, IPHI2 = 1/(PHI*PHI);        // the golden rings: 0.618, 0.382
    const BL = 0.06;                                // half-breadth of each ring's blend
    // the cast — the eye sent toward one web. Full cast carries the centre a
    // whole eye-radius past the vane's edge, so the last thing to leave is
    // the rim's ring lapping the margin.
    const ecx = ec.x + ec.norm.x*eyeSide*(vaneW*latK + eRb);
    const ecy = ec.y + ec.norm.y*eyeSide*(vaneW*latK + eRb);
    const heart = hexToRgb($('eyecol').value), halo = hexToRgb($('eyecol2').value);
    // the pupil darkens toward the SHADE pigment rather than toward black: a
    // jewel heart still earns its dark core, but a heart matched to the
    // ground sinks clean into the vane and the eye becomes bare halo — which
    // is how a russet ring, a pale crescent and a jay's edge all turn out to
    // be one large eye wearing different colours.
    const eCore = mix(heart, pig2, 0.55), eRim = mix(halo, pig2, 0.55);
    const paint = re =>
        re<IPHI2-BL ? eCore
      : re<IPHI2+BL ? mix(eCore, heart, (re-IPHI2+BL)/(2*BL))
      : re<IPHI-BL  ? heart
      : re<IPHI+BL  ? mix(heart, halo, (re-IPHI+BL)/(2*BL))
      : re<0.88     ? halo
      :               mix(halo, eRim, (re-0.88)/0.12);
    // the pupil — 0 a solid heart, the peacock's true way; wound up, the centre
    // clears to a window and the vane's own pattern shows through, hazing out to
    // the inner golden ring where the solid heart resumes. Not a peacock's trick,
    // but a gift to magpies and every other made-up bird.
    const pupil = +P.eyepupil.value/100;
    let eyeMarks='';
    for(const b of barbLines){
      if(b.downy) continue;
      const wob = 1 + (b.rowN-0.5)*0.08;
      const glint = 0.82 + 0.36*b.rowN;
      // THE EYE LEARNS THE MERGE, which everything else in this tool already
      // knew. The specks fold a run of covered segments into one path and the
      // barb walk folds the stretches that come out the same colour — and the
      // ocellus, the oldest of the three walks, was still emitting ONE PATH PER
      // SEGMENT: nine two-point paths per barb, every one of them carrying its
      // own colour, width, cap and opacity. On a peacock that was two fifths of
      // the whole specimen, which is a great deal to pay for a mark whose rings
      // are flat colour nearly all the way across. A barb crossing an eye
      // changes colour four times — at the two golden rings and the rim — so
      // four paths is what it should cost, not nine. And the stations follow
      // the barb's length here too, for the same reason they do in the walk
      // above: the point of an acuminate is no place to spend nine of them.
      const SEG = Math.max(2, Math.min(9,
        Math.ceil(Math.hypot(b.ex-b.rpx, b.ey-b.rpy)/7)));
      let px=b.rpx, py=b.rpy, tx=b.rpx, ty=b.rpy;
      let run='', runKey=null, runCol='', runW='', runO='', runRgb=null, runA=0;
      const flushEye = kEnd => {
        if(run){
          eyeMarks += `<path d="${run}" fill="none" stroke="${runCol}" stroke-width="${runW}" stroke-linecap="round" opacity="${runO}"/>`;
          paintBules(b, runA/SEG, kEnd/SEG, runRgb, +runO);
        }
        run=''; runKey=null;
      };
      for(let k=1;k<=SEG;k++){
        const s=k/SEG, x=qAt(b.rpx,b.mx,b.ex,s), y=qAt(b.rpy,b.my,b.ey,s);
        const [nx2,ny2] = camR ? tAt(b,s) : [x,y];
        const cxp=(tx+nx2)/2, cyp=(ty+ny2)/2;    // an ocellus is grown, not projected
        const dxp=cxp-ecx, dyp=cyp-ecy;
        const re = Math.hypot((dxp*ec.tan.x+dyp*ec.tan.y)/eRa,
                              (dxp*ec.norm.x+dyp*ec.norm.y)/eRb) * wob;
        if(re<1){
          let o = re>0.86 ? 0.95*(1-(re-0.86)/0.14) : 0.95;    // the rim melts into the vane
          if(pupil>0){
            const t = Math.max(0, 1 - re/IPHI2), haze = t*t*(3-2*t);   // 1 dead centre .. 0 at the ring
            o *= 1 - pupil*haze;
          }
          if(o<0.02){ flushEye(k-1); px=x; py=y; tx=nx2; ty=ny2; continue; }  // the window: no mark laid, the vane shows through
          // the eye follows the barbs it's grown from — a touch solider inside
          // the golden ring, and slimming with the comb like the rest of the
          // vane, so small feathers aren't overwhelmed
          const ew = vaneStroke*(re<IPHI ? 1.3 : 1.12);
          const ec2 = dim(sheen ? sheen(cxp, cyp, paint(re), glint) : paint(re), camAt(b,cxp,cyp));
          const col = rgbStr(ec2), wS = ew.toFixed(2), oS = o.toFixed(2);
          const key = col+'|'+wS+'|'+oS;
          if(key !== runKey){
            flushEye(k-1);
            runKey=key; runCol=col; runW=wS; runO=oS; runRgb=ec2; runA=k-1;
            run = `M ${px.toFixed(1)} ${py.toFixed(1)}`;
          }
          run += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
        } else flushEye(k-1);
        px=x; py=y; tx=nx2; ty=ny2;
      }
      flushEye(SEG);
    }
    out += eyeMarks;
  }

  // THE RANKS, LAID LAST and in the colour the vane actually wears at each
  // station — so a marking reaches the fine structure as well as the coarse,
  // and an eye or a bar is a field of recoloured hairlines rather than a slab
  // of flat pigment with hairlines showing round its edge. Consecutive
  // barbules of one colour go out as a single path, so a plain vane costs one
  // path a barb and only a marked one costs more.
  // They go down in TWO layers, each flat, because a flat layer is what keeps
  // ranks that interlock from doubling their alpha and striping the vane with a
  // moiré of its own rows. The bare vane's are faint, being an under-sampling
  // of something far finer; a barbule a mark has claimed carries the mark at
  // the weight the barbs do, or the eye pales out where its own grain shows.
  //
  // Consecutive barbules of one colour go out as ONE path, which is what keeps
  // a plain vane to a path a barb. Their colour is rounded to a quarter of a
  // step first: under a sheen every barbule reads a fractionally different hue,
  // and un-rounded that turned every one of them into a path of its own.
  if(knit>0){
    let ground='', marked='';
    const bw = buleW.toFixed(2);
    const key = c => `rgb(${cl255(c.r)&252} ${cl255(c.g)&252} ${cl255(c.b)&252})`;
    for(const b of barbLines){
      if(b.downy || !b.bules || !b.bules.length || !b.buleRgb) continue;
      let run='', runCol=null, runMk=false, penX=0, penY=0;
      const flush = ()=>{
        if(run){
          const path = `<path d="${run}" fill="none" stroke="${runCol}" stroke-width="${bw}" stroke-linecap="round"/>`;
          if(runMk) marked += path; else ground += path;
        }
        run='';
      };
      for(let i=0;i<b.bules.length;i++){
        const bu = b.bules[i], c = key(b.buleRgb[i]), mk = b.buleMk[i] >= 0.5;
        if(c !== runCol || mk !== runMk){
          flush(); runCol = c; runMk = mk;
          run = 'M'+pair(bu.sx, bu.sy) + bu.legs;
        } else {
          run += 'm'+pair(bu.sx-penX, bu.sy-penY) + bu.legs;
        }
        penX = bu.ex; penY = bu.ey;
      }
      flush();
    }
    if(ground) out += `<g opacity="${KNIT_ALPHA}">${ground}</g>`;
    if(marked) out += `<g opacity="0.85">${marked}</g>`;
  }

  // (The self-shadow that once darkened the inner vane has been retired: with
  // markings now growing into the barbs — and shiftable side to side — a fixed
  // central darkening only got in their way.)
  //
  // The iridescent wash that used to sit here has gone the same way. It was the
  // last thing in the tool drawn OVER the feather rather than grown into it,
  // and it was the last thing that needed a mask, a Gaussian blur and a CSS
  // blend mode to behave — three things an SVG carried out of here has always
  // had to hope the next program honours. The sheen is up in the barb pass now,
  // in the colour of the strokes themselves, and a Specimen is plain paths all
  // the way down.

  // THE QUILL — a SPINDLE, not a stripe.
  //
  // A rachis is thickest where the vane first leans on it and thins the whole
  // way to the tip; it was drawn at one width from end to end, which is the
  // most drawn-looking thing left on the page — a ruled line with a feather
  // attached. So it is built as a tapered ribbon instead: a run of half-widths
  // laid along the rachis frame, up one flank and back down the other. The
  // taper then serves three things that were three separate pieces of code —
  // the quill, the acuminate's fine sprig past the vane, and the calamus —
  // because they are not three things. They are one quill, read at three
  // thicknesses.
  const hueQuill = `rgb(${(pig1.r*0.6+150)|0} ${(pig1.g*0.6+140)|0} ${(pig1.b*0.6+120)|0})`;
  const quillDark = rgbStr(darken(pig2,0.9));
  function spindle(t0, t1, wf, N){
    const L=[], R=[];
    for(let i=0;i<=N;i++){
      const u = t0 + (t1-t0)*(i/N), p = rachisPt(u), w = Math.max(0.04, wf(i/N, u));
      L.push(`${(p.x+p.norm.x*w).toFixed(2)} ${(p.y+p.norm.y*w).toFixed(2)}`);
      R.push(`${(p.x-p.norm.x*w).toFixed(2)} ${(p.y-p.norm.y*w).toFixed(2)}`);
    }
    return `M ${L.join(' L ')} L ${R.reverse().join(' L ')} Z`;
  }
  // a quill's stoutness is the feather's, not a constant: a magpie's tail
  // carries a heavier shaft than a wren's flank feather
  const qHW = 1.0 + vaneW*latK*0.020;
  const quillHW = u => qHW*(0.16 + 0.84*Math.pow(Math.max(0, 1-u), 0.85));
  // on an ACUMINATE feather the shaft runs to the very tip, the vane hugging
  // it in whiskers; on the others the visible quill stops at RACHIS_END and
  // the barbs close the tip. Same taper, read further along.
  const quillEnd = apexType===1 ? 0.995 : RACHIS_END;
  out += `<path d="${spindle(0, quillEnd, (f,u)=>quillHW(u), 44)}" fill="${hueQuill}"/>`;
  // the umbilical groove runs the length of the rachis and closes at both
  // ends, so it is a spindle too — pointed, not a line cut off at the shoulder
  out += `<path d="${spindle(0, quillEnd, (f,u)=>quillHW(u)*0.32*Math.min(1, f*9, (1-f)*7), 44)}" fill="${quillDark}"/>`;

  // THE CALAMUS — the bare quill below the vane, which is a tube and not a
  // stub of line: a touch stouter than the rachis it carries, and rounded off
  // at its foot, where the inferior umbilicus sits as a dark point. The frame
  // simply extrapolates below t = 0, so the quill leaves the feather along the
  // same curve it grew on.
  const calPx = Math.min(22, 10 + tipReach*0.018);
  const calT = -calPx/tipReach;
  // a swell through its middle that comes back to the rachis's own width at
  // the top, so the quill is one continuous thing and not two stuck together
  out += `<path d="${spindle(calT, 0, f => qHW*(1 + 0.13*Math.sin(f*Math.PI))
              * (f<0.2 ? Math.sqrt(1-Math.pow(1-f/0.2,2)) : 1), 24)}" fill="${hueQuill}"/>`;
  const uw = rachisPt(calT*0.88);
  out += `<circle cx="${uw.x.toFixed(1)}" cy="${uw.y.toFixed(1)}" r="${(qHW*0.42).toFixed(2)}" fill="${quillDark}" opacity="0.55"/>`;

  // THE AFTERSHAFT — a whole second plume, hung off the SUPERIOR UMBILICUS at
  // the top of the calamus, where the vane begins. It is the one piece of
  // feather anatomy this tool had a name for and no thing to go with it: the
  // downy base of a vane barb wore the word "afterfeather" for a while, which
  // it never was. This is the real one — a hyporachis of its own carrying
  // nothing but plumaceous barbs, modest on most birds and very nearly the
  // length of the feather on a grouse, which is a bird the North Pennines has
  // rather a lot of.
  //
  // It grows from the UNDERSIDE, so it is laid behind everything: the vane's
  // own down stands in front of it and the plume shows around and below, which
  // is what doubles the fluff at the foot of a body feather. It wanders on a
  // fourth stream of dice, so faffing the plume never re-rolls the down, just
  // as faffing the down never re-rolls the vane.
  let afterOut = '';
  if(afterFrac > 0){
    const arng = mulberry((drawSeed ^ 0x2545F491) >>> 0);
    // and it must REACH PAST the vane's own down, or it is simply more of it:
    // a plume tucked inside the plumaceous base is invisible however carefully
    // it is drawn, which is the first thing this one did.
    const aT = 0.08 + afterFrac*0.50;              // how far up the shaft it reaches
    const aW = vaneW*(0.34 + afterFrac*1.00);      // and how far out, as a barb length
    const aRows = Math.max(7, Math.round(nBarbs*aT*0.8));
    const aAng = Math.min(barbAngle*1.2, 1.30);
    // paler and greyer than the vane's own down, because it is behind it
    const aCol = rgbStr(mix(mix(pig1, pig2, 0.30), {r:208,g:200,b:182}, 0.45));
    // the hyporachis: the same taper as everything else on this shaft, read
    // thinner still, because it is a lesser quill on a lesser feather
    let d = `<path d="${spindle(0, aT, (f,u)=>qHW*0.42*(0.12+0.88*Math.pow(Math.max(0,1-f),0.8)), 16)}" fill="${aCol}" opacity="0.5"/>`;
    let strands = '';
    for(let i=1;i<=aRows;i++){
      const t = (i/aRows)*aT, rp = rachisPt(t);
      const x = i/aRows;
      // the plume's own plump lens, closing to a point at its tip
      const w = aW*Math.pow(Math.sin(Math.PI*Math.min(1, 0.10 + x*0.88)), 0.5);
      for(const side of [1,-1]){
        const dx = rp.norm.x*side*Math.cos(aAng) + rp.tan.x*Math.sin(aAng);
        const dy = rp.norm.y*side*Math.cos(aAng) + rp.tan.y*Math.sin(aAng);
        const m = Math.hypot(dx,dy)||1;
        strands += strand(rp.x, rp.y, dx/m, dy/m, w*(0.75+arng()*0.55), 1.1, arng, afterPool);
      }
    }
    d += `<path d="${strands}" fill="none" stroke="${aCol}" stroke-width="0.58" stroke-linecap="round" opacity="0.42"/>`;
    if(afterPool.length)
      d += `<path d="${afterPool.join('')}" fill="none" stroke="${aCol}" stroke-width="0.34" stroke-linecap="round" opacity="0.30"/>`;
    afterOut = d;
  }

  svg.innerHTML = (defs?`<defs>${defs}</defs>`:'') + afterOut + out;
}

/* ---- readouts ---- */
function updateReadouts(){
  $('len-v').textContent = P.len.value+' u';
  $('curve-v').textContent = (P.curve.value>0?'+':'')+P.curve.value+'°';
  $('width-v').textContent = P.width.value+' u';
  $('apextype-v').textContent = ['rounded','acuminate','truncate'][apexType];
  $('apex-label').textContent = ['Fullness','Fineness','Corner'][apexType];
  $('apex-v').textContent = P.apex.value+'%';
  $('camber-v').textContent = P.camber.value>0? P.camber.value+'%' : 'pressed';
  $('asym-v').textContent = P.asym.value+'%';
  $('angle-v').textContent = P.angle.value+'°';
  $('density-v').textContent = P.density.value;
  $('knit-v').textContent = P.knit.value>0? P.knit.value+'%' : 'bare comb';
  $('down-v').textContent = P.down.value+'%';
  $('after-v').textContent = P.after.value>0? P.after.value+'%' : 'none';
  $('wear-v').textContent = P.wear.value+'%';
  $('bars-v').textContent = P.bars.value>0? P.bars.value : 'none';
  $('barside-v').textContent = P.barside.value>0? P.barside.value+'%' : 'both';
  $('baredge-v').textContent = P.baredge.value>0? P.baredge.value+'%' : 'crisp';
  $('tipband-v').textContent = P.tipband.value>0? P.tipband.value+'%' : 'none';
  $('speck-v').textContent = P.speck.value>0? P.speck.value+'%' : 'none';
  $('specksize-v').textContent = +P.specksize.value<18 ? 'freckle'
    : +P.specksize.value>72 ? 'splodge' : P.specksize.value+'%';
  $('marble-v').textContent = P.marble.value>0? P.marble.value+'%' : 'none';
  $('shadedepth-v').textContent = +P.shadedepth.value===0 ? 'ground only'
                                : +P.shadedepth.value===30 ? 'as grown'
                                : P.shadedepth.value;
  const intv = v => +v===100 ? 'as grown' : +v===0 ? 'grey' : v+'%';
  $('groundint-v').textContent = intv(P.groundint.value);
  $('markint-v').textContent   = intv(P.markint.value);
  $('shading-v').textContent = +P.shading.value===100 ? 'as grown' : +P.shading.value===0 ? 'flat' : P.shading.value+'%';
  $('margin-v').textContent = +P.margin.value===0 ? 'none'
    : (+P.margin.value<0 ? 'pale ' : 'dark ') + Math.abs(+P.margin.value) + '%';
  {
    const bc = +P.brightcover.value;
    if(!bc) $('brightcover-v').textContent = 'none';
    else {
      // the readout says which it turned out to be, because that is the one
      // thing about the bright nobody chose and everybody should be told
      const h = hexToHsl($('bright').value), sat = h.s;
      const warm = h.h <= 70 || h.h >= 330, cool = h.h >= 165 && h.h <= 300;
      const what = sat < 18 ? '' : warm ? ' food' : cool ? ' light' : ' both';
      $('brightcover-v').textContent = bc + '%' + what;
    }
  }
  $('eye-v').textContent = P.eye.value>0? P.eye.value+'%' : 'none';
  $('eyepupil-v').textContent = P.eyepupil.value>0? P.eyepupil.value+'%' : 'solid';
  $('eyepos-v').textContent = P.eyepos.value+'%';
  const cast = +P.eyeside.value;
  $('eyeside-v').textContent = cast===0 ? 'true' : (cast>0?'→ ':'← ')+Math.abs(cast)+'%';
  $('iridpos-v').textContent = P.iridpos.value+'%';
  $('iridspread-v').textContent = P.iridspread.value+'%';
  $('iridstr-v').textContent = P.iridstr.value+'%';
}

function render(){ updateReadouts(); drawFeather(); }

function conjureFrom(str){
  const seedFn = hashStr(str);
  const rng = mulberry(seedFn());
  drawSeed = seedFn();  // lock the drawing rng to this coordinate

  // ================= A DIE WITH A MIDDLE =================
  //
  // Every form dial used to be rolled flat across its whole range, and a flat
  // die has no middle: the extreme is exactly as likely as the ordinary. Read
  // off five hundred conjures the quartiles came out evenly spaced on every
  // single one of them — len, width, angle, density, knit, down — which is
  // what made a wander feel like noise rather than like a moor. Three dice
  // averaged have a centre and thin tails, so the ordinary feather is common
  // and the odd one is a find, which is what a walk is actually like.
  const bell  = () => (rng()+rng()+rng())/3;
  const span  = (lo,hi) => lo + bell()*(hi-lo);
  const ispan = (lo,hi) => Math.round(span(lo,hi));
  // a die that keeps a middle but leans toward the GOOD end. The square root
  // pulls a centred roll upward without flattening it, so camber, knit and down
  // land in the handsome upper reaches far oftener than the meh lower ones, and
  // the low tail — the fish-bone weave, the sad flat, the invisible wisp — thins
  // to a rarity instead of being a third of the moor. A good middle, not a mean one.
  const spanH = (lo,hi) => lo + Math.sqrt(bell())*(hi-lo);
  const ispanH= (lo,hi) => Math.round(spanH(lo,hi));
  const pick  = ws => { let r = rng();
    for(let i=0;i<ws.length;i++){ r -= ws[i]; if(r<=0) return i; } return ws.length-1; };

  // ================= THE TRACT =================
  //
  // The conjure has always rolled a COAT first and then loaded the pattern
  // dice to suit it, because a colourway mostly is its pattern. Nothing did
  // that job for the SHAPE, so length, breadth, asymmetry, camber, down and
  // aftershaft were six unrelated dice, and the moor grew short fat asymmetric
  // flight feathers carrying a grouse's cloud of fluff. Half of it flew. A
  // quarter of it was pressed flat.
  //
  // The missing variable has a name, and the name is WHERE ON THE BIRD. A
  // feather does not have a length and a breadth and an asymmetry; it has a
  // place it grew, and that place settles all of them at once. So a tract is
  // rolled first and loads the form dice exactly the way the coat loads the
  // pattern dice — the same mechanism, one drawer up.
  //
  // The shares are a walk's and not a bird's: you find what falls, and what
  // falls is mostly body feathers and coverts. A primary is a lucky day.
  const tract = ['flight','tail','covert','contour','fluff'][pick([0.13,0.11,0.24,0.31,0.21])];
  // camber, knit and down are read with the leaning-high die; down floors now sit
  // above the sad line everywhere (the red-kite rule: even a flight feather ends
  // in a wisp, so all must) and fluff reaches a floating puffball. The last column
  // is the AFTERSHAFT, and it changed shape: [chance, min, max]. It used to be
  // rolled on every feather and come out invisible on most — tail could not pass
  // 14, covert not 32, and the visible line is 50, so the roll was mostly wasted
  // ink. Now it is a proper find: it seldom comes, but when it comes it SHOWS,
  // and on the downy tracts it comes as a grouse's cloud.
  const T = {
    //         len        width     asym    camber   angle    density   knit    down     after[p,lo,hi]
    // a flight feather: long, narrow, stiff and strongly asymmetric — barely any
    // down (but never none, now) and no afterfeather at all: every part of it flies
    flight : [[520,600],[40, 62],[55,95],[42,82],[30,44],[112,144],[66,92],[12,30],[0,   0, 0]],
    // a tail feather: as long, broader, nearly symmetric; a little down, and a
    // slim afterfeather once in a long while
    tail   : [[500,600],[54, 86],[ 0,28],[34,70],[34,48],[104,140],[62,90],[14,36],[0.08,50,64]],
    // a covert: short, broad, neat and round — the tidy roof-tiles of a wing, the
    // feathers that most often carry the finery, and a modest plume now and then
    covert : [[400,486],[62, 98],[ 0,18],[40,80],[40,56],[ 95,134],[60,90],[20,50],[0.14,50,74]],
    // a contour feather: the body of the bird, the commonest thing on the ground
    // beneath it — a proper plumaceous base and a real afterfeather when it comes
    contour: [[430,534],[66,104],[ 0,14],[34,74],[42,60],[ 84,123],[52,86],[26,62],[0.24,55,86]],
    // the fluff off a flank or a rump: mostly down, a puffball on a good day, and
    // the tract that carries the grouse's cloud oftenest
    fluff  : [[390,452],[74,112],[ 0, 8],[16,54],[48,68],[ 64,102],[42,78],[40,80],[0.42,60,95]]
  }[tract];
  P.len.value     = ispan(T[0][0], T[0][1]);
  P.width.value   = ispan(T[1][0], T[1][1]);
  // asymmetry snaps to nothing when it is nearly nothing. A bell die lands
  // exactly on zero about never, so without this every feather on the moor came
  // out very slightly lopsided — and a body feather is not slightly lopsided, it
  // is symmetric. A tract whose range starts at 0 means it, and the snap is what
  // lets it say so.
  const asy = ispan(T[2][0], T[2][1]);
  P.asym.value    = asy < 7 ? 0 : asy;
  P.camber.value  = rng()<0.82 ? ispanH(T[3][0], T[3][1]) : 0;   // leaning high; a few still lie flat, on purpose
  P.angle.value   = ispan(T[4][0], T[4][1]);
  P.density.value = ispan(T[5][0], T[5][1]);
  // the knit: half to three quarters is a feather in good order — the barbules
  // invisible at a glance and unmistakable close up, which is how they behave
  // on the bird. Never quite the whole way, because a vane zipped to the very
  // ends of its barbs has no margin left to be crisp with.
  P.knit.value    = ispanH(T[6][0], T[6][1]);
  // and never none: a feather with no plumaceous base at all is not a feather,
  // it is a leaf. The floor is the conjure's; the slider still goes to zero for
  // anyone who would like to see the leaf.
  P.down.value    = ispanH(T[7][0], T[7][1]);
  // the afterfeather is a find, not a Tuesday — a second downy plume is the most
  // expensive thing a feather can put on, so it seldom rolls at all. But it used
  // to be rolled on EVERY feather and leaned so hard-short that it came out below
  // the visible line on nearly all of them: tail could not pass 14, covert not 32,
  // and 50 is where a plume begins to show past the vane's own down, so the roll
  // was mostly wasted ink. Now the tract holds its odds outright (see the T table)
  // and when the die says yes it lands visible — 50 and up, leaning toward the
  // grouse's whole cloud. Rarer than before, and never invisible.
  P.after.value   = (T[8][0] && rng() < T[8][0]) ? ispanH(T[8][1], T[8][2]) : 0;
  // the curve is the wind it grew against, and a long stiff feather carries more
  // of it than a little round one does. A fat-tailed die, not a bell: the sign is
  // a coin, the size a power roll that reaches its whole amplitude often enough
  // that a proper scimitar is a find you actually make, not a myth a centred die
  // keeps promising. (The big ones land past the slider's ninety and rest there.)
  P.curve.value   = Math.round((rng()<0.5?-1:1)*Math.pow(rng(),2.2)*(tract==='fluff' ? 56 : tract==='covert' ? 80 : 96));
  // the apex family follows the tract too: a dome is the moor's common coin
  // everywhere, the acuminate belongs to what flies and what steers, and the
  // truncate is a wing feather's cut edge
  apexType = pick({ flight :[0.58,0.40,0.02], tail   :[0.40,0.30,0.30],
                    covert :[0.80,0.04,0.16], contour:[0.86,0.06,0.08],
                    fluff  :[0.96,0.02,0.02] }[tract]);
  P.apex.value    = ispan(12, 88);
  // age & wear stays a hand control, off the wander entirely: even a little
  // damage catches the eye and distracts from the odd bird underneath. Every
  // conjured feather arrives pristine.
  P.wear.value    = 0;

  // THE PLUMAGE — coat first, and the pattern dice loaded to suit it,
  // because a colourway mostly IS its pattern: the hand-made feathers
  // that sing are white-and-black, white-and-brown, white-and-anything,
  // the dark carried in bold bars and heavy tips. (For a long while
  // every coordinate rolled its pigment from one earthy corner of the
  // wheel — lovely, but brown, and brown, and brown. No longer. And no
  // apology to the feathers redrawn today: until the day we declare the
  // moor DEFINED, a fettle is a feather free-for-all, and nobody is
  // owed the feather a coordinate grew last week.)
  P.bars.value = 0; P.barside.value = 0; P.baredge.value = 0;
  P.tipband.value = 0; P.speck.value = 0; P.margin.value = 0; P.marble.value = 0;
  P.brightcover.value = 0;
  // the colour-density cockpit resets to 'as grown' on every conjure — these
  // three stay hand dials, so Wander always deals a plainly-dyed feather.
  // The moor's survey settled two of them below 'as grown': the SHADING comes
  // down to a whisper (a light shape is all the form a barbed vane needs — the
  // rest was the multiply murking pale feathers to pewter), and the SHADE DEPTH
  // sits low, so the plain vane stays near its ground and the shade shows where
  // it sings — in the marks — rather than washing the body. The scalpel is still
  // in the drawer for a yaffle (shade depth to nothing hides it from the base).
  P.shadedepth.value = 15; P.groundint.value = 100; P.markint.value = 100; P.shading.value = 30;
  // the grain of the spotting, rolled apart from the amount of it. Fine freckling
  // is still the moor's common coin, but a proper blotch is a find worth making,
  // so the die is BIMODAL now rather than merely leaning small: mostly fine, and
  // sometimes frankly big — both ends are a joy, and the indecisive middle less so.
  P.specksize.value = rng()<0.7 ? Math.floor(Math.pow(rng(),1.7)*44)
                                : 44 + Math.floor(rng()*56);
  // three shared hands for the pattern dice below. SPECKLE runs the full gamut a
  // real breast does — a lone spot or two, the honest freckle, or a velvet of
  // spots — because the mid-range alone was where we kept getting stuck. TB is the
  // terminal band, bimodal on purpose: a whisper at the very tip, or a fat half-
  // feather slab. ONEWEB commits the bars to a single web, decided once at the end.
  const speckle = () => { const r=rng();
    return r<0.16 ? 5 + Math.floor(rng()*10)        // a lone spot or two
         : r<0.76 ? 20 + Math.floor(rng()*38)       // the honest freckle
         :          66 + Math.floor(rng()*34); };   // a velvet of spots
  const tb = () => rng()<0.55 ? 5 + Math.floor(rng()*8)     // a hint at the tip
                              : 26 + Math.floor(rng()*14);  // a fat cut
  const oneWeb = () => 58 + Math.floor(rng()*42);
  // ...and the coat is dealt the tract's own hand. A flight feather is rarely a
  // gaudy one and a bit of rump fluff is almost never a bold two-tone, while a
  // covert is where a bird keeps its finery. The coats themselves are untouched
  // — only how often each of them is dealt.
  // the flat plain brown is trimmed back a little on every tract, and the share
  // it gives up goes mostly to the PALE ground — the French-grey pigeon, and the
  // home of the beige marble. The beige is not reduced; it is redirected to the
  // exquisite kind. The pheasants keep their fawn.
  // ...and a SLATE is added to the deck — the cool side of the moor the warm
  // browns never let in. It takes its share mostly from the browns and the fawns
  // (the tea-stain the pages were forever washing) and a little from the two-
  // tones, so the moor cools without losing its gamebirds. It flies (harriers and
  // cuckoos do) and it bodies (the ouzel, the grey wagtail), so it lands heaviest
  // on flight, contour and covert.
  const coat = ['brown','pale','dark','twotone','fawn','gaudy','slate'][pick(
    { flight :[0.18,0.07,0.18,0.28,0.12,0.02,0.15],
      tail   :[0.20,0.06,0.11,0.25,0.20,0.05,0.13],
      covert :[0.11,0.11,0.09,0.33,0.13,0.13,0.10],
      contour:[0.12,0.15,0.13,0.22,0.15,0.09,0.14],
      fluff  :[0.18,0.30,0.11,0.07,0.18,0.04,0.12] }[tract])];
  if(coat==='brown'){
    // the moor's own ground note — kept, but patterned more often than plain, and
    // marbled oftener still
    const h1 = 26 + rng()*24, s1 = 25 + rng()*30, l1 = 28 + rng()*20;
    $('pig1').value = hslToHex(h1, s1, l1);
    $('pig2').value = hslToHex(h1-4+rng()*8, s1*0.8, l1*0.45);
    if(rng()<0.62){
      P.bars.value = 3 + Math.floor(rng()*7);
      P.baredge.value = Math.floor(rng()*rng()*100);
    }
    if(rng()<0.35) P.tipband.value = tb();
    if(rng()<0.4)  P.speck.value = speckle();
    // the moor is largely gamebird, and a gamebird is largely vermiculated
    if(+P.bars.value>0 && rng()<0.6){
      P.marble.value = 30 + Math.floor(rng()*55);
      P.bars.value = 6 + Math.floor(rng()*7);
    }
    // a pale rim is the moor's commonest finish — the scaled look of a wren, a
    // dunnock, a juvenile's fresh edging — with a lighter hand than before
    if(rng()<0.45) P.margin.value = -(12 + Math.floor(rng()*32));
  } else if(coat==='pale'){
    // dove-greys and off-whites — the curly little ones from under everything, the
    // French-grey pigeon, softly barred or faintly freckled when marked at all...
    // and now and then the EXQUISITE one: a near-white ground and a warm beige
    // shade that marbles across it. The pale sky as it turns; the up mirrored in
    // the down.
    const hp = 30 + rng()*30;
    const beige = rng()<0.42;
    $('pig1').value = hslToHex(hp, 4 + rng()*10, 76 + rng()*12);
    $('pig2').value = beige ? hslToHex(34 + rng()*12, 20 + rng()*16, 48 + rng()*12)
                            : hslToHex(hp, 3 + rng()*8, 34 + rng()*16);
    if(beige){
      // faint bars for the marble to wander on, then let it wander
      P.bars.value = 5 + Math.floor(rng()*7);
      P.baredge.value = 20 + Math.floor(rng()*50);
      P.marble.value = 34 + Math.floor(rng()*50);
      if(rng()<0.4) P.margin.value = -(10 + Math.floor(rng()*20));
    } else if(rng()<0.4){
      P.bars.value = 2 + Math.floor(rng()*5);
      P.baredge.value = 20 + Math.floor(rng()*60);
    } else if(rng()<0.4) P.speck.value = speckle();
  } else if(coat==='dark'){
    // the blackbird's undercarriage — near-black over true black, warm-
    // tinged or oil-cool by the toss. And DENSE: a black feather is a
    // solid pointy job, not a wisp, so a thin weave thickens.
    const hd = rng()<0.52 ? 210 + rng()*50 : 18 + rng()*24;   // leaning cool now — the ouzel and the raven wash charcoal-blue, not brown-black
    $('pig1').value = hslToHex(hd, 6 + rng()*14, 14 + rng()*10);
    $('pig2').value = hslToHex(hd, 8 + rng()*12, 4 + rng()*5);
    if(rng()<0.25) P.bars.value = 3 + Math.floor(rng()*6);   // self-coloured, barely-there
    if(rng()<0.3)  P.margin.value = -(10 + Math.floor(rng()*22));   // the blackbird's faint fringe, lighter
    if(+P.density.value < 105) P.density.value = 105 + Math.floor(rng()*45);
  } else if(coat==='twotone'){
    // WHITE-AND-ANYTHING — the contrasty ones, the biggest share on the
    // moor now because they simply work: a white ground and one dark to
    // carry — black first, then brown, rust, slate, or a jewel. Pattern
    // is not optional here; a two-tone IS its pattern. Bold bars, a
    // heavy terminal band, or both at once — sometimes on one web only.
    const u = rng();
    const sh = u<0.40 ? [ 20+rng()*20,  2+rng()*8,   5+rng()*9 ]    // black
             : u<0.65 ? [ 22+rng()*14, 35+rng()*20, 15+rng()*11]    // brown
             : u<0.77 ? [ 12+rng()*12, 55+rng()*20, 27+rng()*11]    // rust
             : u<0.89 ? [205+rng()*28, 16+rng()*18, 20+rng()*10]    // slate
             :          [200+rng()*66, 38+rng()*16, 15+rng()*11];   // jewel — dark & muted
    $('pig1').value = hslToHex(35 + rng()*20, 2 + rng()*7, 84 + rng()*10);
    $('pig2').value = hslToHex(sh[0], sh[1], sh[2]);
    const pat = rng();
    if(pat<0.45)      P.bars.value = 4 + Math.floor(rng()*7);
    else if(pat<0.75) P.tipband.value = tb();
    else { P.bars.value = 3 + Math.floor(rng()*5); P.tipband.value = tb(); }
    if(+P.bars.value>0){
      P.baredge.value = Math.floor(rng()*rng()*80);
      // a marbled two-tone now and then — a dark wandering across the white
      if(rng()<0.3){ P.marble.value = 28 + Math.floor(rng()*45); P.bars.value = 6 + Math.floor(rng()*7); }
    }
    if(rng()<0.25) P.speck.value = speckle();
    if(rng()<0.3)  P.margin.value = 14 + Math.floor(rng()*30);   // a dark rim on white, lighter
    if(+P.density.value < 100) P.density.value = 100 + Math.floor(rng()*45);
  } else if(coat==='fawn'){
    // warm buff over deep sepia, and never plain — barred like a woodcock's wing
    // as often as spotted like a thrush's breast, and marbled like a pheasant
    const hf = 30 + rng()*16;
    $('pig1').value = hslToHex(hf, 28 + rng()*17, 58 + rng()*14);
    $('pig2').value = hslToHex(hf - 4 + rng()*8, 35 + rng()*15, 16 + rng()*10);
    if(rng()<0.5){
      P.bars.value = 3 + Math.floor(rng()*6);
      P.baredge.value = 20 + Math.floor(rng()*60);
    } else P.speck.value = speckle();
    if(+P.bars.value>0 && rng()<0.55){
      P.marble.value = 25 + Math.floor(rng()*55);
      P.bars.value = 6 + Math.floor(rng()*7);
    }
    if(rng()<0.3) P.tipband.value = tb();
    if(rng()<0.5) P.margin.value = (rng()<0.7?-1:1)*(14 + Math.floor(rng()*28));
  } else if(coat==='slate'){
    // THE COOL COAT — the moor's grey side, and the one the warm browns kept
    // out. A hen harrier gone ghost over the heather; a cuckoo's hawk-barred
    // back; the slate of a grey wagtail; the sooty char of a ring ouzel. It is
    // MUTED in the feather — a grey vane is every bit as feathery as a sepia one
    // — but its SHADE runs cool, which is the one thing the pages of the other
    // toy have never once washed. Blue-grey through true slate to char, over a
    // ground of cool cloud-white.
    const hs = 198 + rng()*36;                                         // 198–234, the cool quarter of the wheel
    const ghost = rng()<0.34;                                          // the harrier: pale, faint, barely-there
    $('pig1').value = hslToHex(hs, 4 + rng()*8, 82 + rng()*10);        // cool cloud-white
    $('pig2').value = ghost ? hslToHex(hs,  8 + rng()*10, 46 + rng()*14)   // ghost silver
                            : hslToHex(hs, 14 + rng()*18, 18 + rng()*18);  // slate / char
    // barred like a cuckoo more often than not; a ghost wears the faintest hand
    if(rng()<0.6){
      P.bars.value = (ghost?2:4) + Math.floor(rng()*6);
      P.baredge.value = 20 + Math.floor(rng()*60);
    } else P.speck.value = speckle();
    if(rng()<0.35) P.tipband.value = tb();
    if(rng()<0.42) P.margin.value = -(10 + Math.floor(rng()*24));      // a pale silver rim
    if(ghost && +P.bars.value>0) P.marble.value = 20 + Math.floor(rng()*42);  // the harrier's soft vermiculation
  } else {
    // and these being imaginary feathers, a few may as well say so: a
    // pale ground whose marks — spots, bars, band, the darkened base,
    // all of them the shade's creatures — come out jewel blue, teal,
    // violet, and now and then a WOODPECKER green (wet moss after rain).
    // No moor bird grew these. No matter; no moor did either.
    const hj = rng()<0.24 ? 96 + rng()*54 : 168 + rng()*152;   // a green pocket (woodpecker / moss), else the jewels
    $('pig1').value = hslToHex(30 + rng()*30, 6 + rng()*12, 70 + rng()*16);
    $('pig2').value = hslToHex(hj, 45 + rng()*25, 24 + rng()*16);
    if(rng()<0.5){
      P.bars.value = 3 + Math.floor(rng()*7);
      P.baredge.value = Math.floor(rng()*rng()*80);
    } else P.speck.value = speckle();
    if(rng()<0.3) P.tipband.value = tb();
  }
  // ONE-SIDED BARRING, decided once for every coat: when bars are present and not
  // wandering as marble, they should more often COMMIT — a clean single web, or
  // (by staying put) clean both — instead of the half-hearted middle we lived in.
  // A marbled bar has no side to take, so it is left alone; and the symmetric
  // barred feather, the owl's, is simply the one that never gets pushed.
  if(+P.bars.value>0 && +P.marble.value===0 && rng()<0.5) P.barside.value = oneWeb();

  // THE BRIGHT — rolled last, because it cannot be rolled at all until the
  // marks are known. A bright makes no mark of its own; it rides what is
  // already there, so a plain feather has nowhere to put one and does not get
  // one. (Which is the mechanism doing the dice's job for it, and a good sign.)
  const hasMark = +P.bars.value>0 || +P.tipband.value>0 || +P.speck.value>0
                  || +P.margin.value!==0;
  // how often, by coat: the two-tones are the goldfinch-and-woodpecker corner
  // and take one readily; the moor's browns and fawns wear a touch of rust or
  // gold now and then; a near-black wears the jackdaw's and the magpie's blue,
  // which is structural and belongs to the dark; and the gaudy always says yes.
  const brightOdds = coat==='gaudy' ? 0.85 : coat==='twotone' ? 0.30
                   : coat==='dark'  ? 0.22 : coat==='slate' ? 0.20 : coat==='pale' ? 0.16 : 0.12;
  if(hasMark && rng() < brightOdds){
    // FOOD or LIGHT — but HUSHED, always. When a bright is fettled by hand the
    // bold colours have to be dragged down and down until they stop shouting and
    // begin to sing: the goldcrest is not yellow but saffron, the snipe not orange
