      if(k<SEG && keys[k]===keys[a]) continue;
      const col = rgbStr(cols[a]);
      if(a===0 && k===SEG){
        // one colour the whole way: the barb as it was drawn, bow and all
        out += `<path d="${b.d}" fill="none" stroke="${col}" stroke-width="${vaneStroke}" stroke-linecap="round" opacity="0.85"/>`;
      } else {
        // a run: its stations sit ON the curve, so the polyline keeps the bow.
        // Interior joins are butt-capped — round caps would double their alpha
        // and bead the barb — and only the barb's true ends round off.
        let d = `M ${pts[a][0].toFixed(1)} ${pts[a][1].toFixed(1)}`;
        for(let j=a+1;j<=k;j++) d += ` L ${pts[j][0].toFixed(1)} ${pts[j][1].toFixed(1)}`;
        const cap = (a===0 || k===SEG) ? 'round' : 'butt';
        out += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${vaneStroke}" stroke-linecap="${cap}" opacity="0.85"/>`;
      }
      tintBules(b, a/SEG, k/SEG, cols[a]);
      a = k;
    }
  }
  // the barbule cloud — every strand's micro-wisps in a single faint pass
  if(fluffD){
    const fc = mix(mix(pig1,pig2,0.35), {r:200,g:190,b:170}, 0.3);
    out += `<path d="${fluffD}" fill="none" stroke="${rgbStr(fc)}" stroke-width="0.36" stroke-linecap="round" opacity="0.35"/>`;
  }

  // in-barb spots — flecks & splodges grown INTO the vane. Instead of ellipses
  // laid on top, we darken the stretch of each barb that passes through a
  // scattered spot, so the mark is made of the barbs themselves and moves with
  // them. Each barb is sampled along its own curve and only the covered
  // segments are redrawn darker.
  if(speck>0){
    const spots=[];
    const nSpots=Math.floor(speck*28);
    for(let i=0;i<nSpots;i++){
      const st=0.14+rng()*0.78, sside=rng()<0.5?1:-1, f=0.15+rng()*0.8;
      const hw=sideWidth(st,sside); if(hw<3) continue;
      const rp=rachisPt(st);
      spots.push({x:rp.x+rp.norm.x*sside*hw*f, y:rp.y+rp.norm.y*sside*hw*f, r2:Math.pow((1.8+speck*5)*(0.6+rng()*0.9),2)});
    }
    const spotRgb=mix(pig1,pig2,0.92), spotCol=rgbStr(spotRgb);
    let marks='';
    for(const b of barbLines){
      if(b.downy) continue;
      const glint = 0.82 + 0.36*b.rowN;
      const SEG=7; let px=b.rpx, py=b.rpy;
      for(let k=1;k<=SEG;k++){
        const s=k/SEG, x=qAt(b.rpx,b.mx,b.ex,s), y=qAt(b.rpy,b.my,b.ey,s);
        const cxp=(px+x)/2, cyp=(py+y)/2;
        for(const sp of spots){ const dx=cxp-sp.x, dy=cyp-sp.y;
          if(dx*dx+dy*dy<sp.r2){
            // a mark on an iridescent vane still catches the sheen — the
            // pigment under the barbules changes, the barbules do not
            const cr = sheen ? sheen(cxp,cyp,spotRgb,glint) : spotRgb;
            marks+=`<path d="M ${px.toFixed(1)} ${py.toFixed(1)} L ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${rgbStr(cr)}" stroke-width="${(vaneStroke*1.25).toFixed(2)}" stroke-linecap="round"/>`;
            paintBules(b, (k-1)/SEG, s, cr, 1); break; } }
        px=x; py=y;
      }
    }
    out+=marks;
  }

  // (The terminal band's own pass has gone. It walked every barb in eight flat
  // segments and redrew the covered ones; it is a field of the growth
  // coordinate like the bars are, so it is read in the marking frame now and
  // drawn by the barb walk, in as few runs as the pattern actually needs.)

  // THE PHI EYE — the peacock's ocellus, and the reason the Maybe-peacock
  // branch was ever named. Like the specks and the terminal band it is not
  // laid on top but grown into the vane: each barb is sampled along its own
  // curve and the stretches that pass through the eye are redrawn in its
  // rings — a dark heart at the centre, the heart colour blazing round it,
  // the halo beyond, and a rim mixed toward the ground pigment so the eye
  // settles into the feather instead of sitting on it. The eye rides the
  // rachis frame (along-shaft × across-vane), and its proportions are
  // GOLDEN, because the real spot's are: the ring boundaries sit at 1/φ²
  // and 1/φ of the radius (the first cut here fumbled toward 0.36 and 0.66
  // before the googling showed the spot knew better), and the ellipse
  // holds its axes in the ratio φ. Ring boundaries get a whisper of
  // per-row wobble — an eye grown barb by barb, not stamped. Past the end
  // of the shaft the frame simply extrapolates, so an eye can slip off the
  // tip until only its lower rim clings on — the snipe's trick, and the
  // partridge's.
  //
  // And then the daft idea, which was the right idea: the eye is THE ONE
  // MARK. Grown to GIANT and CAST toward a web it stops being a spot and
  // becomes a field — its rings turn to bands lapping an edge (the jay),
  // its halo to a wash, its rim to a crescent. Not a slider for every
  // pattern a feather can wear; one primitive, sent to stand in the right
  // place wearing the right colours. Not perfect — better than that.
  if(eyeSize>0){
    const ec = rachisPt(eyeT);
    // to 100 the eye is the vane's creature, sized by BREADTH — the spot, the
    // halo, the partridge's semicircle. Past 100 it changes allegiance and
    // takes its scale from the feather's whole LENGTH, growing quadratically
    // until it is truly giant: the rings become country the feather merely
    // crosses, and a cast tips just the touch of one ring's arc onto the
    // vane — a pheasant's band from an eye too big to see.
    const giant = Math.max(0, eyeSize-1);
    const eRb = vaneW*latK*(0.30 + Math.min(eyeSize,1)*0.58) + giant*giant*tipReach*0.6;
    const PHI = 1.6180339887;
    const eRa = eRb*PHI;                            // the golden ellipse, long axis up the shaft
    const IPHI = 1/PHI, IPHI2 = 1/(PHI*PHI);        // the golden rings: 0.618, 0.382
    const BL = 0.06;                                // half-breadth of each ring's blend
    // the cast — the eye sent toward one web. Full cast carries the centre a
    // whole eye-radius past the vane's edge, so the last thing to leave is
    // the rim's ring lapping the margin.
    const ecx = ec.x + ec.norm.x*eyeSide*(vaneW*latK + eRb);
    const ecy = ec.y + ec.norm.y*eyeSide*(vaneW*latK + eRb);
    const heart = hexToRgb($('eyecol').value), halo = hexToRgb($('eyecol2').value);
    // the pupil darkens toward the SHADE pigment rather than toward black: a
    // jewel heart still earns its dark core, but a heart matched to the
    // ground sinks clean into the vane and the eye becomes bare halo — which
    // is how a russet ring, a pale crescent and a jay's edge all turn out to
    // be one large eye wearing different colours.
    const eCore = mix(heart, pig2, 0.55), eRim = mix(halo, pig2, 0.55);
    const paint = re =>
        re<IPHI2-BL ? eCore
      : re<IPHI2+BL ? mix(eCore, heart, (re-IPHI2+BL)/(2*BL))
      : re<IPHI-BL  ? heart
      : re<IPHI+BL  ? mix(heart, halo, (re-IPHI+BL)/(2*BL))
      : re<0.88     ? halo
      :               mix(halo, eRim, (re-0.88)/0.12);
    // the pupil — 0 a solid heart, the peacock's true way; wound up, the centre
    // clears to a window and the vane's own pattern shows through, hazing out to
    // the inner golden ring where the solid heart resumes. Not a peacock's trick,
    // but a gift to magpies and every other made-up bird.
    const pupil = +P.eyepupil.value/100;
    let eyeMarks='';
    for(const b of barbLines){
      if(b.downy) continue;
      const wob = 1 + (b.rowN-0.5)*0.08;
      const glint = 0.82 + 0.36*b.rowN;
      const SEG=9; let px=b.rpx, py=b.rpy;
      for(let k=1;k<=SEG;k++){
        const s=k/SEG, x=qAt(b.rpx,b.mx,b.ex,s), y=qAt(b.rpy,b.my,b.ey,s);
        const cxp=(px+x)/2, cyp=(py+y)/2;
        const dxp=cxp-ecx, dyp=cyp-ecy;
        const re = Math.hypot((dxp*ec.tan.x+dyp*ec.tan.y)/eRa,
                              (dxp*ec.norm.x+dyp*ec.norm.y)/eRb) * wob;
        if(re<1){
          let o = re>0.86 ? 0.95*(1-(re-0.86)/0.14) : 0.95;    // the rim melts into the vane
          if(pupil>0){
            const t = Math.max(0, 1 - re/IPHI2), haze = t*t*(3-2*t);   // 1 dead centre .. 0 at the ring
            o *= 1 - pupil*haze;
          }
          if(o<0.02){ px=x; py=y; continue; }                 // the window: no mark laid, the vane shows through
          // the eye follows the barbs it's grown from — a touch solider inside
          // the golden ring, and slimming with the comb like the rest of the
          // vane, so small feathers aren't overwhelmed
          const ew = vaneStroke*(re<IPHI ? 1.3 : 1.12);
          const ec2 = sheen ? sheen(cxp, cyp, paint(re), glint) : paint(re);
          eyeMarks += `<path d="M ${px.toFixed(1)} ${py.toFixed(1)} L ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${rgbStr(ec2)}" stroke-width="${ew.toFixed(2)}" stroke-linecap="round" opacity="${o.toFixed(2)}"/>`;
          paintBules(b, (k-1)/SEG, s, ec2, o);
        }
        px=x; py=y;
      }
    }
    out += eyeMarks;
  }

  // THE RANKS, LAID LAST and in the colour the vane actually wears at each
  // station — so a marking reaches the fine structure as well as the coarse,
  // and an eye or a bar is a field of recoloured hairlines rather than a slab
  // of flat pigment with hairlines showing round its edge. Consecutive
  // barbules of one colour go out as a single path, so a plain vane costs one
  // path a barb and only a marked one costs more.
  // They go down in TWO layers, each flat, because a flat layer is what keeps
  // ranks that interlock from doubling their alpha and striping the vane with a
  // moiré of its own rows. The bare vane's are faint, being an under-sampling
  // of something far finer; a barbule a mark has claimed carries the mark at
  // the weight the barbs do, or the eye pales out where its own grain shows.
  //
  // Consecutive barbules of one colour go out as ONE path, which is what keeps
  // a plain vane to a path a barb. Their colour is rounded to a quarter of a
  // step first: under a sheen every barbule reads a fractionally different hue,
  // and un-rounded that turned every one of them into a path of its own.
  if(knit>0){
    let ground='', marked='';
    const bw = buleW.toFixed(2);
    const key = c => `rgb(${(c.r|0)&252} ${(c.g|0)&252} ${(c.b|0)&252})`;
    for(const b of barbLines){
      if(b.downy || !b.bules || !b.bules.length || !b.buleRgb) continue;
      let run='', runCol=null, runMk=false, penX=0, penY=0;
      const flush = ()=>{
        if(run){
          const path = `<path d="${run}" fill="none" stroke="${runCol}" stroke-width="${bw}" stroke-linecap="round"/>`;
          if(runMk) marked += path; else ground += path;
        }
        run='';
      };
      for(let i=0;i<b.bules.length;i++){
        const bu = b.bules[i], c = key(b.buleRgb[i]), mk = b.buleMk[i] >= 0.5;
        if(c !== runCol || mk !== runMk){
          flush(); runCol = c; runMk = mk;
          run = 'M'+pair(bu.sx, bu.sy) + bu.legs;
        } else {
          run += 'm'+pair(bu.sx-penX, bu.sy-penY) + bu.legs;
        }
        penX = bu.ex; penY = bu.ey;
      }
      flush();
    }
    if(ground) out += `<g opacity="${(0.12 + 0.72*knit).toFixed(2)}">${ground}</g>`;
    if(marked) out += `<g opacity="0.85">${marked}</g>`;
  }

  // (The self-shadow that once darkened the inner vane has been retired: with
  // markings now growing into the barbs — and shiftable side to side — a fixed
  // central darkening only got in their way.)
  //
  // The iridescent wash that used to sit here has gone the same way. It was the
  // last thing in the tool drawn OVER the feather rather than grown into it,
  // and it was the last thing that needed a mask, a Gaussian blur and a CSS
  // blend mode to behave — three things an SVG carried out of here has always
  // had to hope the next program honours. The sheen is up in the barb pass now,
  // in the colour of the strokes themselves, and a Specimen is plain paths all
  // the way down.

  // THE QUILL — a SPINDLE, not a stripe.
  //
  // A rachis is thickest where the vane first leans on it and thins the whole
  // way to the tip; it was drawn at one width from end to end, which is the
  // most drawn-looking thing left on the page — a ruled line with a feather
  // attached. So it is built as a tapered ribbon instead: a run of half-widths
  // laid along the rachis frame, up one flank and back down the other. The
  // taper then serves three things that were three separate pieces of code —
  // the quill, the acuminate's fine sprig past the vane, and the calamus —
  // because they are not three things. They are one quill, read at three
  // thicknesses.
  const hueQuill = `rgb(${(pig1.r*0.6+150)|0} ${(pig1.g*0.6+140)|0} ${(pig1.b*0.6+120)|0})`;
  const quillDark = rgbStr(darken(pig2,0.9));
  function spindle(t0, t1, wf, N){
    const L=[], R=[];
    for(let i=0;i<=N;i++){
      const u = t0 + (t1-t0)*(i/N), p = rachisPt(u), w = Math.max(0.04, wf(i/N, u));
      L.push(`${(p.x+p.norm.x*w).toFixed(2)} ${(p.y+p.norm.y*w).toFixed(2)}`);
      R.push(`${(p.x-p.norm.x*w).toFixed(2)} ${(p.y-p.norm.y*w).toFixed(2)}`);
    }
    return `M ${L.join(' L ')} L ${R.reverse().join(' L ')} Z`;
  }
  // a quill's stoutness is the feather's, not a constant: a magpie's tail
  // carries a heavier shaft than a wren's flank feather
  const qHW = 1.0 + vaneW*latK*0.020;
  const quillHW = u => qHW*(0.16 + 0.84*Math.pow(Math.max(0, 1-u), 0.85));
  // on an ACUMINATE feather the shaft runs to the very tip, the vane hugging
  // it in whiskers; on the others the visible quill stops at RACHIS_END and
  // the barbs close the tip. Same taper, read further along.
  const quillEnd = apexType===1 ? 0.995 : RACHIS_END;
  out += `<path d="${spindle(0, quillEnd, (f,u)=>quillHW(u), 44)}" fill="${hueQuill}"/>`;
  // the umbilical groove runs the length of the rachis and closes at both
  // ends, so it is a spindle too — pointed, not a line cut off at the shoulder
  out += `<path d="${spindle(0, quillEnd, (f,u)=>quillHW(u)*0.32*Math.min(1, f*9, (1-f)*7), 44)}" fill="${quillDark}"/>`;

  // THE CALAMUS — the bare quill below the vane, which is a tube and not a
  // stub of line: a touch stouter than the rachis it carries, and rounded off
  // at its foot, where the inferior umbilicus sits as a dark point. The frame
  // simply extrapolates below t = 0, so the quill leaves the feather along the
  // same curve it grew on.
  const calPx = Math.min(22, 10 + tipReach*0.018);
  const calT = -calPx/tipReach;
  // a swell through its middle that comes back to the rachis's own width at
  // the top, so the quill is one continuous thing and not two stuck together
  out += `<path d="${spindle(calT, 0, f => qHW*(1 + 0.13*Math.sin(f*Math.PI))
              * (f<0.2 ? Math.sqrt(1-Math.pow(1-f/0.2,2)) : 1), 24)}" fill="${hueQuill}"/>`;
  const uw = rachisPt(calT*0.88);
  out += `<circle cx="${uw.x.toFixed(1)}" cy="${uw.y.toFixed(1)}" r="${(qHW*0.42).toFixed(2)}" fill="${quillDark}" opacity="0.55"/>`;

  svg.innerHTML = (defs?`<defs>${defs}</defs>`:'') + out;
}

  $('bars-v').textContent = P.bars.value>0? P.bars.value : 'none';

  $('baredge-v').textContent = P.baredge.value>0? P.baredge.value+'%' : 'crisp';
  $('tipband-v').textContent = P.tipband.value>0? P.tipband.value+'%' : 'none';

  $('marble-v').textContent = P.marble.value>0? P.marble.value+'%' : 'none';
  $('margin-v').textContent = +P.margin.value===0 ? 'none'
    : (+P.margin.value<0 ? 'pale ' : 'dark ') + Math.abs(+P.margin.value) + '%';
  $('eye-v').textContent = P.eye.value>0? P.eye.value+'%' : 'none';
  $('eyepupil-v').textContent = P.eyepupil.value>0? P.eyepupil.value+'%' : 'solid';
  $('eyepos-v').textContent = P.eyepos.value+'%';
  const cast = +P.eyeside.value;
  $('eyeside-v').textContent = cast===0 ? 'true' : (cast>0?'→ ':'← ')+Math.abs(cast)+'%';
  $('iridpos-v').textContent = P.iridpos.value+'%';
  $('iridspread-v').textContent = P.iridspread.value+'%';
  $('iridstr-v').textContent = P.iridstr.value+'%';
}

function render(){ updateReadouts(); drawFeather(); }

function conjureFrom(str){
  const seedFn = hashStr(str);
  const rng = mulberry(seedFn());
  drawSeed = seedFn();  // lock the drawing rng to this coordinate
  P.len.value     = 400 + Math.floor(rng()*200);
  P.curve.value   = Math.floor((rng()-0.5)*150);
  P.width.value   = 45 + Math.floor(rng()*75);
  // the apex family: rounded is the moor's common coin, the acuminate
  // regular enough, the truncate an occasional treat
  const fam = rng();
  apexType = fam<0.55 ? 0 : fam<0.85 ? 1 : 2;
  P.apex.value    = 10 + Math.floor(rng()*80);
  P.asym.value    = rng()<0.45 ? Math.floor(rng()*90) : 0;  // some birds fly, some don't
  P.angle.value   = 28 + Math.floor(rng()*38);
  P.density.value = 60 + Math.floor(rng()*85);
  // the sweet spot found by looking: around a quarter, where the barbules are
  // invisible at a glance and unmistakable close up, which is exactly how they
  // behave on the bird. A little either side of it, and never the whole way.
  P.knit.value    = 12 + Math.floor(rng()*30);
  // and never none: a feather with no plumaceous base at all is not a
  // feather, it is a leaf. The floor is the conjure's; the slider still goes
  // to zero for anyone who wants to see what a leaf looks like.
  P.down.value    = 14 + Math.floor(rng()*30);
  // age & wear stays a hand control, off the wander entirely: even a
  // little damage catches the eye and distracts from the odd bird
  // underneath. Every conjured feather arrives pristine.
  P.wear.value    = 0;

  // THE PLUMAGE — coat first, and the pattern dice loaded to suit it,
  // because a colourway mostly IS its pattern: the hand-made feathers
  // that sing are white-and-black, white-and-brown, white-and-anything,
  // the dark carried in bold bars and heavy tips. (For a long while
  // every coordinate rolled its pigment from one earthy corner of the
  // wheel — lovely, but brown, and brown, and brown. No longer. And no
  // apology to the feathers redrawn today: until the day we declare the
  // moor DEFINED, a fettle is a feather free-for-all, and nobody is
  // owed the feather a coordinate grew last week.)
  P.bars.value = 0; P.barside.value = 0; P.baredge.value = 0;
  P.tipband.value = 0; P.speck.value = 0; P.margin.value = 0; P.marble.value = 0;
  const dye = rng();
  const coat = dye<0.20 ? 'brown' : dye<0.32 ? 'pale' : dye<0.46 ? 'dark'
             : dye<0.72 ? 'twotone' : dye<0.88 ? 'fawn' : 'gaudy';
  if(coat==='brown'){
    // the moor's own ground note — kept, but patterned more often than plain
    const h1 = 26 + rng()*24, s1 = 25 + rng()*30, l1 = 28 + rng()*20;
    $('pig1').value = hslToHex(h1, s1, l1);
    $('pig2').value = hslToHex(h1-4+rng()*8, s1*0.8, l1*0.45);
    if(rng()<0.55){
      P.bars.value = 3 + Math.floor(rng()*7);
      P.baredge.value = Math.floor(rng()*rng()*100);
      if(rng()<0.35) P.barside.value = 40 + Math.floor(rng()*60);
    }
    if(rng()<0.35) P.tipband.value = 10 + Math.floor(rng()*28);
    if(rng()<0.4)  P.speck.value = 15 + Math.floor(rng()*55);
    // the moor is largely gamebird, and a gamebird is largely vermiculated
    if(+P.bars.value>0 && rng()<0.45){
      P.marble.value = 30 + Math.floor(rng()*55);
      P.bars.value = 6 + Math.floor(rng()*7);
    }
    // a pale rim is the moor's commonest finish — the scaled look of a wren,
    // a dunnock, a juvenile's fresh edging
    if(rng()<0.45) P.margin.value = -(20 + Math.floor(rng()*45));
  } else if(coat==='pale'){
    // dove-greys and off-whites — the curly little ones from under
    // everything, softly barred or faintly freckled when marked at all
    const hp = 30 + rng()*30;
    $('pig1').value = hslToHex(hp, 4 + rng()*10, 74 + rng()*12);
    $('pig2').value = hslToHex(hp, 3 + rng()*8, 34 + rng()*16);
    if(rng()<0.35){
      P.bars.value = 2 + Math.floor(rng()*5);
      P.baredge.value = 20 + Math.floor(rng()*60);
    } else if(rng()<0.35) P.speck.value = 10 + Math.floor(rng()*30);
  } else if(coat==='dark'){
    // the blackbird's undercarriage — near-black over true black, warm-
    // tinged or oil-cool by the toss. And DENSE: a black feather is a
    // solid pointy job, not a wisp, so a thin weave thickens.
    const hd = rng()<0.4 ? 210 + rng()*50 : 18 + rng()*24;
    $('pig1').value = hslToHex(hd, 6 + rng()*14, 14 + rng()*10);
    $('pig2').value = hslToHex(hd, 8 + rng()*12, 4 + rng()*5);
    if(rng()<0.25) P.bars.value = 3 + Math.floor(rng()*6);   // self-coloured, barely-there
    if(rng()<0.3)  P.margin.value = -(18 + Math.floor(rng()*30));   // the blackbird's faint fringe
    if(+P.density.value < 105) P.density.value = 105 + Math.floor(rng()*45);
  } else if(coat==='twotone'){
    // WHITE-AND-ANYTHING — the contrasty ones, the biggest share on the
    // moor now because they simply work: a white ground and one dark to
    // carry — black first, then brown, rust, slate, or a jewel. Pattern
    // is not optional here; a two-tone IS its pattern. Bold bars, a
    // heavy terminal band, or both at once — sometimes on one web only.
    const u = rng();
    const sh = u<0.40 ? [ 20+rng()*20,  2+rng()*8,   5+rng()*9 ]    // black
             : u<0.65 ? [ 22+rng()*14, 35+rng()*20, 15+rng()*11]    // brown
             : u<0.77 ? [ 12+rng()*12, 55+rng()*20, 27+rng()*11]    // rust
             : u<0.89 ? [205+rng()*30, 15+rng()*20, 21+rng()*11]    // slate
             :          [160+rng()*160,45+rng()*25, 22+rng()*14];   // jewel
    $('pig1').value = hslToHex(35 + rng()*20, 2 + rng()*7, 84 + rng()*10);
    $('pig2').value = hslToHex(sh[0], sh[1], sh[2]);
    const pat = rng();
    if(pat<0.45)      P.bars.value = 4 + Math.floor(rng()*7);
    else if(pat<0.75) P.tipband.value = 18 + Math.floor(rng()*22);
    else { P.bars.value = 3 + Math.floor(rng()*5); P.tipband.value = 12 + Math.floor(rng()*16); }
    if(+P.bars.value>0){
      P.baredge.value = Math.floor(rng()*rng()*80);
      if(rng()<0.4) P.barside.value = 50 + Math.floor(rng()*50);
    }
    if(rng()<0.25) P.speck.value = 15 + Math.floor(rng()*35);
    if(rng()<0.3)  P.margin.value = 30 + Math.floor(rng()*45);   // a dark rim on white
    if(+P.density.value < 100) P.density.value = 100 + Math.floor(rng()*45);
  } else if(coat==='fawn'){
    // warm buff over deep sepia, and never plain — barred like a
    // woodcock's wing as often as spotted like a thrush's breast
    const hf = 30 + rng()*16;
    $('pig1').value = hslToHex(hf, 28 + rng()*17, 58 + rng()*14);
    $('pig2').value = hslToHex(hf - 4 + rng()*8, 35 + rng()*15, 16 + rng()*10);
    if(rng()<0.5){
      P.bars.value = 3 + Math.floor(rng()*6);
      P.baredge.value = 20 + Math.floor(rng()*60);
      if(rng()<0.3) P.barside.value = 40 + Math.floor(rng()*60);
    } else P.speck.value = 25 + Math.floor(rng()*45);
    if(+P.bars.value>0 && rng()<0.5){
      P.marble.value = 25 + Math.floor(rng()*55);
      P.bars.value = 6 + Math.floor(rng()*7);
    }
    if(rng()<0.3) P.tipband.value = 10 + Math.floor(rng()*24);
    if(rng()<0.5) P.margin.value = (rng()<0.7?-1:1)*(25 + Math.floor(rng()*40));
  } else {
    // and these being imaginary feathers, a few may as well say so: a
    // pale ground whose marks — spots, bars, band, the darkened base,
    // all of them the shade's creatures — come out jewel blue, teal,
    // violet. No moor bird grew these. No matter; no moor did either.
    const hj = 160 + rng()*160;
    $('pig1').value = hslToHex(30 + rng()*30, 6 + rng()*12, 70 + rng()*16);
    $('pig2').value = hslToHex(hj, 45 + rng()*25, 24 + rng()*16);
    if(rng()<0.5){
      P.bars.value = 3 + Math.floor(rng()*7);
      P.baredge.value = Math.floor(rng()*rng()*80);
    } else P.speck.value = 30 + Math.floor(rng()*40);
    if(rng()<0.3) P.tipband.value = 14 + Math.floor(rng()*20);
  }

  // iridescence: properly rare now, and tempered when it comes — at the
  // old odds the peacock was crowding out the pigeon. The pale and the
  // two-tones never conjure a sheen at all: screen-blent light has
  // nothing to say over white. (Dialled by hand it still burns exactly
  // as hard as you ask it to.)
  const dazzling = rng() < 0.10 && coat!=='pale' && coat!=='twotone';
  $('irid').checked = dazzling;
  toggleIrid();
  if(dazzling){
    const jh = rng();
    const jewels = [['#1f6f8c','#5e2f7a'],['#2f7a4a','#7a5a1f'],['#3a2f8c','#8c2f6a'],['#0e6b6b','#6b2f8c'],['#7a2f2f','#2f4a8c']];
    const pair = jewels[Math.floor(jh*jewels.length)];
    $('iridcol').value = pair[0]; $('iridcol2').value = pair[1];
    P.iridpos.value = 45+Math.floor(rng()*45);
    P.iridspread.value = 30+Math.floor(rng()*55);
    P.iridstr.value = 30+Math.floor(rng()*28);
  }

  // the peacock possibility. Eight years ago one landed on Dad's roof, so
  // the odds are real — but roof-rare.
  const roofBird = rng() < 0.09;
  if(roofBird){
    P.eye.value = 40 + Math.floor(rng()*55);
    P.eyepos.value = 55 + Math.floor(rng()*28);
    const eyes = [['#1d3f8f','#8a6a2f'],['#232a6e','#7c8a2f'],['#12406e','#8a5a3c'],['#0f5a52','#8a6a2f']];
    const pe = eyes[Math.floor(rng()*eyes.length)];
    $('eyecol').value = pe[0]; $('eyecol2').value = pe[1];
    if(!$('irid').checked){
      // an eye almost never travels without its sheen
      $('irid').checked = true; toggleIrid();
      $('iridcol').value = '#1f6f8c'; $('iridcol2').value = '#2f7a4a';
      P.iridpos.value = P.eyepos.value;
      P.iridspread.value = 35 + Math.floor(rng()*30);
      P.iridstr.value = 28 + Math.floor(rng()*20);
    }
  } else {
    P.eye.value = 0;
  }
  // the cast: among the roof-birds, a few wear the eye sent off a web
  P.eyeside.value = 0;
  P.eyepupil.value = 0;   // the peacock keeps its solid heart; the window is a hand-tuned trick
  if(roofBird && rng() < 0.25){
    P.eyeside.value = (rng()<0.5?-1:1)*(30+Math.floor(rng()*55));
  }

  render();
}

function hslToHex(h,s,l){ s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const to=x=>Math.round(255*x).toString(16).padStart(2,'0');
  return `#${to(f(0))}${to(f(8))}${to(f(4))}`;
}

/* iridescence enable/disable */
function toggleIrid(){
  const on = $('irid').checked;
  ['iridcol','iridcol2'].forEach(id=>{
    $(id).disabled=!on;
    const hit=document.querySelector('.wellhit[data-for="'+id+'"]');
    if(hit) hit.setAttribute('aria-disabled', String(!on));
    if(!on && hslTarget===id) $('hslpop').hidden=true;   // don't dial a dimmed sheen
  });
  [P.iridpos,P.iridspread,P.iridstr].forEach(el=>el.disabled=!on);
}

/* ---- wiring: manual tweaks keep drawSeed stable so nothing flickers ---- */
Object.values(P).forEach(el => el.addEventListener('input', render));
['pig1','pig2','eyecol','eyecol2','iridcol','iridcol2'].forEach(id=>$(id).addEventListener('input', render));
$('irid').addEventListener('change', ()=>{ toggleIrid(); render(); });

/* ---- Feaffer's own HSL colour picker ----
   The six swatches still store and show their hex (everything downstream reads
   $(id).value), but a tap opens THIS instead of the operating system's picker:
   three H/S/L sliders whose tracks are painted live, so the greyed-off, vague
   colours a feather actually wears are there to see and slide toward — not
   hunted for in the corner of a saturation square with no lightness at all. */
let hslTarget = null;
const HSLNAME = { pig1:'ground tone', pig2:'shade tone', eyecol:'eye heart',
                  eyecol2:'eye halo', iridcol:'sheen colour', iridcol2:'second sheen' };
function paintHslTracks(){
  const h=+$('hslH').value, s=+$('hslS').value, l=+$('hslL').value;
  $('hslH-v').textContent = h+'°';
  $('hslS-v').textContent = s+'%';
  $('hslL-v').textContent = l+'%';
  const hue=[]; for(let i=0;i<=6;i++) hue.push(`hsl(${i*60},${s}%,${l}%)`);
  $('hslH').style.background = `linear-gradient(90deg,${hue.join(',')})`;
  $('hslS').style.background = `linear-gradient(90deg,hsl(${h},0%,${l}%),hsl(${h},100%,${l}%))`;
  $('hslL').style.background = `linear-gradient(90deg,#000,hsl(${h},${s}%,50%),#fff)`;
  const hex = hslToHex(h,s,l);
  $('hslhex').textContent = hex;
  return hex;
}
function openHsl(id){
  hslTarget = id;
  const {h,s,l} = hexToHsl($(id).value);
  $('hslH').value=h; $('hslS').value=s; $('hslL').value=l;
  $('hsltitle').textContent = HSLNAME[id] || 'colour';
  paintHslTracks();                 // seed the view; the swatch is untouched until you slide
  $('hslpop').hidden = false;
}
// sliding writes the new hex back to the swatch and lets the feather recolour
['hslH','hslS','hslL'].forEach(id=> $(id).addEventListener('input', ()=>{
  const hex = paintHslTracks();
  if(hslTarget){ $(hslTarget).value = hex; $(hslTarget).dispatchEvent(new Event('input',{bubbles:true})); }
}));
$('hsldone').addEventListener('click', ()=> $('hslpop').hidden = true);
document.querySelectorAll('.wellhit').forEach(hit=>{
  const go = ()=>{ if(hit.getAttribute('aria-disabled')!=='true') openHsl(hit.dataset.for); };
  hit.addEventListener('click', go);
  hit.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
});
// dismiss on Escape, or a tap anywhere off it — but not on a swatch, so tapping
// straight from one colour to the next just moves the picker along
document.addEventListener('keydown', e=>{ if(e.key==='Escape') $('hslpop').hidden=true; });
document.addEventListener('pointerdown', e=>{
  if($('hslpop').hidden) return;
  if(e.target.closest('#hslpop') || e.target.closest('.wellhit')) return;
  $('hslpop').hidden = true;
});

/* the apex family card cycles rounded -> acuminate -> truncate */
function turnApex(){ apexType = (apexType+1)%3; render(); }
$('apexcard').addEventListener('click', turnApex);
$('apexcard').addEventListener('keydown', e=>{
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); turnApex(); }
});

// a wander: roll a fresh grid reference, show it, and conjure its feather
function wander(){
  const letters='ABCDEFGHJKLMNPRSTUVWXYZ';
  const g=letters[Math.floor(Math.random()*letters.length)]+letters[Math.floor(Math.random()*letters.length)];
  const e=Math.floor(Math.random()*9999).toString().padStart(4,'0');
  const n=Math.floor(Math.random()*9999).toString().padStart(4,'0');
  $('coord').value=`${g} ${e} ${n}`; conjureFrom($('coord').value);
}
$('conjure').addEventListener('click', ()=> conjureFrom($('coord').value.trim() || 'origin'));
$('random').addEventListener('click', wander);
$('coord').addEventListener('keydown', e=>{ if(e.key==='Enter') conjureFrom($('coord').value.trim()||'origin'); });

/* ---- taking a specimen: three forms of the same feather ---- */
// a tidy filename stem from the grid reference
function stem(){ return 'feaffer_'+($('coord').value.replace(/\s+/g,'-')||'specimen'); }
// send a blob to the browser as a download
function download(blob, name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function escXml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// SPECIMEN — the vector original, on a transparent ground
$('save').addEventListener('click', ()=>{
  const clone=$('feather').cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  download(new Blob([clone.outerHTML],{type:'image/svg+xml'}), stem()+'.svg');
});

// PORTRAIT — a specimen card for sharing: the feather stood on the website's
// sky-grey, framed with a hairline, its grid reference set in mono at the foot
// like a museum tag. The live SVG is nested whole, then rasterised through an
// <img> onto a canvas at 3× so it lands crisp in a phone chat. Nothing external
// is referenced and nothing needs a filter or a blend mode any more — the
// feather is plain stroked paths — so the canvas stays untainted, the PNG
// export is clean, and a Specimen opens the same in whatever reads it next.
$('png').addEventListener('click', ()=>{
  const W=480, H=720, S=3;
  const label = escXml($('coord').value.trim() || 'specimen');
  const card =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`
    + `<rect width="${W}" height="${H}" fill="#e6eaec"/>`
    + `<rect x="0.5" y="0.5" width="${W-1}" height="${H-1}" fill="none" stroke="#c3c7c3" stroke-width="1"/>`
    + `<svg x="40" y="24" width="400" height="640" viewBox="0 0 400 640" preserveAspectRatio="xMidYMid meet">`
    +   $('feather').innerHTML
    + `</svg>`
    + `<line x1="150" y1="666" x2="330" y2="666" stroke="#c3c7c3" stroke-width="1"/>`
    + `<text x="${W/2}" y="692" text-anchor="middle" `
    +   `font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="17" `
    +   `letter-spacing="3" fill="#6f5f43">${label}</text>`
    + `</svg>`;
  const url = URL.createObjectURL(new Blob([card],{type:'image/svg+xml;charset=utf-8'}));
  const img = new Image();
  img.onload = ()=>{
    const cv=document.createElement('canvas'); cv.width=W*S; cv.height=H*S;
    cv.getContext('2d').drawImage(img,0,0,W*S,H*S);
    URL.revokeObjectURL(url);
    cv.toBlob(b=> download(b, stem()+'.png'), 'image/png');
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); alert('Could not draw the portrait.'); };
  img.src = url;
});

// RECORD — the round-trippable receipt. A readable field record up top (every
// parameter with its on-screen readout, so specimens line up for comparing as
// you map the morphospace), and below it a machine block Feaffer can read
// straight back in to reconjure this exact feather — INCLUDING the draw seed,
// which carries a hand-faffed specimen's own identity (its wear gaps, its barb
// jitter, the wander of its down) that no grid reference alone can recover.
$('receipt').addEventListener('click', ()=>{
  const rd = id => $(id).textContent;                       // an on-screen readout
  const pad = (s,n) => (s+' '.repeat(n)).slice(0,n);
  const row = (name, val) => '  '+pad(name,18)+val+'\n';
  const today = new Date().toISOString().slice(0,10);
  const apexName = ['rounded','acuminate','truncate'][apexType];
  const iridOn = $('irid').checked;

  let t = 'FEAFFER\n';
  t += 'field record of an imaginary feather\n';
  t += '═'.repeat(38)+'\n\n';
  t += row('grid', $('coord').value.trim() || '—');
  t += row('collected', today);
  t += '\n  ── form ──\n';
  t += row('rachis length', rd('len-v'));
  t += row('shaft curvature', rd('curve-v'));
  t += row('vane breadth', rd('width-v'));
  t += row('apex', apexName);
  t += row($('apex-label').textContent.toLowerCase(), rd('apex-v'));
  t += row('vane asymmetry', rd('asym-v'));
  t += row('barb angle', rd('angle-v'));
  t += row('barb density', rd('density-v'));
  t += row('barbule knit', rd('knit-v'));
  t += row('plumaceous down', rd('down-v'));
  t += row('age & wear', rd('wear-v'));
  // colour rows carry HSL beside the hex — the reading that lines feathers up
  // for comparing (a clutch of real finds all sitting at low saturation, say)
  const hsl = hex => { const c=hexToHsl(hex); return `h${c.h} s${c.s} l${c.l}`; };
  const crow = (name,hex) => row(name, hex+' · '+hsl(hex));
  t += '\n  ── colour ──\n';
  t += crow('ground', $('pig1').value);
  t += crow('shade', $('pig2').value);
  t += row('barring', rd('bars-v'));
  t += row('bar side', rd('barside-v'));
  t += row('bar edge', rd('baredge-v'));
  t += row('terminal band', rd('tipband-v'));
  t += row('marbling', rd('marble-v'));
  t += row('spots & splodges', rd('speck-v'));
  t += row('margin', rd('margin-v'));
  t += row('eyespot', rd('eye-v'));
  t += crow('eye heart', $('eyecol').value);
  t += crow('eye halo', $('eyecol2').value);
  t += row('eye pupil', rd('eyepupil-v'));
  t += row('eye position', rd('eyepos-v'));
  t += row('eye cast', rd('eyeside-v'));
  t += row('iridescence', iridOn ? 'on' : 'off');
  t += crow('sheen', $('iridcol').value);
  t += crow('sheen 2', $('iridcol2').value);
  t += row('sheen position', rd('iridpos-v'));
  t += row('sheen spread', rd('iridspread-v'));
  t += row('sheen strength', rd('iridstr-v'));

  // the machine block: split each line on the FIRST '=', so a grid reference
  // with spaces survives whole. Keep this intact and Feaffer can reconjure it.
  const m = {
    grid: $('coord').value, seed: drawSeed, apex: apexType,
    len:P.len.value, curve:P.curve.value, width:P.width.value, apexdeg:P.apex.value,
    asym:P.asym.value, angle:P.angle.value, density:P.density.value, knit:P.knit.value,
    down:P.down.value, wear:P.wear.value,
    pig1:$('pig1').value, pig2:$('pig2').value,
    bars:P.bars.value, barside:P.barside.value, baredge:P.baredge.value,
    tipband:P.tipband.value, speck:P.speck.value, margin:P.margin.value,
    marble:P.marble.value,
    eye:P.eye.value, eyecol:$('eyecol').value, eyecol2:$('eyecol2').value,
    eyepupil:P.eyepupil.value, eyepos:P.eyepos.value, eyeside:P.eyeside.value,
    irid: iridOn ? 1 : 0, iridcol:$('iridcol').value, iridcol2:$('iridcol2').value,
    iridpos:P.iridpos.value, iridspread:P.iridspread.value, iridstr:P.iridstr.value
  };
  t += '\n'+'─'.repeat(38)+'\n';
  t += 'machine record — keep intact to reconjure\n';
  t += '─'.repeat(38)+'\n';
  t += 'feaffer.v1\n';
  for(const k in m) t += k+'='+m[k]+'\n';

  download(new Blob([t],{type:'text/plain;charset=utf-8'}), stem()+'.txt');
});

/* ---- RESTORE: read a Record back in and reconjure its exact feather ----
   The receipt's machine block is the source of truth. We scan for its lines
   (key=value, split on the first '=' so a spaced grid reference survives) and
   pour them back into every control — INCLUDING the draw seed, so a feather
   hand-faffed while the kettle boiled comes back whole: its wear gaps, its barb
   jitter, the wander of its down, none of which a grid reference alone holds.
   The human list above the block has no '=' signs, so it's ignored for free —
   even a receipt with its marker line lost still restores from the block. */
function parseRecord(text){
  const m = {};
  for(const line of String(text).split(/\r?\n/)){
    const i = line.indexOf('=');
    if(i < 0) continue;
    const k = line.slice(0,i).trim();
    if(k) m[k] = line.slice(i+1).trim();
  }
  return m;
}
function applyRecord(m){
  const numOk = s => s!=null && s!=='' && !isNaN(+s);
  // a record must carry at least the two measures that make a feather a feather
  if(!numOk(m.len) || !numOk(m.width)){
    alert("That doesn't look like a Feaffer record — no feather in it.");
    return false;
  }
  const hex = /^#[0-9a-fA-F]{6}$/;
  const setR = (el,k) => { if(numOk(m[k])) el.value = +m[k]; };   // ranges self-clamp
  const setC = (id,k) => { if(hex.test(m[k]||'')) $(id).value = m[k]; };

  if(m.grid != null) $('coord').value = m.grid;
  drawSeed = numOk(m.seed) ? (+m.seed >>> 0) : hashStr(m.grid || 'origin')();
  apexType = numOk(m.apex) ? ((+m.apex % 3) + 3) % 3 : 0;

  setR(P.len,'len'); setR(P.curve,'curve'); setR(P.width,'width'); setR(P.apex,'apexdeg');
  setR(P.asym,'asym'); setR(P.angle,'angle'); setR(P.density,'density'); setR(P.knit,'knit');
  setR(P.down,'down'); setR(P.wear,'wear');
  if(!numOk(m.knit)) P.knit.value = 0;           // feathers saved before the knit come back as the bare comb they were
  setR(P.bars,'bars'); setR(P.barside,'barside'); setR(P.baredge,'baredge'); setR(P.tipband,'tipband'); setR(P.speck,'speck');
  setR(P.margin,'margin'); setR(P.marble,'marble');
  if(!numOk(m.margin)) P.margin.value = 0;       // feathers saved before the margin come back unedged
  if(!numOk(m.marble)) P.marble.value = 0;       // ...and before the marbling, with their bars still marching
  setR(P.eye,'eye'); setR(P.eyepupil,'eyepupil'); setR(P.eyepos,'eyepos'); setR(P.eyeside,'eyeside');
  if(!numOk(m.eyepupil)) P.eyepupil.value = 0;   // feathers saved before the window reload with a solid heart
  setR(P.iridpos,'iridpos'); setR(P.iridspread,'iridspread'); setR(P.iridstr,'iridstr');
  setC('pig1','pig1'); setC('pig2','pig2'); setC('eyecol','eyecol'); setC('eyecol2','eyecol2');
  setC('iridcol','iridcol'); setC('iridcol2','iridcol2');

  $('irid').checked = (m.irid==='1' || m.irid==='true');
  toggleIrid();
  render();
  return true;
}
function readRecordFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => applyRecord(parseRecord(reader.result));
  reader.readAsText(file);
}
// the Restore button opens a hidden file picker
$('restore').addEventListener('click', ()=> $('recordfile').click());
$('recordfile').addEventListener('change', e=>{
  readRecordFile(e.target.files[0]);
  e.target.value = '';   // let the same file be chosen again
});
// …and a record dropped anywhere on the tool restores too — drop your feather here
(function(){
  const frame = document.querySelector('.frame');
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  frame.addEventListener('dragover', e=>{ stop(e); frame.style.outline='2px dashed var(--moor)'; frame.style.outlineOffset='-6px'; });
  frame.addEventListener('dragleave', e=>{ stop(e); frame.style.outline=''; });
  frame.addEventListener('drop', e=>{ stop(e); frame.style.outline=''; readRecordFile(e.dataTransfer.files[0]); });
})();

// open on a different feather every time — the tool greets you with a wander,
// not the same specimen twice. A grid reference in the URL hash (e.g.
// #SD 9421 7638) still wins, so a shared link always lands on its own feather.
(function(){
  const fromHash = decodeURIComponent(location.hash.replace(/^#/,'')).trim();
  if(fromHash){ $('coord').value = fromHash; conjureFrom(fromHash); }
  else wander();
})();

/* ---- whisper our height to an embedding page, so the iframe can size itself
   exactly to the tool — no guessed height, no inner scrollbar. The parent
   listens for { feaffer:'height' } and sets the iframe height to match. ---- */
(function(){
  const frame = document.querySelector('.frame');
  let last = 0;
  function whisper(){
    // Full bleed only when we ARE the device — the iframe as wide as the screen
    // itself — not merely narrow. A half-width column on a laptop is narrow too,
    // but there the frame keeps its sides. screen.width is the whole device and
    // ignores the iframe; innerWidth is our own slice of it. Within a whisker of
    // each other means nothing else shares the width: shed the side hairlines.
    frame.classList.toggle('bleed', window.innerWidth >= window.screen.width * 0.9);
    if(window.parent === window) return;           // standalone: nobody to tell
    const h = Math.ceil(frame.getBoundingClientRect().height);
    if(h && h !== last){ last = h; window.parent.postMessage({ feaffer:'height', height:h }, '*'); }
  }
  window.addEventListener('load', whisper);
  window.addEventListener('resize', whisper);
  if(window.ResizeObserver) new ResizeObserver(whisper).observe(frame);
  whisper();
})();
</script>
