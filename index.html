<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Feaffer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    /* The universal ground — the whole website's Northumberland-sky grey. */
    --ground: #e6eaec;
    /* The control sheet. Flip to #f2f0ea for a warm-paper panel; leave as
       var(--ground) to keep everything on the one grey. One word to change. */
    --sheet:  var(--ground);

    --ink:   #2b2a24;   /* flat ink */
    --sepia: #6f5f43;   /* the mono labels */
    --moor:  #4a5340;   /* the single accent, used sparingly */
    --rust:  #8c5a3c;   /* the Particular — readouts only */
    --line:  #c3c7c3;   /* the field-plate rule, sat on grey */
    --faint: #7c7a70;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    min-height: 100%;
    background: var(--ground);
    color: var(--ink);
    font-family: 'EB Garamond', Georgia, serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;   /* the page never scrolls sideways; the drawers do */
  }

  /* The whole instrument is one fixed viewport laid out top to bottom: a slim
     provenance header, the feather standing in the middle, and the faffing
     drawers gathered at the foot where the thumb rests. Nothing scrolls up
     and down — the two drawers slide sideways instead. */
  /* A neat closed panel sized to its own content, so an embedding iframe can
     be told exactly how tall to be (see the height-whisper at the foot of the
     script) — no guessed heights, no letterboxing, no double scrollbars. */
  .frame {
    max-width: 560px; margin: 0 auto;
    display: flex; flex-direction: column;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  /* When Feaffer truly fills the device edge to edge, the two side hairlines
     are all that stand between the instrument and the screen. Shed them for a
     full-bleed embed; the top and bottom lines stay, a perch for the feathers.
     A bare width test won't do: a narrow column on a wide laptop is also under
     560px, yet there the frame sits beside its neighbours and the sides read as
     intentional. So the class is set by the width-check at the foot of the
     script, which asks the sharper question — am I as wide as the whole device? */
  .frame.bleed { border-left: none; border-right: none; }

  /* ——— the provenance header: seed a feather, or take the one you have ——— */
  .head {
    background: var(--sheet);
    padding: .8rem clamp(.9rem, 4vw, 1.4rem) .75rem;
    border-bottom: 1px solid var(--line);
    display: flex; flex-direction: column; gap: .55rem;
  }
  .head input[type=text]{
    width: 100%; background: transparent; border: 1px solid var(--line);
    padding: .55rem .7rem; font-family: 'IBM Plex Mono', monospace;
    font-size: .82rem; letter-spacing: .06em; color: var(--ink);
  }
  .head input:focus { outline: 1px solid var(--moor); }
  .btns { display: flex; gap: .5rem; }
  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .64rem; letter-spacing: .1em; text-transform: uppercase;
    padding: .55rem .6rem; cursor: pointer; flex: 1;
    background: var(--moor); color: var(--ground);
    border: 1px solid var(--moor); transition: background .15s;
    white-space: nowrap;
  }
  button:hover { background: #3a4232; }
  button.ghost { background: transparent; color: var(--moor); }
  button.ghost:hover { background: #4a534014; }
  button:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }

  /* ——— the stage: the feather stands here and fills whatever is left ——— */
  .stage {
    height: clamp(300px, 88vw, 460px);   /* the feather's room — scales with width, not viewport height */
    background: var(--ground);
    display: flex; align-items: center; justify-content: center;
    padding: 1rem;
  }
  #feather { display: block; height: 100%; width: auto; max-width: 100%; }

  /* ——— a faffing drawer: a bordered row of fixed cells you swipe sideways.
     A control that wants more room goes LONG — another cell — never TALL, so
     every cell keeps the same height and the drawer stays a clean band. ——— */
  .drawer {
    display: flex;
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    border-top: 1px solid var(--line);
    background: var(--sheet);
    scrollbar-width: none;
  }
  .drawer::-webkit-scrollbar { height: 0; }

  /* the drawer's name, held to the left edge so you always know which band
     you are faffing even after you have swiped a way along it */
  .rail {
    flex: 0 0 auto;
    position: sticky; left: 0; z-index: 2;
    background: var(--sheet);
    width: 58px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .58rem; letter-spacing: .18em; text-transform: uppercase;
    color: var(--sepia);
    writing-mode: vertical-rl; transform: rotate(180deg);
  }

  /* one cell of the bench */
  .card {
    flex: 0 0 auto;
    width: 150px; height: 84px;
    border-right: 1px solid var(--line);
    padding: .6rem .7rem;
    display: flex; flex-direction: column; justify-content: center; gap: .3rem;
  }
  .card:last-child { border-right: none; }
  .card .cap { display: flex; justify-content: space-between; align-items: baseline; gap: .3rem; }
  .card label, .card .cap > span:first-child {
    font-size: .9rem; line-height: 1.15;
  }
  .card .val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .62rem; color: var(--rust); white-space: nowrap;
  }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 1px; background: var(--line);
    outline: none; cursor: pointer; margin: .2rem 0 .1rem;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--ground); border: 1.5px solid var(--moor);
  }
  input[type=range]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--ground); border: 1.5px solid var(--moor);
  }
  input[type=range]:disabled { opacity: .3; cursor: not-allowed; }

  /* a cell that holds two pigment wells side by side */
  .swatchcard .swatches { display: flex; gap: .4rem; align-items: center; }
  input[type=color] {
    -webkit-appearance: none; appearance: none; border: 1px solid var(--line);
    width: 40px; height: 28px; padding: 0; background: none; cursor: pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border: none; }
  input[type=color]:disabled { opacity: .3; cursor: not-allowed; }

  /* the iridescence switch — a cell you tap to light the sheen controls */
  .actcard { cursor: pointer; user-select: none; }
  .actcard .actrow { display: flex; align-items: center; gap: .45rem; }
  .actcard input { accent-color: var(--moor); width: 17px; height: 17px; cursor: pointer; }
  .actcard .actstate {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .58rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint);
  }

  /* ——— the colour wells & Feaffer's own HSL picker ———
     The native swatch still holds and shows the tone, but a clear overlay
     catches the tap and opens our picker instead of the operating system's
     one — which hid lightness and made the vague, greyed-off feather colours
     all but unreachable. */
  .stage { position: relative; }   /* the picker floats within the stage */
  .well { position: relative; display: inline-block; line-height: 0; }
  .well input[type=color] { pointer-events: none; }   /* the overlay does the talking */
  .wellhit { position: absolute; inset: 0; display: block; cursor: pointer; }
  .wellhit:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
  .wellhit[aria-disabled=true] { cursor: not-allowed; }

  .hslpop {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    z-index: 10; width: min(300px, 92%);
    background: var(--sheet); border: 1px solid var(--line);
    box-shadow: 0 6px 22px #2b2a2422;
    padding: .7rem .8rem .65rem;
    display: flex; flex-direction: column; gap: .5rem;
  }
  .hslpop[hidden] { display: none; }
  .hsltitle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: .58rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--sepia);
  }
  .hslrow { display: flex; align-items: center; gap: .6rem; }
  .hslrow > label {
    font-family: 'IBM Plex Mono', monospace; font-size: .74rem;
    color: var(--sepia); width: 1ch; flex: 0 0 auto; text-align: center;
  }
  .hslrow .hslv {
    font-family: 'IBM Plex Mono', monospace; font-size: .6rem;
    color: var(--rust); width: 3.4em; text-align: right; flex: 0 0 auto;
  }
  /* the gradient tracks — taller than the field sliders, and painted live so
     you slide toward a colour you can already see */
  .hslrow input[type=range] {
    flex: 1; width: auto; height: 12px; border-radius: 6px;
    border: 1px solid var(--line); margin: 0;
  }
  .hslfoot { display: flex; align-items: center; justify-content: space-between; margin-top: .1rem; }
  .hslhex {
    font-family: 'IBM Plex Mono', monospace; font-size: .72rem;
    color: var(--ink); letter-spacing: .06em;
  }
  .hslpop button#hsldone { flex: 0 0 auto; width: auto; padding: .42rem .95rem; }

</style>
</head>
<body>
<main class="frame">

  <header class="head">
    <input type="text" id="coord" value="SD 9421 7638" spellcheck="false" aria-label="Grid reference — a coordinate seeds a specific feather">
    <div class="btns">
      <button id="conjure">Conjure from grid</button>
      <button id="random" class="ghost">Wander</button>
      <button id="restore" class="ghost" title="open a saved Record and reconjure that exact feather — or drop the .txt anywhere on the tool">Restore &uarr;</button>
    </div>
    <input type="file" id="recordfile" accept=".txt,text/plain" hidden aria-hidden="true">
    <div class="btns">
      <button id="save" class="ghost" title="the vector original, on a transparent ground">Specimen &darr;</button>
      <button id="png" class="ghost" title="a specimen card to share — the feather on the sky-grey, its grid reference at the foot">Portrait &darr;</button>
      <button id="receipt" class="ghost" title="the full record as text — every parameter, so the tool can reconjure this exact feather">Record &darr;</button>
    </div>
  </header>

  <section class="stage">
    <svg id="feather" viewBox="0 0 400 640" preserveAspectRatio="xMidYMid meet" aria-label="A generated feather specimen"></svg>

    <!-- ——— Feaffer's own HSL picker — floats here so the feather stays in
         view above it and recolours live as you slide ——— -->
    <div class="hslpop" id="hslpop" hidden role="dialog" aria-label="Colour picker">
      <div class="hsltitle" id="hsltitle">colour</div>
      <div class="hslrow"><label for="hslH" title="Hue">H</label><input type="range" id="hslH" min="0" max="360" value="0"><span class="hslv" id="hslH-v"></span></div>
      <div class="hslrow"><label for="hslS" title="Saturation">S</label><input type="range" id="hslS" min="0" max="100" value="0"><span class="hslv" id="hslS-v"></span></div>
      <div class="hslrow"><label for="hslL" title="Lightness">L</label><input type="range" id="hslL" min="0" max="100" value="0"><span class="hslv" id="hslL-v"></span></div>
      <div class="hslfoot"><span class="hslhex" id="hslhex">#000000</span><button type="button" id="hsldone">Done</button></div>
    </div>
  </section>

  <!-- ——— FORM: the shape of the thing you swipe through ——— -->
  <div class="drawer" role="group" aria-label="Form">
    <div class="rail">Form</div>

    <div class="card" title="how far the shaft reaches from calamus to tip">
      <div class="cap"><label for="len">Rachis length</label><span class="val" id="len-v"></span></div>
      <input type="range" id="len" min="380" max="600" value="520">
    </div>
    <div class="card" title="the wind it grew against">
      <div class="cap"><label for="curve">Shaft curvature</label><span class="val" id="curve-v"></span></div>
      <input type="range" id="curve" min="-90" max="90" value="24">
    </div>
    <div class="card" title="how broad the vane blooms">
      <div class="cap"><label for="width">Vane breadth</label><span class="val" id="width-v"></span></div>
      <input type="range" id="width" min="30" max="130" value="78">
    </div>
    <div class="card actcard" id="apexcard" role="button" tabindex="0"
         title="the apex family — every feather closes one of three ways: rounded (a dome), acuminate (a point), truncate (a square cut)">
      <div class="cap"><span>Apex</span><span class="val" id="apextype-v"></span></div>
      <div class="actrow"><span class="actstate">tap to turn the family</span></div>
    </div>
    <div class="card" title="the degree within the family — fullness of the dome, fineness of the point, or the corner of the cut">
      <div class="cap"><label for="apex" id="apex-label">Fullness</label><span class="val" id="apex-v"></span></div>
      <input type="range" id="apex" min="0" max="100" value="35">
    </div>
    <div class="card" title="leading edge narrows — the mark of a flight feather">
      <div class="cap"><label for="asym">Vane asymmetry</label><span class="val" id="asym-v"></span></div>
      <input type="range" id="asym" min="0" max="100" value="0">
    </div>
    <div class="card" title="the vane cups out of the page — the webs foreshorten toward their margins and the light falls across the curve. 0 is a pressed specimen">
      <div class="cap"><label for="camber">Camber</label><span class="val" id="camber-v"></span></div>
      <input type="range" id="camber" min="0" max="100" value="0">
    </div>
    <div class="card" title="the angle the barbs comb off the shaft">
      <div class="cap"><label for="angle">Barb angle</label><span class="val" id="angle-v"></span></div>
      <input type="range" id="angle" min="20" max="72" value="46">
    </div>
    <div class="card" title="the gauge of the weave — how close the barbs comb, set where the vane is broadest. The rows crowd wherever the barbs are shorter, so the gap stays the same fraction of a barb all the way to the tip">
      <div class="cap"><label for="density">Barb density</label><span class="val" id="density-v"></span></div>
      <input type="range" id="density" min="30" max="170" value="100">
    </div>
    <div class="card" title="the barbules that zip neighbouring barbs into a single web — two ranks off every barb, leaning opposite ways and meeting their neighbour's in the middle. Far too fine to draw them all, so a fraction of them is, at the finest pitch this page can still hold apart as lines. A loose weave is fewer of them, never fainter ones. At nothing, the bare comb">
      <div class="cap"><label for="knit">Barbule knit</label><span class="val" id="knit-v"></span></div>
      <input type="range" id="knit" min="0" max="100" value="55">
    </div>
    <div class="card" title="soft, disordered barbs at the base">
      <div class="cap"><label for="down">Plumaceous down</label><span class="val" id="down-v"></span></div>
      <input type="range" id="down" min="0" max="80" value="18">
    </div>
    <div class="card" title="the aftershaft — a whole second downy plume off the superior umbilicus, the way a grouse wears one">
      <div class="cap"><label for="after">Aftershaft</label><span class="val" id="after-v"></span></div>
      <input type="range" id="after" min="0" max="100" value="0">
    </div>
    <div class="card" title="the fraying and gaps of a feather that has flown">
      <div class="cap"><label for="wear">Age &amp; wear</label><span class="val" id="wear-v"></span></div>
      <input type="range" id="wear" min="0" max="100" value="22">
    </div>
  </div>

  <!-- ——— COLOUR: pigment, pattern and the structural sheen ——— -->
  <div class="drawer" role="group" aria-label="Colour">
    <div class="rail">Colour</div>

    <div class="card swatchcard" title="base &amp; shadow of the barbs">
      <div class="cap"><span>Ground &amp; shade</span></div>
      <div class="swatches">
        <span class="well"><input type="color" id="pig1" value="#6a5333" tabindex="-1" aria-hidden="true"><span class="wellhit" data-for="pig1" role="button" tabindex="0" aria-label="Ground tone"></span></span>
        <span class="well"><input type="color" id="pig2" value="#3a2c18" tabindex="-1" aria-hidden="true"><span class="wellhit" data-for="pig2" role="button" tabindex="0" aria-label="Shade tone"></span></span>
      </div>
    </div>
    <div class="card" title="how much of the SHADE tone paints the plain vane — thin at the tip, deeper toward the base, and always well short of the marks, which pull deeper still. 'As grown' is how a feather has always been dyed; wind it down to ground-only, or up until the whole vane goes to shade and the marks all but vanish into it">
      <div class="cap"><label for="shadedepth">Shade depth</label><span class="val" id="shadedepth-v"></span></div>
      <input type="range" id="shadedepth" min="0" max="100" value="30">
    </div>
    <div class="card" title="TEMPORARY colour faffing — the vividness of the GROUND pigment, saturation worn at the source so it colours the whole feather's base and the pale end of every mark. Down toward grey is the murk; 100 is as grown; up is the vivid the ridiculous birds need">
      <div class="cap"><label for="groundint">Ground intensity</label><span class="val" id="groundint-v"></span></div>
      <input type="range" id="groundint" min="0" max="200" value="100">
    </div>
    <div class="card" title="TEMPORARY colour faffing — the vividness of the SHADE pigment, which is where nearly all the marks live: the bars, the band, the specks, the darkened base. Down toward grey, 100 as grown, up toward a macaw. Pairs with Shade depth (how MUCH shade) and this (how VIVID it is)">
      <div class="cap"><label for="markint">Marking intensity</label><span class="val" id="markint-v"></span></div>
      <input type="range" id="markint" min="0" max="200" value="100">
    </div>
    <div class="card" title="the SHADING — the light-and-shade that models the feather's form (the camber's lit and shaded webs, and the per-barb melange tilt). It multiplies each stroke's colour, so on a white feather it can only DARKEN — the highlight has nowhere to go above white and the shadow bites in full, which is most of why a pale vane greys. Flatten it toward 0 to lift the shadows off; 100 is as grown; up is deeper relief. Distinct from the shade TONE and from Shade depth">
      <div class="cap"><label for="shading">Shading</label><span class="val" id="shading-v"></span></div>
      <input type="range" id="shading" min="0" max="200" value="100">
    </div>
    <div class="card" title="dark bands across the vane">
      <div class="cap"><label for="bars">Barring</label><span class="val" id="bars-v"></span></div>
      <input type="range" id="bars" min="0" max="12" value="0">
    </div>
    <div class="card" title="draw the bars onto one web of the vane only">
      <div class="cap"><label for="barside">Bar side</label><span class="val" id="barside-v"></span></div>
      <input type="range" id="barside" min="0" max="100" value="0">
    </div>
    <div class="card" title="ragged, mottled bar edges instead of clean bands">
      <div class="cap"><label for="baredge">Bar edge</label><span class="val" id="baredge-v"></span></div>
      <input type="range" id="baredge" min="0" max="100" value="0">
    </div>
    <div class="card" title="a dark tip, as on a grouse or pheasant">
      <div class="cap"><label for="tipband">Terminal band</label><span class="val" id="tipband-v"></span></div>
      <input type="range" id="tipband" min="0" max="40" value="0">
    </div>
    <div class="card" title="the bars stop marching and start wandering — a woodcock's vermiculation. Wind the barring up alongside it for the finest weather">
      <div class="cap"><label for="marble">Marbling</label><span class="val" id="marble-v"></span></div>
      <input type="range" id="marble" min="0" max="100" value="0">
    </div>
    <div class="card" title="flecks &amp; splodges grown into the barbs themselves">
      <div class="cap"><label for="speck">Spots &amp; splodges</label><span class="val" id="speck-v"></span></div>
      <input type="range" id="speck" min="0" max="100" value="0">
    </div>
    <div class="card" title="the grain of the spotting — fine freckle at the left, splodge at the right. The count follows: at a given amount, smaller spots means more of them">
      <div class="cap"><label for="specksize">Spot size</label><span class="val" id="specksize-v"></span></div>
      <input type="range" id="specksize" min="0" max="100" value="30">
    </div>
    <div class="card" title="a paler or darker edge to the vane, curving round from the terminal band — left of centre pale, right of centre dark; follows Bar side onto one web">
      <div class="cap"><label for="margin">Margin</label><span class="val" id="margin-v"></span></div>
      <input type="range" id="margin" min="-100" max="100" value="0">
    </div>
    <div class="card swatchcard" title="the bright — the one colour on a feather that is not melanin. It does not make a mark of its own; it rides the marks already there, claiming them from their outer edge inward. Its HUE decides what it is made of: warm and it is FOOD, a carotenoid out of the bird's diet, flat and matt and the same from every angle; cool and it is LIGHT, a nanostructure scattering blue off the barb, which blazes where the vane turns to the lamp and goes near-black where it turns away. There is no blue pigment in a bird, so nothing here needs asking — the colour says which it is">
      <div class="cap"><span>The bright</span></div>
      <div class="swatches">
        <span class="well"><input type="color" id="bright" value="#d8a520" tabindex="-1" aria-hidden="true"><span class="wellhit" data-for="bright" role="button" tabindex="0" aria-label="The bright"></span></span>
      </div>
    </div>
    <div class="card" title="how much of each mark the bright claims, measured from the mark's outer edge inward — so a terminal band comes out plain at its root and bright at the tip, which is the two-band finish half the moor wears. At nothing, no bright at all; at the full, the mark is bright end to end">
      <div class="cap"><label for="brightcover">Bright cover</label><span class="val" id="brightcover-v"></span></div>
      <input type="range" id="brightcover" min="0" max="100" value="0">
    </div>
    <div class="card" title="the ocellus — a peacock's eye, grown into the barbs; past 100 it goes GIANT, taking its scale from the feather's whole length, until the rings are country the feather merely crosses">
      <div class="cap"><label for="eye">Eyespot</label><span class="val" id="eye-v"></span></div>
      <input type="range" id="eye" min="0" max="300" value="0">
    </div>
    <div class="card swatchcard" title="the heart of the eye &amp; the halo around it — a heart matched to the ground pigment sinks into the vane, leaving bare halo">
      <div class="cap"><span>Eye colours</span></div>
      <div class="swatches">
        <span class="well"><input type="color" id="eyecol" value="#1d3f8f" tabindex="-1" aria-hidden="true"><span class="wellhit" data-for="eyecol" role="button" tabindex="0" aria-label="Eye heart colour"></span></span>
        <span class="well"><input type="color" id="eyecol2" value="#8a6a2f" tabindex="-1" aria-hidden="true"><span class="wellhit" data-for="eyecol2" role="button" tabindex="0" aria-label="Eye halo colour"></span></span>
      </div>
    </div>
    <div class="card" title="open a window in the heart of the eye — at 0 the pupil is a solid disc, the peacock's true way; wound up, the centre clears to nothing and the vane's own pattern shows through, hazing at the edge. A trick for magpies and other made-up birds">
      <div class="cap"><label for="eyepupil">Pupil window</label><span class="val" id="eyepupil-v"></span></div>
      <input type="range" id="eyepupil" min="0" max="100" value="0">
    </div>
    <div class="card" title="where along the shaft the eye sits — past 100 it slips off the tip until only its lower rim clings on; below 0 it stands off the quill, and a giant's ring arcs cross the vane as bands">
      <div class="cap"><label for="eyepos">Eye position</label><span class="val" id="eyepos-v"></span></div>
      <input type="range" id="eyepos" min="-40" max="108" value="70">
    </div>
    <div class="card" title="cast the eye toward one web — at full cast only its rings still lap the vane's edge; the jay's trick">
      <div class="cap"><label for="eyeside">Eye cast</label><span class="val" id="eyeside-v"></span></div>
      <input type="range" id="eyeside" min="-100" max="100" value="0">
    </div>

    <label class="card actcard" title="a structural sheen">
      <div class="cap"><span>Iridescence</span></div>
      <div class="actrow"><input type="checkbox" id="irid"><span class="actstate">a structural sheen</span></div>
    </label>
    <div class="card swatchcard" title="two hues it shifts between">
      <div class="cap"><span>Sheen colours</span></div>
      <div class="swatches">
        <span class="well"><input type="color" id="iridcol" value="#1f6f8c" tabindex="-1" aria-hidden="true" disabled><span class="wellhit" data-for="iridcol" role="button" tabindex="0" aria-label="Sheen colour" aria-disabled="true"></span></span>
        <span class="well"><input type="color" id="iridcol2" value="#5e2f7a" tabindex="-1" aria-hidden="true" disabled><span class="wellhit" data-for="iridcol2" role="button" tabindex="0" aria-label="Second sheen colour" aria-disabled="true"></span></span>
      </div>
    </div>
    <div class="card" title="where along the vane it pools">
      <div class="cap"><label for="iridpos">Sheen position</label><span class="val" id="iridpos-v"></span></div>
      <input type="range" id="iridpos" min="0" max="100" value="65" disabled>
    </div>
    <div class="card" title="how far the sheen spreads">
      <div class="cap"><label for="iridspread">Sheen spread</label><span class="val" id="iridspread-v"></span></div>
      <input type="range" id="iridspread" min="10" max="100" value="45" disabled>
    </div>
    <div class="card" title="how strong the sheen burns">
      <div class="cap"><label for="iridstr">Sheen strength</label><span class="val" id="iridstr-v"></span></div>
      <input type="range" id="iridstr" min="10" max="100" value="60" disabled>
    </div>
  </div>

</main>

<script>
/* ---- seeded randomness ---- */
function hashStr(s){ let h=1779033703^s.length;
  for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return (h^=h>>>16)>>>0; };
}
function mulberry(seed){ let a=seed; return ()=>{ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// a dedicated, replayable rng for the *drawing* so tweaks don't flicker.
let drawSeed = 12345;

// the apex family — feather tips are categorical, not a slide: field guides
// say ROUNDED, ACUMINATE, TRUNCATE, and each closes by its own mechanism
// (a dome wraps, a point tapers, a square cut shears). 0 · 1 · 2.
let apexType = 0;
function freshDraw(){ return mulberry(drawSeed); }

const $ = id => document.getElementById(id);
const P = {
  len:$('len'), curve:$('curve'), width:$('width'), apex:$('apex'), asym:$('asym'),
  camber:$('camber'), angle:$('angle'),
  density:$('density'), knit:$('knit'), down:$('down'), after:$('after'), wear:$('wear'),
  bars:$('bars'), barside:$('barside'), baredge:$('baredge'), tipband:$('tipband'), speck:$('speck'),
  margin:$('margin'), marble:$('marble'), specksize:$('specksize'),
  shadedepth:$('shadedepth'), groundint:$('groundint'), markint:$('markint'), shading:$('shading'),
  brightcover:$('brightcover'),
  eye:$('eye'), eyepupil:$('eyepupil'), eyepos:$('eyepos'), eyeside:$('eyeside'),
  iridpos:$('iridpos'), iridspread:$('iridspread'), iridstr:$('iridstr')
};

/* colour helpers */
function hexToRgb(h){ const n=parseInt(h.slice(1),16); return {r:n>>16&255,g:n>>8&255,b:n&255}; }
// hex -> HSL (h 0..360, s/l 0..100), the reading the picker and records show
function hexToHsl(hex){
  let {r,g,b} = hexToRgb(hex); r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0, s=0, l=(max+min)/2;
  if(d){
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    h = max===r ? (g-b)/d + (g<b?6:0) : max===g ? (b-r)/d + 2 : (r-g)/d + 4;
    h/=6;
  }
  return { h:Math.round(h*360), s:Math.round(s*100), l:Math.round(l*100) };
}
/* Path numbers as short as the SVG grammar allows: one decimal, no trailing
   ".0", no leading zero, and no separator before a sign or a dot. A knitted
   vane carries tens of thousands of these, and the shorthand is worth most of
   a megabyte on a busy feather — for a file that draws identically. */
function nm(v){ let r=Math.round(v*10); if(!r) return '0';
  const neg = r<0; if(neg) r=-r;
  const w=(r/10)|0, d=r-w*10;
  return (neg?'-':'') + (w?w:'') + (d?'.'+d:''); }
/* Two numbers, run together wherever the grammar lets them be — and it lets
   them less often than this once assumed. A leading '-' always delimits: a
   minus sign cannot continue the number before it. A leading '.' only
   delimits if that number ALREADY carries a point, because a second point is
   what ends the first number — '3.5.2' is two numbers, but '3' and '.2' run
   together into the single number '3.2', and the whole rest of the path dies
   on the spot. Which is exactly what a knitted vane was doing: nearly half of
   its barbule paths were invalid, and a renderer that meets a bad number
   draws the valid prefix and abandons the rest of the path. Every welded
   barbule took all its followers with it. */
function pair(x,y){ const a=nm(x), b=nm(y);
  const welds = b[0]==='-' || (b[0]==='.' && a.indexOf('.')>=0);
  return a + (welds ? '' : ' ') + b; }

function mix(a,b,t){ return {r:a.r+(b.r-a.r)*t, g:a.g+(b.g-a.g)*t, b:a.b+(b.b-a.b)*t}; }
/* Colours are carried around this tool as unclamped numbers on purpose — the
   camber multiplies, the sheen screens, the melange tilts, and a term that
   clamped at every step would lose the headroom the next one needs. So the
   clamp goes where a colour becomes TEXT, which is the only place it matters.
   It matters more than it looks: the barbule key rounds with `&252`, and a
   bitwise mask does not clamp, it WRAPS — a channel that came out at 281 was
   being written as 24, and a pale vane lit past white grew a scatter of
   electric-blue barbules where three channels wrapped at different moments.
   The overflow was always possible; the melange's tilt is what pushed enough
   of them over 255 to see it. */
const cl255 = v => v < 0 ? 0 : v > 255 ? 255 : v|0;
function rgbStr(c){ return `rgb(${cl255(c.r)} ${cl255(c.g)} ${cl255(c.b)})`; }
function darken(c,f){ return {r:c.r*f,g:c.g*f,b:c.b*f}; }
/* Saturation as a lever, worn like darken(): push a colour away from its own
   grey (k>1, more vivid) or toward it (k<1, murkier), k=1 leaving it be. The
   grey is the colour's luma, so lightness is untouched — only the distance from
   neutral moves. Left unclamped like everything else here; it clamps at text. */
function saturate(c,k){ if(k===1) return c;
  const l = 0.299*c.r + 0.587*c.g + 0.114*c.b;
  return { r: l+(c.r-l)*k, g: l+(c.g-l)*k, b: l+(c.b-l)*k }; }

/* ---- the growing of a feather ---- */
function drawFeather(){
  const svg = $('feather');
  const W = 400, H = 640;
  const cx = W/2;
  const baseY = H - 40, tipReach = +P.len.value;
  const tipY = baseY - tipReach;
  const TIP_ZONE = 0.76;   // where the barbs begin sweeping forward over the tip
  const RACHIS_END = 0.9;  // the visible quill stops here; barbs close the tip

  const curvature = +P.curve.value;
  const vaneW = +P.width.value;
  const apexDeg = +P.apex.value/100;              // the degree within the apex family
  const asym = +P.asym.value/100;                 // 0 symmetric .. 1 strong flight feather
  const camber = +P.camber.value/100;             // 0 a pressed specimen .. 1 a cupped one
  const barbAngle = +P.angle.value * Math.PI/180;
  const nBarbs = +P.density.value;
  const knit = +P.knit.value/100;         // 0 the bare comb .. 1 a zipped web
  // THE KNIT IS A COUNT, NOT A FADE.
  //
  // For a long while this slider did exactly one thing: it set the opacity of
  // the barbule layer. The same barbules were laid in the same places at every
  // setting from 1 to 100, and the dial only decided how hard to wash them out.
  // Which meant the vane paid for the whole weave and showed a third of it —
  // at the conjure's usual quarter, fifty-seven per cent of a specimen's bytes
  // went out at three-tenths alpha.
  //
  // And it quietly did the one thing this tool had already talked itself out
  // of doing. A hairline at 0.3 alpha is not a hairline; it is a third of a
  // line, which is a TONE. The whole argument for drawing barbules rather than
  // averaging them is that the eye reads the second order as grain — so fading
  // them until they average is the same mistake wearing a different hat, and
  // it was the more expensive hat. (The soft ribbon that came before them made
  // the honest version of this error and was rightly thrown out; this was the
  // dishonest version, and it survived because it was hiding in an attribute.)
  //
  // So the knit buys BARBULES, and the layer is drawn at the weight a hairline
  // deserves whatever the setting. A loose weave is fewer lines, not fainter
  // ones — which is what a loose weave is on the bird, and what it costs on
  // the page.
  //
  // BUT IT MUST NOT BUY THEM BY CHANGING THEIR PITCH, which the first cut of
  // this did, and a moiré came out of the middle of the slider to say so.
  //
  // A vane carries two lattices. The barbs sit at one spacing across the web —
  // on a middling feather, 4.35 px — and the barbules sit at another along each
  // barb, leaning 42° across the first. Drive the barbule pitch with the knit
  // and it sweeps straight through the barb spacing on its way:
  //
  //     knit   10    20    30    45    65    90
  //     pitch 6.43  4.25  3.34  2.62  2.10  1.73 px
  //     ratio 1.48  0.98  0.77  0.60  0.48  0.40
  //
  // At knit 20 the two lattices are the SAME SPACING, and two combs of one
  // pitch crossed at an angle are the definition of a moiré. Which is exactly
  // what the middle of the slider drew — a watermark of lozenges standing up
  // the inner vane — while both ends ran clean, one too coarse to phase-lock
  // and the other too fine to resolve.
  //
  // So the pitch stays pinned at the finest the page can hold, always, and the
  // knit moves HOW FAR OUT ALONG THE BARB the rank runs instead. Which is the
  // better answer twice over, because a spacing can beat against another
  // spacing and an EXTENT CANNOT — there is no frequency in it to beat with —
  // and because it is what an unzipping vane actually does. Hooks let go at the
  // margin first. A well-knit vane is zipped nearly to the ends of its barbs; a
  // poorly-knit one holds on close to the rachis and flies loose outside that,
  // which is both what a worn feather looks like and what "unzipped" means.
  const knitSpan = knit;
  const KNIT_ALPHA = 0.62;   // the weight of a barbule, and it does not move
  const downFrac = +P.down.value/100;
  const wear = +P.wear.value/100;
  const afterFrac = +P.after.value/100;   // the aftershaft: 0 none .. 1 a grouse's
  const nBars = +P.bars.value;
  const tipBand = +P.tipband.value/100;
  const barBias = +P.barside.value/100;   // 0 bars on both webs .. 1 one web only
  const barEdge = +P.baredge.value/100;   // 0 crisp bands .. 1 ragged, mottled
  const speck = +P.speck.value/100;        // how MUCH of the vane is spotted
  const speckSize = +P.specksize.value/100;// and how COARSE the spotting is
  const margin = +P.margin.value/100;     // −1 a pale edge .. 0 none .. +1 a dark one
  const marble = +P.marble.value/100;     // 0 bars that march .. 1 bars that wander
  const eyeSize = +P.eye.value/100;       // 0 no ocellus .. 1 the vane's breadth .. 3 truly giant
  const eyeT = +P.eyepos.value/100;       // where along the shaft the eye sits
  const eyeSide = +P.eyeside.value/100;   // the cast: 0 a true eye .. ±1 sent off a web

  // GROUND & MARKING INTENSITY — temporary colour-faffing dials, saturation
  // multipliers worn at the source so they cascade everywhere the pigment goes.
  // Ground rides pig1 (the plain vane's base and the pale end of every mark);
  // marking rides pig2 (the shade, which is where nearly all the marks live).
  // 100 is 'as grown'; down toward grey is the murk, up is the vivid a kākāpō
  // needs. They mix with Shade depth to give a small three-dial colour cockpit.
  const groundInt = (+P.groundint.value)/100, markInt = (+P.markint.value)/100;
  const pig1 = saturate(hexToRgb($('pig1').value), groundInt);
  const pig2 = saturate(hexToRgb($('pig2').value), markInt);

  // ================= THE BRIGHT =================
  //
  // The one colour on a feather that is not melanin — and it is two quite
  // different things wearing one slider, which is the whole reason this works.
  //
  // FOOD. Reds, oranges and yellows are carotenoids: pigment, eaten, deposited
  // into the growing feather. A flamingo is pink because of what it stands in.
  // Pigment absorbs, so it is flat and matt and exactly the same colour from
  // every angle you hold it at.
  //
  // LIGHT. Blues are not pigment. THERE IS NO BLUE PIGMENT IN A BIRD — not one,
  // the world over, bar a couple of turacos with a copper trick. Every blue
  // feather there has ever been is a nanostructure: a spongy layer of keratin
  // in the barb, scattering the short wavelengths back at you over a dark
  // melanin backing that swallows the rest. Which is why a jay's blue blazes
  // from one angle and dies from another, and why it needs the dark under it.
  //
  // And greens are both at once, nearly always — structural blue seen through a
  // carotenoid yellow — which is the kingfisher, the greenfinch and the parrot
  // in one sentence.
  //
  // So THE TOOL NEVER ASKS WHICH. It reads the hue and knows, because the
  // physics has already decided: warm is food, cool is light, and the green
  // between them is the mixture it really is. One fewer slider, and one more
  // thing a feather works out for itself.
  const brightRgb   = hexToRgb($('bright').value);
  const brightCover = +P.brightcover.value/100;
  const brightHsl   = hexToHsl($('bright').value);
  // how much of this hue is structural: nothing at all through the reds and
  // oranges and yellows, everything through the teals and blues and violets,
  // and the crossover laid across the greens, where the real thing is a
  // mixture. A grey bright has nothing to be structural WITH, so saturation
  // damps it toward pigment — an unsaturated colour is not scattering anything.
  const brightStruct = (() => {
    const h = brightHsl.h;
    const warm = h <= 70 || h >= 330;                 // scarlet .. gold
    const cool = h >= 165 && h <= 300;                // teal .. violet
    const f = warm ? 0 : cool ? 1
            : h < 165 ? (h - 70)/95                   // the green crossover
            :           1 - (h - 300)/30;             // and back through magenta
    return Math.max(0, Math.min(1, f)) * Math.min(1, brightHsl.s/45);
  })();

  const iridOn = $('irid').checked;
  const iridPos = +P.iridpos.value/100;
  const iridSpread = +P.iridspread.value/100;
  const iridStr = +P.iridstr.value/100;

  const rng = freshDraw();  // replayable each render
  // a second, independent stream for the fluff: the main stream's draw order
  // is a specimen's identity (its wear gaps, its barb jitter), so the down
  // wanders on its own replayable stream and faffing it never re-rolls the vane.
  const drng = mulberry((drawSeed ^ 0x9E3779B9) >>> 0);

  // barbules pool here — one shared path for the whole feather, so a cloud
  // of micro-wisps costs the SVG almost nothing.
  const fluffPool = [], afterPool = [];

  // a wandering strand: chained gentle turns around a per-strand curl, with a
  // whisper of droop — the shape of down. Draws only from the fluff stream.
  // A strand draws from whichever stream and pools its wisps wherever it is
  // told, so the aftershaft can wander on its own dice — faffing the plume
  // then never re-rolls the down, exactly as faffing the down never re-rolls
  // the vane.
  function strand(x0, y0, dx0, dy0, len, wildness, rn, pool){
    rn = rn || drng; pool = pool || fluffPool;
    const segs = 4;
    let px=x0, py=y0, dx=dx0, dy=dy0;
    const curl = (rn()-0.5)*2.6*wildness;   // the strand's own persuasion
    const pts = [[px,py]];
    for(let k=0;k<segs;k++){
      const turn = curl/segs + (rn()-0.5)*0.45*wildness;
      const ct=Math.cos(turn), st=Math.sin(turn);
      const ndx=dx*ct-dy*st, ndy=dx*st+dy*ct+0.08;   // +0.08 is gravity's word
      const dm=Math.hypot(ndx,ndy)||1; dx=ndx/dm; dy=ndy/dm;
      const sl=(len/segs)*(0.8+rn()*0.4);
      px+=dx*sl; py+=dy*sl; pts.push([px,py]);
    }
    let d=`M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for(let k=1;k<segs;k++){
      const hx=(pts[k][0]+pts[k+1][0])/2, hy=(pts[k][1]+pts[k+1][1])/2;
      d+=` Q ${pts[k][0].toFixed(1)} ${pts[k][1].toFixed(1)} ${hx.toFixed(1)} ${hy.toFixed(1)}`;
    }
    d+=` L ${pts[segs][0].toFixed(1)} ${pts[segs][1].toFixed(1)}`;

    // barbules — the micro-wisps that make down down. Interior points of the
    // strand sprout a curl or two, curving away harder than they leave.
    for(let k=1;k<pts.length;k++){
      const pdx=pts[k][0]-pts[k-1][0], pdy=pts[k][1]-pts[k-1][1];
      const pm=Math.hypot(pdx,pdy)||1;
      for(const j of [1,-1]){
        if(rn() > 0.85) continue;
        const rot=j*(0.35+rn()*0.45), blen=len*(0.07+rn()*0.13);
        const cr=Math.cos(rot), sr=Math.sin(rot);
        const bdx=(pdx*cr-pdy*sr)/pm, bdy=(pdx*sr+pdy*cr)/pm;
        const er=Math.cos(rot*1.7), es=Math.sin(rot*1.7);
        const edx=(pdx*er-pdy*es)/pm, edy=(pdx*es+pdy*er)/pm;
        const bx=pts[k][0], by=pts[k][1];
        pool.push(`M ${bx.toFixed(1)} ${by.toFixed(1)} Q ${(bx+bdx*blen*0.6).toFixed(1)} ${(by+bdy*blen*0.6).toFixed(1)} ${(bx+edx*blen).toFixed(1)} ${(by+edy*blen).toFixed(1)}`);
      }
    }
    return d;
  }

  // rachis quadratic
  const ctrlX = cx + curvature, ctrlY = (baseY + tipY)/2;
  const rachis = t => { const mt=1-t; return {
    x: mt*mt*cx + 2*mt*t*ctrlX + t*t*cx,
    y: mt*mt*baseY + 2*mt*t*ctrlY + t*t*tipY }; };
  const rachisTangent = t => {
    const dx=2*(1-t)*(ctrlX-cx)+2*t*(cx-ctrlX), dy=2*(1-t)*(ctrlY-baseY)+2*t*(tipY-ctrlY);
    const m=Math.hypot(dx,dy)||1; return {x:dx/m,y:dy/m}; };

  // THE APEX FAMILIES — a feather's tip is categorical, not a slide. The
  // continuous pointy-to-roundy blend was retired after a long season of
  // lumps: its midrange always ran two closing mechanisms at once, and the
  // failures lived in the mixture. Field guides know three families, each
  // with its own mathematics and its own way of closing:
  //   ROUNDED   — a superellipse crown, u^p + w² = 1, convex for every
  //               p ≥ 1, nowhere to hollow. The degree sweeps p: a slender
  //               parabolic dome, through the egg-shaped crown of a little
  //               downy feather, to breadth held late over a blunt paddle.
  //               The base exponent is sized in PIXELS so the dome turns
  //               over as deep along the shaft as the vane is wide across —
  //               a magpie's tail stays round at any length. Closes by
  //               WRAP (the fan, below).
  //   ACUMINATE — a taper, (1-u)^k. The degree is fineness: it draws the
  //               widest point down the shaft and steepens k from a soft
  //               convex point to the sweeping, gently-CONCAVE needle of a
  //               pheasant's tail — concavity is honest here; it is what
  //               acuminate means. Closes by TAPER alone: no fan, the
  //               barbs simply shorten to nothing.
  //   TRUNCATE  — the rounded body, but the vane simply ENDS: barbs shear
  //               off along a growth contour (the terminal band's chevron,
  //               reused as scissors). The degree is the corner — a smooth
  //               minimum against the outline cut rounds where the cut
  //               meets the side, crisp square to soft-shouldered. Vane
  //               asymmetry skews the cut toward a parallelogram unaided.
  const peak = apexType===1 ? 0.63 - apexDeg*0.24 : 0.63;
  const latK = Math.cos(barbAngle);   // the across-vane share of a barb's length

  // ================= THE CAMBER =================
  //
  // A feather is not flat, and everything above this line has drawn one that
  // is. The vane CUPS: the two webs curl out of the page toward their margins,
  // which does two things at once and they are the same thing.
  //
  // It FORESHORTENS. A web that curls away shows less of itself the further
  // out you look, so the barbs crowd together toward the margin — and that
  // crowding is most of what the eye reads as depth. The vane is modelled as a
  // cylinder about the rachis: a point at a true across-distance a sits at
  // angle a/R on it, so it draws at R·sin(a/R) and its surface tilts by a/R.
  //
  // And it LIGHTS. The tilt is a surface normal, so one web turns toward the
  // light and the other falls away from it, which is the oldest trick there is
  // for making a curved thing look curved. It is arithmetic on each stroke's
  // own colour — a multiply, where the sheen is a screen, light removed rather
  // than light added — so nothing is painted on top and the rule holds.
  //
  // The feather's real geometry stays FLAT and everything is solved on it as
  // before: the landing, the outline, the crown, the marks. Camber is a
  // projection applied at the moment of drawing, which is why every barb keeps
  // both its true control points and its drawn ones. A mark lives on the
  // feather, not on the picture of it, so the specks and the eye go on reading
  // the true ones and shear with the vane exactly as they did.
  //
  // The DOWN is left flat on purpose. A plumaceous barb is not part of the
  // vane's sheet — it fluffs in every direction there is — so projecting it
  // onto one surface would be a worse lie than leaving it alone.
  const camR = camber > 0 ? (vaneW*latK)/(camber*1.15) : 0;
  const camMap = a => {
    if(!camR) return a;
    const th = Math.max(-1.40, Math.min(1.40, a/camR));   // never fold right over
    return camR*Math.sin(th);
  };
  // THE LIGHT, which wants to come from well off to one side and not from
  // just beside the eye. A lamp near face-on puts the cosine's crest in the
  // middle of the vane, so the near web hardly brightens at all and the whole
  // effect is shadow on the far web — a vane that has been dirtied down one
  // side rather than turned. Set the lamp out at about the angle the margin
  // itself reaches and the term runs MONOTONE across the feather: brightest at
  // the near margin, mid at the shaft, falling to the far one. Which is what a
  // cupped thing looks like.
  //
  // It is normalised on the shaft, so the middle of the vane keeps the colour
  // it was dyed and the camber only ever says which way a stretch is turned.
  // And quantised, because a gradient is paths: the walk can only fold
  // stretches that come out the same colour, and light that never repeats
  // never folds. Twenty steps is below what the eye reads on a hairline.
  const CAM_LIGHT = -1.0, CAM_L0 = Math.cos(CAM_LIGHT);
  const camLit = at => {
    if(!camR) return 1;
    const k = 1 + camber*0.24*(Math.cos(at/camR - CAM_LIGHT) - CAM_L0);
    return Math.round(Math.max(0.62, Math.min(1.16, k))*40)/40;
  };

  const pBase = (1-peak)*tipReach/(vaneW*latK);
  const pApex = apexType===2 ? Math.max(2.5, pBase*1.15)
              : Math.max(1.4 + apexDeg*0.6, pBase*(0.6 + apexDeg*1.2));
  const kFine = 0.9 + apexDeg*1.3;
  const BASE_SHOULDER = 0.17;   // the vane's breadth where the barbs first strike
  function widthAt(t){
    if(t >= 1) return 0;
    let w;
    if(t < peak){
      const u = t/peak;
      w = Math.pow(Math.sin(u*Math.PI/2), 0.85);   // ease up to full — rounded, not angular
      // THE SHOULDER. That ease ran all the way to nothing at t = 0, so the
      // foot of every vane was drawn as a needle — and a vane does not come to
      // a point at the bottom. It BEGINS, at the superior umbilicus, at a
      // definite width, and the lowest barbs are already a fair reach long. On
      // a well-downed feather the fluff stands in front of this and you never
      // see it; on a feather with little down the spear was the whole of the
      // base. So the ease is lifted onto a shoulder and the vane starts where
      // the barbs start.
      w = BASE_SHOULDER + (1-BASE_SHOULDER)*w;
    } else {
      const u = (t-peak)/(1-peak);
      w = apexType===1 ? Math.pow(1-u, kFine)
                       : Math.sqrt(Math.max(0, 1 - Math.pow(u, pApex)));
    }
    return Math.max(0, w) * vaneW;
  }
  // the truncate scissors: the cut sits on a growth contour, and the degree
  // is the corner's radius — the smoothing of min(outline, shear) where the
  // side of the vane meets the cut edge
  const gCut = 0.96;
  const cornerR = (0.02 + apexDeg*0.22)*tipReach;
  function smin(a,b,k){ const h=Math.max(0, 1-Math.abs(a-b)/k); return Math.min(a,b) - h*h*k*0.25; }
  // per-side breadth: asymmetry steals width from the leading (right) side, gives to trailing
  function sideWidth(t, side){
    const base = widthAt(t);
    if(side>0) return base * (1 - asym*0.62);   // leading edge narrower
    return base * (1 + asym*0.42);              // trailing edge broader
  }

  // THE DOWN'S OWN BREADTH — because a plumaceous barb obeys no outline.
  // A vane barb is cut where it MEETS the envelope, and that is right, because
  // its neighbours hold it there. A downy barb is held by nothing: it is a
  // cloud, not a web, and it reaches as far as it grew. Reading its length off
  // the vane's envelope instead — which eases to nothing at the base — tapered
  // the down to the same needle the vane made, so a feather narrowed to a
  // spike at the foot however much fluff you gave it.
  // So the down carries a plump lens of its own: broad through the middle of
  // the plumaceous zone, rounding off where it meets the calamus, and never
  // narrower than the vane it hands over to — which is what keeps the join
  // seamless, since the lens closes to nothing exactly where the vane takes up.
  // Given as a barb LENGTH rather than a half-breadth, because that is what
  // the fluff is measured in: how far this barb goes on past where the vane
  // gave out.
  // It is the LENS ALONE and nothing else — no floor of the vane's own width
  // under it. A floor read at the barb's ROOT exceeds the barb's real length
  // everywhere above the vane's widest point, where the envelope is closing;
  // so a floor put fluff on every barb in the top third of the feather, and
  // the specimen came out standing in a cloud of thistledown. The lens closes
  // to nothing at the top of the plumaceous zone, which is all the continuity
  // the join needs, the firm stretch having already grown to the whole barb
  // by then.
  function downReach(t, side){
    if(downFrac <= 0) return 0;
    const x = t/downFrac;
    if(x >= 1) return 0;
    // No secant. This is a LENGTH and vaneW is already one — latK is the
    // across-vane SHARE of a length, so dividing by it here multiplied the
    // down by sec(comb): 1.06 at twenty degrees, 3.24 at seventy-two. Which is
    // why a steeply combed feather grew fluff at what looked like an
    // exponential rate, and why it looked fine everywhere else. The comb sets
    // the direction a downy barb leaves in. It has no business setting how far
    // it goes: a plumaceous barb is bounded by no outline, so its length is
    // the feather's business and nobody else's.
    return vaneW*0.82*Math.pow(Math.sin(Math.PI*x), 0.45);
  }

  // a point on the vane's outline — the fan lands its barbs here, and wants
  // the outline's own direction so their arcs can arrive along it
  function outlineAt(tt, side){
    const p = rachisPt(tt); const w = sideWidth(tt, side)*latK;
    return { x: p.x + p.norm.x*side*w, y: p.y + p.norm.y*side*w };
  }

  // THE LANDING — where a barb, combed off the shaft at t and running at its
  // own angle, MEETS the vane's outline. Solved by BISECTION on the landing
  // parameter: the residual (h−t)/climb − width(h) starts negative at the root
  // and ends positive at the apex, and rises all the way, so a bracket can
  // always be halved onto the crossing. The old damped fixed point was fine
  // down the shaft and rang wherever the envelope turned steep — which is the
  // whole of a crown — so the last rows of a rounded tip landed out of order,
  // some of them BELOW the row beneath. That was the lumps.
  function landAt(t, side, ang){
    const climb = Math.sin(ang)/tipReach;
    let lo = t, hi = Math.min(1, t + vaneW*1.7*climb);
    for(let i=0;i<16;i++){
      const mh = (lo+hi)/2;
      if((mh-t)/climb - sideWidth(mh, side) < 0) lo = mh; else hi = mh;
    }
    return (lo+hi)/2;
  }

  // THE CROWN — a rounded apex closes by WRAP, and a wrap has a LENGTH. Sample
  // the outline from the tip zone up over the apex and keep its running arc, so
  // the fan can share the dome out evenly among the barbs that have to cover
  // it. Two things were wrong before, and both were about that length: the old
  // fan hauled every tip-zone barb toward one point near the axis — the knot at
  // the crown, and the nested chevrons combed down the middle of it — while the
  // top sixth of the dome's arc was never reached by anything at all, which is
  // why a fan was wanted in the first place.
  const CROWN_N = 64;
  function buildCrown(side){
    const pts = [], cum = [0];
    for(let i=0;i<=CROWN_N;i++) pts.push(outlineAt(TIP_ZONE + (i/CROWN_N)*(1-TIP_ZONE), side));
    for(let i=1;i<=CROWN_N;i++) cum.push(cum[i-1] + Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y));
    return { pts, cum, total: cum[CROWN_N] };
  }
  // the map runs both ways: a landing parameter to its arc, and an arc back to
  // a point with the outline's own heading, so a barb can ARRIVE along the dome
  function crownArcAt(cr, h){
    const f = Math.max(0, Math.min(CROWN_N, (h-TIP_ZONE)/(1-TIP_ZONE)*CROWN_N));
    const i = Math.min(CROWN_N-1, Math.floor(f));
    return cr.cum[i] + (cr.cum[i+1]-cr.cum[i])*(f-i);
  }
  // wear beyond missing barbs: a flown feather UNZIPS — neighbouring barbs
  // let go of one another and the vane edge bites in a V-shaped notch. The
  // notches live on their own stream (like the fluff) so a specimen's vane
  // identity — its wear gaps, its jitter — stays exactly put.
  const nrng = mulberry((drawSeed ^ 0x51633E2D) >>> 0);
  const notches = [];
  for(let i=0, n=Math.floor(wear*7); i<n; i++){
    notches.push({ tc: 0.15+nrng()*0.8, side: nrng()<0.5?1:-1,
                   ht: 0.015+nrng()*0.05, dp: 0.3+nrng()*0.55 });
  }
  function notchFactor(t, side){
    let f = 1;
    for(const nt of notches){
      if(nt.side!==side) continue;
      const dd = Math.abs(t-nt.tc);
      if(dd < nt.ht) f = Math.min(f, 1 - nt.dp*(1-dd/nt.ht));
    }
    return f;
  }

  // rachis drifts toward the leading edge under asymmetry
  const rachisShift = asym * vaneW * 0.22;
  function rachisPt(t){ const p=rachis(t); const tan=rachisTangent(t); const norm={x:-tan.y,y:tan.x};
    return { x:p.x + norm.x*rachisShift, y:p.y + norm.y*rachisShift, tan, norm }; }

  // the crown is measured now the rachis frame it hangs on is settled
  const crownR = apexType===0 ? buildCrown(1)  : null;
  const crownL = apexType===0 ? buildCrown(-1) : null;
  // THE GAUGE — the rows are spaced by the BARB, not by the shaft.
  //
  // The rows used to be ruled flat up the rachis, t = i/(n−1), so the gap
  // between neighbours was the same number of pixels everywhere. That sounds
  // even and it is not, because a gap is not read in pixels. It is read
  // against the thing it is a gap IN, and the barbs get short at both ends of
  // a feather while the gaps do not. Measured on a plain specimen, the gap as
  // a fraction of a barb's own length:
  //
  //        mid-vane   t=0.8    t=0.9
  //   rounded    3.8%    5.3%    13.2%
  //   acuminate  4.0%   16.6%    59.4%
  //
  // Two and a half pixels between eighty-five-pixel barbs is a silky weave.
  // The same two and a half pixels between five-pixel barbs is a comb with
  // teeth, and on an acuminate the gaps up there ran longer than half a barb.
  // Which is why every tip in this tool read as a fish bone however far the
  // density slider went: the density slider was buying rows in the one place
  // that already had enough of them.
  //
  // So the pitch follows the barb's length and the weave holds ONE GAUGE from
  // calamus to crown. Where the vane narrows the rows crowd, in exactly the
  // proportion the narrowing asks for, and nothing else in the tool has to be
  // told about it. The density slider stops being a count of rows and becomes
  // what it always meant: the gauge of the weave, set at the broadest part.
  //
  // It replaces the crown's sub-rows, which were this idea at one-third of the
  // resolution — an integer of 1, 2 or 3, measured only over a rounded dome,
  // and reading 1 nearly always. The right instinct, asked of the wrong
  // quantity: it is not the crown that wants more rows, it is every place a
  // barb is short, and the acuminate that wanted them most was never asked.
  const blRaw = t => {
    let bl = ((landAt(t, 1, barbAngle) - t) + (landAt(t, -1, barbAngle) - t))
             * 0.5 * tipReach / Math.sin(barbAngle);
    // a truncate's barbs are cut by the shear long before the outline would
    // have stopped them, so the gauge reads the length they actually get
    if(apexType===2) bl = Math.min(bl, Math.max(0, (gCut - t)*tipReach));
    return Math.max(1e-3, bl);
  };
  let blPeak = 1e-3;
  for(let i=0;i<=40;i++) blPeak = Math.max(blPeak, blRaw(i/40));
  // THE GAUGE READS THE VANE, AND THE VANE BEGINS WHERE THE DOWN ENDS.
  //
  // A gauge is a gap measured against a barb, and that only means anything
  // where the barbs are holding on to one another. A plumaceous barb is held
  // by nothing and obeys no outline — it is a cloud, not a web — so there is
  // no gap to keep in proportion, and crowding rows down there buys nothing
  // but more fluff to hide behind the fluff already in front of it. Measured,
  // that was two thirds of what the gauge cost and none of what it bought: the
  // down wisps and the downy barbs went up by fourteen kilobytes a specimen
  // for a thickening no one could see through the cloud standing over it.
  //
  // So below the down line the rows keep the plain pitch, and the gauge starts
  // where the vane does. One more thing the plumaceous zone is simply not the
  // business of.
  const blAt = t => t < downFrac ? blPeak : blRaw(t);
  // and a floor under the crowding, because the gauge is a proportion and a
  // proportion of nothing is nothing: at the very point of an acuminate the
  // barbs go to zero length and an unfloored gauge would grind there forever.
  const GAUGE_FLOOR = 0.40;
  const gauge = t => Math.max(GAUGE_FLOOR, Math.min(1, blAt(t)/blPeak));
  // AND A BUDGET, because a gauge is a proportion and a proportion will happily
  // spend whatever it is given. A long acuminate is narrowing over half its
  // length, so at the bare gauge half the feather asks for the floor's full
  // two-and-a-half times the rows, and the worst specimen on the moor went up
  // by a fifth for a crowding past the point the page can show. So the row
  // count is predicted first, and if it overruns, the whole pitch opens by the
  // one factor: the gauge keeps its SHAPE — the tip still crowds exactly as
  // much more than the mid-vane as the barbs there are shorter — and the
  // feather keeps to something near the count the density slider asked for.
  // A redistribution with a cap on it, rather than a multiplication.
  const MAX_MULT = 1.75;
  let want = 0;
  for(let i=0;i<64;i++) want += 1/gauge((i+0.5)/64);
  const over = Math.max(1, want/64/MAX_MULT);
  const rows = [];
  for(let t = 0; t < 1 && rows.length < 1400; ){
    rows.push(t);
    t += over * gauge(t) / Math.max(1, nBarbs-1);
  }
  if(rows[rows.length-1] < 0.999) rows.push(1);
  // ================= THE MELANGE =================
  //
  // Every barb in an unmarked vane wore EXACTLY the same colour as every other
  // one, and a feather is not that. A feather is a melange. The tone shifts
  // barb to barb, in soft patches a few barbs across, and that shifting is a
  // good part of what tells the eye a vane is a sheet of separate things at
  // slightly different depths rather than an area of one colour.
  //
  // It is free, which is why it went unnoticed for so long. The walk folds
  // stretches WITHIN a barb that come out the same colour; it has never folded
  // anything BETWEEN barbs, because a barb is its own path either way. So a
  // tone that varies per barb costs nothing at all — not a path, barely a byte
  // — and a tone that varied ALONG a barb would cost a fortune. Which settles
  // the scale of the thing without anyone having to have an opinion: the
  // melange is per barb, and a barb wears one tone from shaft to tip.
  //
  // Happily that is also the right scale. A barb is what the follicle lays
  // down in one go, so a barb is the unit that would vary.
  //
  // It is SMOOTH, not static: a patch of noise about nine barbs across, so the
  // vane mottles in soft bands rather than fizzing. Read on the signed side, so
  // the two webs mottle differently instead of mirroring each other about the
  // rachis, which is the marbling's lesson borrowed one section over. And it
  // rides its own hash rather than the row's, because the row's number already
  // ragges the bars, and a vane whose darker barbs were also the ones with the
  // ragged bar edges would be showing a correlation no bird has.
  //
  // And it scales with the pigment there is to vary. Melange is uneven pigment
  // deposition, so a vane with little pigment has little to be uneven with: a
  // white feather's barbs really are all the same colour, and the multiply
  // rather than the offset is what says so.
  const mhash = i => { const n = Math.sin(i*127.1 + 311.7)*43758.5453; return n - Math.floor(n); };
  const msmooth = x => { const i = Math.floor(x), f = x-i, u = f*f*(3-2*f);
    return mhash(i)*(1-u) + mhash(i+1)*u; };
  // AND IT IS TWO THINGS, because barb-to-barb variation on a real feather is
  // two things. A barb carries a little more or less PIGMENT than its
  // neighbour, which moves it along the ground-to-shade ramp; and a barb sits
  // at a slightly different angle to the light, because a vane is a sheet of
  // separate stiff things and not a surface, which moves its LIGHTNESS
  // whatever it is dyed.
  //
  // They behave differently and both are needed. The pigment term scales with
  // the pigment there is to vary — a white feather's barbs really are all the
  // same colour, and a multiply rather than an offset is what says so. The form
  // term does not, because a white feather's barbs are as three-dimensional as
  // anybody's, and it is the one that carries most of the effect: it is what
  // stops a vane reading as an area of colour with lines ruled on it.
  //
  // (The camber says the same thing one order up — it turns the whole web to
  // the light and shades it across. This is that argument at the scale of the
  // single barb, where the camber's smooth cosine has nothing to say because
  // two neighbours are at very nearly the same across-distance. The feather is
  // curved; it is also, close up, slightly rough.)
  const MEL_CELL = 9;        // how many barbs a patch of one tone runs across
  const MEL_PIG  = 0.40;     // the pigment term, as a share of the barb's own
  const MEL_LUM  = 0.13;     // the form term, as a share of the barb's light
  const melAt = (t, side, off) => {
    const x = t*Math.max(1, nBarbs-1)/MEL_CELL + (side>0 ? 0 : 53.7) + off;
    return (msmooth(x)-0.5)*1.6 + (mhash(Math.floor(x*997)+11)-0.5)*0.4;
  };
  // the SHADE DEPTH: how much of the shade tone the plain vane carries. The base
  // coat was 0.15 at the tip rising to 0.50 at the foot; the dial scales it, 30
  // reproducing that exactly ('as grown'), 0 leaving the plain vane at pure ground
  // (marks still show), and up toward the whole vane going to shade. The marks
  // ride on top of this in pigAt, so they always sit deeper — until this is wound
  // so high the base clamps at shade and swallows them, which is the disaster the
  // slider is honest enough to allow.
  const shadeGain = (+P.shadedepth.value) / 30;
  const groundAt = (t, side) => (0.15 + (1-t)*0.35) * shadeGain * (1 + MEL_PIG*melAt(t, side, 0));
  const lumAt    = (t, side) => 1 + MEL_LUM*melAt(t, side, 211.3);

  const barbLines = [];
  for(let ri=0; ri<rows.length; ri++){
    const t = rows[ri];
    if(t < 0.04) continue;
    const rp = rachisPt(t);
    const up = rp.tan, norm = rp.norm;

    // as a barb nears the tip its TIP is drawn toward the end of the rachis,
    // so the two sides fan over and close the tip with barbs rather than
    // with the rachis (Streit & Heidrich's fanned tip). The pull is on the
    // endpoint, not the length — a lengthened barb at an unturned angle was
    // what used to poke sideways past the envelope and bulge under the apex.
    const tf = t <= TIP_ZONE ? 0 : (t - TIP_ZONE) / (1 - TIP_ZONE);
    const sw = tf*tf*(3 - 2*tf);   // smoothstepped, so the pull arrives seamlessly

    // a deterministic per-row hash, kept off the main rng so the marks it
    // ragges never jog the wear or the jitter. The BARS used to be worked out
    // here and painted onto the whole barb; they have moved into the marking
    // frame below, where they belong.
    const hsh = Math.sin(t*311.7 + nBars*57.3)*43758.5;
    const rowN = hsh - Math.floor(hsh);   // 0..1 stable per barb-row

    for(const side of [1,-1]){
      const wearChance = wear * (0.4 + 0.6*t);
      if(rng() < wearChance*0.5){ continue; }

      // THE GROWTH CONTOUR, and the thing it decides.
      //
      // Plumaceous and pennaceous are properties of the BARBULES, not of the
      // barb. A ramus runs unbroken from shaft to tip; what changes along it is
      // whether the barbules it carries are short and hooked — a vane — or long
      // and free — down. So the boundary between them cannot be a waterline in
      // t, a flat line ruled across the feather with all fluff below it and all
      // vane above, which is what it was. It is a GROWTH CONTOUR: everything
      // the follicle laid down at one moment, level at the rachis and drooping
      // toward the base out along each web. Which is the terminal band's own
      // chevron, and a feather has only the one.
      //
      // That makes the plumaceous fraction of a barb a very small sum, because
      // the landing solve has already done the work. It knows this barb's
      // growth coordinate at its root (t) and at its tip (hLand). The boundary
      // lies somewhere between the two, and all we want is how far along:
      //
      //     uDown = (downFrac − t) / (hLand − t)
      //
      // At or below 0 the barb is wholly vane. At or above 1 the boundary is
      // past its tip and the barb is wholly down. In between — over a band as
      // deep as one barb's own climb, which is a far better transition than the
      // hard-coded 0.08 the old fringe used — the barb is downy at the base and
      // zipped further out, which is exactly what the lower vane of a contour
      // feather does. No trigonometry: the climb was already solved for.
      // WHICH END OF A BARB IS THE DOWNY ONE — and the pheasant settled it
      // against the textbook, which is the right way round for that argument.
      //
      // Yesterday's guess put the plumaceous stretch at the barb's BASE, next
      // to the shaft, with the vane taking over further out. Held up to a real
      // feather that is backwards. The lowest barbs that carry barbules at all
      // are firm where they leave the shaft and fade to down at their OUTER
      // ends; the firm share grows as you climb, until it is the whole barb.
      // Which is why the boundary between down and clean vane is a V — lowest
      // where it crosses the rachis, rising out along each web — and not the
      // level line the first pass drew.
      //
      // And it is not a new mechanism at all. Every barb in this tool already
      // goes bare at its far end: the ranks shorten hard over the last third,
      // which is what keeps a vane's margin a sawtooth of tips and not a fuzz.
      // The plumaceous base is THAT, grown. Slide the bare fraction back down
      // the barb and the vane gives out earlier and earlier, until at the foot
      // of the feather there is no firm part left and the barb is all down.
      // One number, read at two depths: a crisp margin at the top of a feather
      // and a cloud at the bottom of it are the same fact about a barb.
      const halfW = sideWidth(t, side);
      const landVane = landAt(t, side, barbAngle);
      // the firm share: nothing at all through most of the plumaceous zone —
      // that is the pure down, barbs that never harden — and then climbing to
      // the whole barb over the last third of it. Held against a real feather
      // the changeover is QUICK: a broad block of down, a narrow band where
      // the two argue, and then clean vane. A ramp spread over the whole zone
      // drew a deep V; the thing itself is a shallow one.
      const xf = downFrac>0 ? Math.min(1, t/downFrac) : 1;
      const q = Math.max(0, (xf - 0.68)/0.32);
      const uFirm = q*q*(3-2*q);             // how much of this barb is vane
      const allDown = uFirm <= 0.02;
      // down sweeps more upright than the vane does — but never past the
      // vertical, which a bare 1.5× reaches at a comb of sixty degrees and
      // then walks backwards over the far web
      const ang = allDown ? Math.min(barbAngle*1.5, 1.30) : barbAngle;
      const dirx = norm.x*side*Math.cos(ang) + up.x*Math.sin(ang);
      const diry = norm.y*side*Math.cos(ang) + up.y*Math.sin(ang);
      const m = Math.hypot(dirx,diry)||1;
      let bl = halfW, hLand = landVane;
      if(allDown){
        bl = downReach(t, side)*(1.1+rng()*0.5);
      } else {
        // a barb is cut where it MEETS the outline, not to the envelope at
        // its root: a barb climbs as it reaches out, and the silhouette is
        // drawn by tips, not roots. Reading the envelope at the root let a
        // shoulder-rooted barb on a short broad feather climb clean past
        // the crown at full breadth — the square-shouldered fat head — so
        // the landing is solved instead (see landAt: bisection, which holds
        // where the old damped iteration rang itself apart on a steep crown).
        bl = (hLand - t)*tipReach/Math.sin(ang);
        if(apexType===2){
          // the truncate shear: a barb grows only until the scissors'
          // contour — level with the cut at the rachis, drooping gently
          // toward the base out along each web, the terminal band's own
          // chevron. The smooth minimum rounds the corner where the cut
          // edge meets the side of the vane.
          const shear = (gCut - t)*tipReach;
          if(shear < 1) continue;
          bl = smin(bl, shear, cornerR);
          if(bl < 1) continue;
        }
        bl *= notchFactor(t, side);   // the unzipped vane bites in
        bl *= uFirm;                  // ...and the vane gives out at the contour
        // a barb too short to read as a stroke renders as a floating dot —
        // the acuminate needle's last reaches are carried by the sprig of
        // bare shaft instead (drawn with the quill), so let the dots go. In a
        // rounded tip zone the judgement waits: there a barb's REACH is the
        // fan's to give, and the last rows are near nothing until it does.
        if(bl < 1.4 && !(apexType===0 && sw>0)) continue;
      }

      // the growth coordinate of this barb's far end, read off the length it
      // ACTUALLY got — so a notched, sheared or contour-shortened barb carries
      // its markings at the height it really reaches, not the height it would
      // have reached unmolested
      hLand = t + bl*Math.sin(ang)/tipReach;

      // jitter, held to a constant width of wobble: a steep barb runs nearly
      // along the shaft, so the same angular shake used to swing its tip far
      // wider of the vane edge — that was the scruff. Scale the shake back by
      // the slope so the edge stays equally calm at every barb angle.
      const jAmp = allDown ? ang*0.9 : 0.12*Math.min(1, 1.035/Math.tan(ang));   // 1.035 = tan 46°
      const jitter = (rng()-0.5)*jAmp;
      const ca=Math.cos(jitter), sa=Math.sin(jitter);
      const rx=(dirx*ca-diry*sa)/m, ry=(dirx*sa+diry*ca)/m;
      let ex=rp.x+rx*bl, ey=rp.y+ry*bl;

      // the closing fan — the ROUNDED family only. A dome is the one apex that
      // closes by WRAP; a point closes by taper and a cut by shear, and neither
      // wants its barbs bent toward the crown at all.
      //
      // And the fan turns out to want LESS than it was taking. It used to drag
      // every tip-zone barb's endpoint toward a target near the axis, because
      // the old landing solve gave out over a crown and left the top sixth of
      // the dome unreached — so something had to haul the strokes up there. With
      // the landing solved properly (see landAt) the plain comb walks the whole
      // dome by itself, right over the apex, at an even three pixels a tip; the
      // haul was fixing a solve, and it cost a knot at the crown and a ladder of
      // nested chevrons down the middle of it. So the fan keeps only the part
      // that was ever its own: a barb LEAVES the shaft like its unfanned
      // neighbours and ARRIVES skimming the crown, which is curvature, not
      // position. Its tip is where the comb put it.
      let fanPull = 0, ftx = 0, fty = 0;
      if(apexType===0 && sw>0 && !allDown){
        const dd = 0.006;
        const o1 = outlineAt(Math.max(peak, hLand-dd), side);
        const o2 = outlineAt(Math.min(1, hLand+dd), side);
        ftx = o2.x-o1.x; fty = o2.y-o1.y;
        const fm = Math.hypot(ftx,fty)||1; ftx/=fm; fty/=fm;
        fanPull = sw;
      }

      const vx=ex-rp.x, vy=ey-rp.y, vl=Math.hypot(vx,vy);
      if(!allDown && vl < 1.4) continue;    // the dots go, measured on what is drawn
      let midx=rp.x+vx*0.5+up.x*vl*0.18, midy=rp.y+vy*0.5+up.y*vl*0.18;
      if(fanPull>0){
        // a fanned barb LEAVES the shaft like its unfanned neighbours and
        // ARRIVES skimming the outline: the arc's control point is where
        // those two directions cross. It fades in with the pull so the zone's
        // edge stays seamless. A wild crossing (near-parallel directions, which
        // is every barb once the dome turns over) is CLAMPED back into range
        // rather than thrown away — thrown away, it snapped the barb back to a
        // plain straight chord partway up the crown, and the seam between the
        // bent ones and the straight ones was its own kind of lump.
        const den = ry*ftx - rx*fty;
        if(Math.abs(den) > 0.004){
          const a = Math.max(0.2*vl, Math.min(1.15*vl, (vy*ftx - vx*fty)/den));
          midx += (rp.x + rx*a - midx)*fanPull;
          midy += (rp.y + ry*a - midy)*fanPull;
        }
      }

      // the barb's own ground tone. Every MARK it wears is decided later, in
      // the rachis frame, at the place on the page each stretch of it occupies.
      const ground = groundAt(t, side), lum = lumAt(t, side);
      let col = mix(pig1, pig2, Math.min(1, ground));
      if(allDown) col = mix(col, {r:200,g:190,b:170}, 0.25);

      if(allDown){
        // down is not a stroke but a wander — wildest deep in the plumage,
        // calming as it climbs toward the vane so the join doesn't snap.
        const fluff = 0.35 + 0.65*Math.max(0, 1 - t/downFrac);
        barbLines.push({
          d: strand(rp.x, rp.y, rx, ry, bl, fluff),
          downy: true, t, col: rgbStr(col),
          dw: 0.5+drng()*0.3, dop: 0.36+drng()*0.22
        });
      } else {
        // the drawn barb is the true barb, projected: only the ACROSS part of
        // each point is bent, in this barb's own root frame, which is the frame
        // the whole barb was built in anyway
        let dmx=midx, dmy=midy, dex=ex, dey=ey;
        if(camR){
          const bend = (px,py) => {
            const ax = (px-rp.x)*norm.x + (py-rp.y)*norm.y;
            const al = (px-rp.x)*up.x   + (py-rp.y)*up.y;
            const a2 = camMap(ax);
            return [rp.x + norm.x*a2 + up.x*al, rp.y + norm.y*a2 + up.y*al];
          };
          [dmx,dmy] = bend(midx,midy); [dex,dey] = bend(ex,ey);
        }
        barbLines.push({
          d:`M ${rp.x.toFixed(1)} ${rp.y.toFixed(1)} Q ${dmx.toFixed(1)} ${dmy.toFixed(1)} ${dex.toFixed(1)} ${dey.toFixed(1)}`,
          downy: false, t, rowN, hLand, ground, lum, col: rgbStr(col), rgb: col, ri, side, ux: up.x, uy: up.y,
          rpx:rp.x, rpy:rp.y, mx:dmx, my:dmy, ex:dex, ey:dey,   // as drawn
          tmx:midx, tmy:midy, tex:ex, tey:ey                    // as grown
        });
        // THE DOWNY CONTINUATION — where the vane gave out, the barb carries
        // on as fluff. It leaves from the far end of the firm stretch, not
        // from the shaft, and it runs to the down's own reach: so the lower a
        // barb sits, the shorter its vane and the longer its tail of down,
        // and at the foot of the feather there is nothing else left.
        const dr = downReach(t, side);
        if(dr > bl + 1.5){
          const fx = rp.x + rx*bl, fy = rp.y + ry*bl;
          barbLines.push({
            d: strand(fx, fy, rx, ry, (dr-bl)*(0.85+drng()*0.4), 0.9),
            downy: true, t, col: rgbStr(mix(col,{r:200,g:190,b:170},0.35)),
            dw: 0.5+drng()*0.2, dop: 0.16 + 0.30*(1-uFirm)
          });
        }
      }
    }
  }

  // a point on a barb's own quadratic — every mark in this tool walks the barbs
  // it is grown from, and now the knit and the sheen do too
  const qAt=(a,b,c,s)=>{const mt=1-s;return mt*mt*a+2*mt*s*b+s*s*c;};

  // A barb has two sets of points now: the ones it GREW as, which every mark
  // and the sheen are tested against, and the ones the camber DRAWS it at.
  const tAt = (b,u) => [qAt(b.rpx,b.tmx,b.tex,u), qAt(b.rpy,b.tmy,b.tey,u)];
  // and the light the camber throws on a point, read off its true across-distance
  // the light on a point of a barb: the camber's cosine for where the web is
  // turned, times the barb's own share of the melange for how IT is turned
